<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" id="app-favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23120e0a' stroke='%238a6230' stroke-width='3'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif' font-weight='800' font-size='28' fill='%23e8a33d'%3EBD%3C/text%3E%3C/svg%3E" />
    <title>BunkerDay.com — Supervivencia en el búnker</title>
    <meta name="description" content="BunkerDay.com: administra energía, aire, agua, cultivos y averías en un búnker subterráneo tras el apocalipsis." />
    <meta property="og:title" content="BunkerDay.com — Supervivencia en el búnker" />
    <meta property="og:description" content="Despierta el refugio subterráneo sistema a sistema y sobrevive un día más." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@700;800&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- la foto principal del búnker se pide desde el primer instante y con
         prioridad alta: es la única imagen que el juego necesita para salir
         de la pantalla de carga -->
    <!-- Nuevo búnker generado en alta definición (1168x2112) -->
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      * { box-sizing: border-box; }
      :root{
        --bg:#0a0c0a; --panel:#151815; --panel2:#1e221e; --line:#2e332c;
        --ink:#e3e0d2; --dim:#a5a294; --faint:#716e60;
        --amber:#e8a33d; --amber2:#c97f22; --green:#7fb069; --red:#e0524d; --blue:#5aa9c9; --teal:#57b7a3;
        --dock-bg:#141714;
      }
      html,body{ background:var(--bg); height:100%; overflow:hidden; overscroll-behavior:none; }
      body{ margin:0; color:var(--ink); font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:15px; line-height:1.45;
        display:flex; flex-direction:column; height:100dvh; overflow:hidden; }

      /* ---------- escenario ---------- */
      /* el lienzo ocupa TODA la pantalla (cover sobre el viewport entero,
         sin deformar): el dock va superpuesto encima, tan delgado que
         casi no tapa nada del búnker */
      .stage{ position:fixed; inset:0; width:100%; height:100dvh; background:#171310; overflow:hidden; z-index:0; }
      canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
      .toast{ position:absolute; top:calc(62px + env(safe-area-inset-top)); left:50%; transform:translate(-50%,-8px); max-width:min(92%, 520px);
        background:rgba(14,16,14,.92); border:1px solid var(--line); border-left:3px solid var(--amber);
        color:var(--ink); font-size:13.5px; padding:9px 14px; border-radius:10px; text-align:center;
        opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease; z-index:5; }
      .toast.show{ opacity:1; transform:translate(-50%,0); }
      .toast.bad{ border-left-color:var(--red); } .toast.good{ border-left-color:var(--green); }
      .toast b{ color:var(--amber); font-weight:600; }
      .exped-banner{ position:absolute; top:calc(58px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); width:min(94%, 540px);
        background:rgba(13,16,13,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:13px; padding:10px 13px; z-index:4;
        box-shadow:0 12px 32px rgba(0,0,0,.6); }
      .exped-banner[hidden]{ display:none; }
      .exped-banner .row{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12.5px; flex-wrap:wrap; }
      .exped-banner .bar{ margin-top:6px; height:8px; }
      .exped-banner button{ background:var(--amber2); border:1px solid var(--amber); color:#171106; font:inherit; font-weight:600;
        font-size:12.5px; padding:5px 11px; border-radius:8px; cursor:pointer; min-height:34px; }
      .exped-banner button.sec{ background:rgba(30,35,30,.92); border-color:var(--line); color:var(--ink); font-weight:500; }
      .exped-banner button.sec:hover:not(:disabled){ border-color:var(--amber); }
      .exped-banner button:disabled{ opacity:.45; cursor:not-allowed; }
      .exped-obj{ margin-top:6px; padding:5px 9px; border-radius:8px; font-size:12px; display:flex; align-items:center; justify-content:space-between; gap:8px;
        background:rgba(48,22,18,.82); border:1px solid rgba(224,82,77,.55); color:#f7c5c2; }
      .exped-obj.found{ background:rgba(20,42,24,.85); border-color:rgba(127,176,105,.65); color:#cde8c1; }
      .exped-obj[hidden]{ display:none; }
      .exped-spots{ display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
      .exped-spots button{ flex:1 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:5px; font-size:11.5px; padding:5px 8px; min-height:33px; }
      .exped-bag-row{ margin-top:7px; padding-top:6px; border-top:1px dashed #293028; display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11.5px; color:var(--dim); }
      .bag-chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:999px; background:#1c211b; border:1px solid #323930; color:var(--ink); font-size:11px; font-variant-numeric:tabular-nums; }
      .bag-chip.part{ background:rgba(58,42,18,.88); border-color:var(--amber); color:#ffe0a3; font-weight:600; }

      /* ---------- barras ---------- */
      .bar{ height:11px; background:#0a0c0a; border:1px solid var(--line); border-radius:6px; position:relative; overflow:hidden; }
      .bar > i{ position:absolute; inset:0; width:50%; background:var(--green); border-radius:6px; transition:width .25s linear; }
      .bar > i.warn{ background:var(--amber); } .bar > i.crit{ background:var(--red); }
      .bar.blue > i{ background:var(--blue); } .bar.amberb > i{ background:var(--amber); } .bar.tealb > i{ background:var(--teal); }

      /* ---------- dock inferior ---------- */
      /* franja superpuesta y muy delgada al pie de la pantalla: solo iconos,
         fondo oscuro semitransparente para que se intuya el búnker detrás */
      .dockwrap{ position:fixed; left:0; right:0; bottom:0; width:100%; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); z-index:10;
        background:transparent; pointer-events:none; }
      /* los paneles (Salud/Control/Clima/Explorar) se abren flotando DESDE el
         dock hacia arriba, anclados a su borde superior */
      .sheet{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(100% + 8px); z-index:30;
        width:min(640px, calc(100vw - 16px)); margin:0; background:var(--dock-bg);
        border:1px solid #353b32; border-top-color:#1c201b; border-bottom-color:#444b3f;
        border-radius:18px; padding:16px 18px 14px;
        box-shadow:inset 0 8px 18px #0a0c0a, 0 16px 42px rgba(0,0,0,.78);
        max-height:min(560px, calc(100dvh - 108px)); overflow-y:auto; pointer-events:auto; }
      .sheet[hidden]{ display:none; }
      .sheet h2{ font-family:"VT323",monospace; font-weight:400; font-size:24px; margin:0 0 4px; color:var(--amber); letter-spacing:.03em;
        display:flex; justify-content:space-between; align-items:center; }
      .sheet h2 .x{ background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; min-height:36px; min-width:40px; }
      .sheet .sub{ color:var(--dim); font-size:13px; margin:0 0 10px; }
      .bar-row{ display:grid; grid-template-columns:96px 1fr 58px; align-items:center; gap:10px; margin:7px 0; font-size:13px; }
      .bar-row .num{ text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); }
      /* bloque de energía: gasolina y carga de baterías, siempre visible al abrir Control */
      .stat-block{ background:rgba(10,12,10,.55); border:1px solid var(--line); border-radius:12px; padding:10px 12px 7px; margin:0 0 12px; }
      .stat-block .stat-title{ font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin:0 0 4px; }
      .stat-row{ display:grid; grid-template-columns:118px 1fr 96px; align-items:center; gap:10px; margin:7px 0; font-size:13px; }
      .stat-row .lbl small{ display:block; color:var(--dim); font-size:11.5px; }
      .stat-row .num{ text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); font-weight:600; white-space:nowrap; }
      .bar.big{ height:15px; }
      .bar.fuelb > i{ background:#d98a2b; }
      .bar.fuelb > i.warn{ background:#e06a2c; }
      .bar.fuelb > i.crit{ background:var(--red); }
      .bar.chargeb > i{ background:var(--green); }
      .bar.chargeb > i.warn{ background:var(--amber); }
      .bar.chargeb > i.crit{ background:var(--red); }
      @media (max-width:420px){ .stat-row{ grid-template-columns:96px 1fr 84px; gap:8px; font-size:12.5px; } }
      .sheet .acts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
      .abtn{ background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit; font-size:13.5px;
        padding:9px 14px; cursor:pointer; min-height:44px; border-radius:10px; display:inline-flex; gap:8px; align-items:center; }
      .abtn:hover:not(:disabled){ border-color:var(--amber); }
      .abtn:disabled{ opacity:.42; cursor:not-allowed; }
      .abtn .cost{ color:var(--amber); font-size:12px; white-space:nowrap; }
      .abtn.primary{ border-color:var(--amber2); background:#2a2113; }
      .res-grid{ display:grid; grid-template-columns:1fr 1fr; gap:5px 18px; font-size:13.5px; margin-top:6px; }
      .res-grid div{ display:flex; justify-content:space-between; border-bottom:1px dashed #262a24; padding:3px 0; }
      .res-grid b{ font-variant-numeric:tabular-nums; } .res-grid span{ color:var(--dim); }

      /* interruptores */
      .sw-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 2px; border-bottom:1px dashed #262a24; }
      .sw-row .lbl{ font-size:14px; } .sw-row .lbl small{ display:block; color:var(--dim); font-size:12px; }
      .switch{ flex:0 0 auto; width:58px; height:32px; border-radius:999px; border:1px solid var(--line); background:#0d0f0d;
        position:relative; cursor:pointer; padding:0; min-height:32px; transition:background .2s; }
      .switch::after{ content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
        background:#5b5e55; transition:left .2s, background .2s; }
      .switch[aria-checked="true"]{ background:#3a2c12; border-color:var(--amber2); }
      .switch[aria-checked="true"]::after{ left:29px; background:var(--amber); }
      .switch:disabled{ opacity:.4; cursor:not-allowed; }

      /* ---------- reloj y clima arriba a la derecha ---------- */
      .top-wx{ position:fixed; top:calc(10px + env(safe-area-inset-top)); right:10px; z-index:12;
        background:rgba(13,16,13,.80); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
        border:1px solid rgba(46,51,44,.88); border-radius:12px; padding:5px 10px;
        display:inline-flex; align-items:center; gap:8px; color:var(--ink); font:inherit; text-align:left;
        cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.45); touch-action:manipulation; min-height:40px; }
      .top-wx[hidden]{ display:none; }
      .top-wx:hover{ border-color:rgba(232,163,61,.55); }
      .top-wx.on{ border-color:var(--amber); background:rgba(30,34,30,.94); }
      #dock-wx-icon{ display:flex; align-items:center; justify-content:center; flex:0 0 auto; color:var(--amber); }
      #dock-wx-icon svg{ width:20px; height:20px; display:block; }
      .top-wx-txt{ display:flex; flex-direction:column; line-height:1.18; }
      .top-wx-txt b{ font-size:12px; color:var(--amber); font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
      .top-wx-txt small{ font-size:10.5px; color:var(--dim); white-space:nowrap; }
      .top-wx-txt small.cold{ color:#8cd7f5; font-weight:600; }
      .top-wx-txt small.freeze{ color:#f28884; font-weight:600; }
      .top-mute{ position:fixed; top:calc(56px + env(safe-area-inset-top)); right:10px; z-index:12;
        width:36px; height:36px; border-radius:10px; padding:0;
        background:rgba(13,16,13,.80); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
        border:1px solid rgba(46,51,44,.88); color:var(--ink); font:inherit;
        display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
        box-shadow:0 6px 18px rgba(0,0,0,.45); touch-action:manipulation; }
      .top-mute[hidden]{ display:none; }
      .top-mute:hover{ border-color:rgba(232,163,61,.55); }
      .top-mute.muted{ color:var(--dim); border-color:rgba(224,82,77,.45); }
      .top-mute svg{ width:18px; height:18px; display:block; }
      body.tut-active .top-mute{ top:calc(96px + env(safe-area-inset-top)); }

      .dock{ max-width:560px; margin:0 auto; background:rgba(13,16,13,.76); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
        border:1px solid rgba(46,51,44,.8); border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.45);
        display:flex; align-items:center; gap:6px; padding:4px 8px; pointer-events:auto; }
      .dbtn{ flex:0 0 46px; background:transparent; border:1px solid transparent; border-radius:11px; color:var(--dim);
        font:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center;
        padding:4px 2px; min-height:38px; position:relative; transition:color .2s, border-color .2s, background-color .2s; }
      .dbtn svg{ width:20px; height:20px; display:block; }
      .dbtn > span{ display:none; }
      .dbtn:hover{ color:var(--ink); }
      .dbtn.on{ background:rgba(30,34,30,.85); border-color:var(--line); color:var(--amber); }
      .dbtn.crit-blink{ color:#f27b77; border-color:rgba(224,82,77,.38); background:rgba(224,82,77,.09); }
      .dbtn.crit-blink svg{ animation:dockCritBlink 1.45s ease-in-out infinite; }
      .dbtn .badge{ position:absolute; top:4px; right:6px; width:8px; height:8px; border-radius:50%;
        background:var(--red); display:none; box-shadow:0 0 8px var(--red); }
      .dbtn .badge.show{ display:block; animation:pulse 1.1s infinite; }
      .dbtn .bag-cnt{ position:absolute; bottom:2px; right:3px; min-width:15px; height:15px; padding:0 3.5px;
        border-radius:999px; background:var(--amber2); border:1px solid #14110a; color:#141006;
        font-size:9.5px; font-weight:700; line-height:13px; text-align:center; font-variant-numeric:tabular-nums; }
      .dbtn .bag-cnt[hidden]{ display:none; }
      .bag-crisis{ background:rgba(46,19,16,.86); border:1px solid #a84942; border-left:3px solid var(--red); border-radius:11px; padding:10px 12px; margin:0 0 11px; font-size:12.5px; color:#f6c8c5; }
      .bag-crisis.ok{ background:rgba(20,38,23,.86); border-color:#4e8a42; border-left-color:var(--green); color:#d0ebd0; }
      .bag-crisis b{ color:#ffd175; }
      .bag-list{ display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:8px 0 10px; }
      @media (max-width:440px){ .bag-list{ grid-template-columns:1fr; } }
      .bag-card{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 10px;
        background:rgba(12,15,12,.78); border:1px solid var(--line); border-radius:10px; font-size:12.5px; }
      .bag-card.is-part{ border-color:rgba(232,163,61,.75); background:rgba(42,31,14,.68); }
      .bag-card-l{ display:flex; align-items:center; gap:7px; min-width:0; }
      .bag-card-l span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .bag-card-l b{ color:var(--amber); font-variant-numeric:tabular-nums; }
      .bag-mini-btn{ background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit; font-size:11.5px;
        padding:4px 8px; border-radius:7px; cursor:pointer; min-height:28px; white-space:nowrap; }
      .bag-mini-btn:hover{ border-color:var(--amber); color:var(--amber); }
      .rust-crisis-card{ margin:8px 0 6px; padding:9px 11px; border-radius:10px; background:rgba(48,18,15,.88);
        border:1px solid #b34840; color:#f7c4c0; font-size:12px; line-height:1.38; }
      .rust-crisis-card.ready{ background:rgba(22,42,24,.88); border-color:#5a9e4b; color:#d2ecd0; }
      .rust-crisis-card .rc-top{ display:flex; justify-content:space-between; align-items:center; gap:6px; font-weight:600; color:#ffd07a; margin-bottom:3px; }
      @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.45);} }
      @keyframes dockCritBlink{
        0%,100%{ opacity:1; filter:drop-shadow(0 0 5px rgba(224,82,77,.65)); }
        50%{ opacity:.36; filter:drop-shadow(0 0 1px rgba(224,82,77,.12)); }
      }

      /* barras visibles de hambre y sed en el dock inferior */
      .dock-needs{ flex:1 1 auto; min-width:0; display:grid; grid-template-columns:1fr 1fr; gap:10px;
        padding:4px 10px; background:rgba(10,12,10,.55); border:1px solid rgba(46,51,44,.7); border-radius:11px; }
      .need-item{ min-width:0; display:flex; flex-direction:column; gap:3px; }
      .need-top{ display:flex; align-items:center; justify-content:space-between; gap:5px; font-size:11px; line-height:1; }
      .need-top span{ display:inline-flex; align-items:center; gap:3.5px; color:var(--dim); letter-spacing:.03em; white-space:nowrap; min-width:0; }
      .need-ico{ width:11px; height:11px; flex:0 0 auto; opacity:.88; }
      .need-item.crit-blink .need-ico{ color:#f27b77; opacity:1; animation:dockCritBlink 1.45s ease-in-out infinite; }
      .need-item.crit-blink .need-top b.crit{ animation:dockCritBlink 1.45s ease-in-out infinite; }
      .need-top b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
      .need-top b.warn{ color:var(--amber); }
      .need-top b.crit{ color:var(--red); }
      .need-bar{ height:6px; background:#090b09; border:1px solid #282d26; border-radius:999px; overflow:hidden; position:relative; }
      .need-bar > i{ position:absolute; inset:0 auto 0 0; width:80%; background:var(--green); border-radius:999px; transition:width .25s linear, background .2s; }
      .need-bar.blue > i{ background:var(--blue); }
      .need-bar > i.warn{ background:var(--amber); }
      .need-bar > i.crit{ background:var(--red); }
      @media (max-width:420px){
        .dock{ gap:4px; padding:4px 6px; }
        .dbtn{ flex:0 0 42px; }
        .dock-needs{ gap:7px; padding:4px 8px; }
        .need-top{ font-size:10.5px; gap:3px; }
      }

      /* ---------- historia y tutorial: pastilla narrativa, barra de progreso y resaltados ---------- */
      .pill{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(60px + env(safe-area-inset-bottom)); z-index:20;
        width:min(92%, 520px); background:rgba(12,14,12,.96); border:1px solid #3c4338; border-left:3px solid var(--amber);
        border-radius:14px; padding:0 16px 12px; box-shadow:0 16px 44px rgba(0,0,0,.68); pointer-events:none; overflow:hidden; }
      .pill.top{ top:calc(64px + env(safe-area-inset-top)); bottom:auto; }
      .pill[hidden]{ display:none; }
      .pill-prog{ height:3px; background:rgba(255,255,255,.07); margin:0 -16px 10px; }
      .pill-prog > i{ display:block; height:100%; width:0%; background:linear-gradient(90deg, var(--amber2), var(--amber)); transition:width .25s ease; }
      .pill-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; font-size:11.5px; color:var(--amber); letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
      .pill-head small{ color:var(--dim); font-weight:500; text-transform:none; letter-spacing:.02em; }
      .pill p{ margin:0; font-size:14px; line-height:1.48; color:var(--ink); }
      .pill p b{ color:var(--amber); font-weight:600; }
      .pill-acts{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
      .pill-acts.off{ display:none; }
      #pill-btn{ background:var(--amber2); border:1px solid var(--amber); color:#171106; font:inherit; font-weight:600;
        font-size:13.5px; padding:7px 16px; border-radius:9px; cursor:pointer; min-height:38px; pointer-events:auto; }
      #tut-skip{ position:fixed; top:calc(62px + env(safe-area-inset-top)); right:10px; z-index:21; background:rgba(12,14,12,.92);
        border:1px solid var(--line); color:var(--dim); font:inherit; font-size:12.5px; padding:7px 12px; border-radius:9px;
        cursor:pointer; min-height:36px; }
      #tut-skip[hidden]{ display:none; }
      body.tut-on-control .stat-block{ box-shadow:0 0 0 2px var(--amber), 0 0 24px rgba(232,163,61,.5); }
      body.tut-on-salud #db-salud{ box-shadow:0 0 0 2px var(--amber), 0 0 18px rgba(232,163,61,.55); }
      body.tut-on-clima #top-wx-btn{ box-shadow:0 0 0 2px var(--amber), 0 0 18px rgba(232,163,61,.5); }

      /* ---------- cuadro central minimalista (generador oxidado con 3 relojes, panel solar, cultivos) ---------- */
      .equip-ov{ position:fixed; inset:0; z-index:36; background:rgba(5,7,5,.72); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
        display:flex; align-items:center; justify-content:center; padding:14px; touch-action:manipulation; }
      .equip-ov[hidden]{ display:none; }

      /* 3 relojes analógicos funcionales (Temp / RPM / Gasolina) */

    /* ================= BunkerDay — motor del juego ================= */
    const cv = document.getElementById('game');

    const W = 1168, H = 2112;
    const clamp = (v,a,b)=> v<a?a : v>b?b : v;

    const irnd = (a,b)=> Math.floor(rnd(a,b+1));
    const $ = id => document.getElementById(id);

    /* ---------- audio (sintetizado en tiempo real: UI + ambiente + motor del generador) ---------- */
    const LS_MUTE = 'ud_muted_v1';
    let AC = null, muted = false;
    try{ muted = localStorage.getItem(LS_MUTE) === '1'; }catch(e){}
    function audio(){
      if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
      if(AC && AC.state==='suspended'){ try{ const p = AC.resume(); if(p && p.catch) p.catch(()=>{}); }catch(e){} }
      if(AC && !AMB.ready && !muted) initAmbientAudio();
      return AC;
    }
    ['pointerdown','keydown'].forEach(ev=>{
      window.addEventListener(ev, ()=>{ if(!muted) audio(); }, { passive:true });
    });
    function syncMuteUi(){
      const b = $('top-mute-btn');
      if(b){
        b.classList.toggle('muted', muted);
        b.title = muted ? 'Sonido silenciado (tocar para activar)' : 'Sonido activo (tocar para silenciar)';
        b.innerHTML = muted
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
      }
    }
    function toggleMute(){
      muted = !muted;
      try{ localStorage.setItem(LS_MUTE, muted ? '1' : '0'); }catch(e){}
      if(!muted) audio();
      syncMuteUi();
      if(!muted) sfx.click();
      if(activeSheet === 'control') renderSheet();
    }
    function beep(freq, dur, type, vol, when){
      if(muted) return; const ac = audio(); if(!ac) return;
      const t = ac.currentTime + (when||0);

    function tickAmbientAudio(realDt){

      const ac = AC, t = ac.currentTime;
      const active = !muted && S.started && !S.over && !document.hidden && !S.paused && !editor.active;
      AMB.master.gain.setTargetAtTime(active ? 1.0 : 0.0001, t, 0.14);

      const liveRpm = clamp(genDialPhys.rpm || 0, 0, 4500);

        AMB.gen.exBp.frequency.setTargetAtTime(125 + accelNorm * 320, t, 0.04);

        if(genRun && (S.cond < 45 || S.fuel < 15)){
          sputter = 0.68 + 0.32 * Math.sin(t * 21) * Math.cos(t * 9.5);
        }
        const insideWall = S.exped ? 0.28 : (activeEquip === 'gen' ? 1.24 : 0.92);
        const rpmScale = 0.075 + Math.pow(rNorm, 1.55) * 0.28;
        const genVol = (genRun || liveRpm > 90)
          ? clamp(rpmScale * clamp(liveRpm / 550, 0, 1) * insideWall * sputter, 0.0001, 0.56)

      }

        crisisDesc:'Un relé del centro eléctrico entró en corto y pierde energía. Sal al yermo con tu mochila a buscar un Relé de potencia.'
      }
    };
    const SOLAR_FAULTS = {
      inverter: { id:'inverter', label:'Regulador / inversor solar dañado', spareCost:1, scrapCost:0 },
      cell:     { id:'cell',     label:'Celdas dañadas por tormenta exterior', spareCost:1, scrapCost:1 }
    };
    function buildDayFaultHours(day, startHour){
      const hNow = typeof startHour === 'number' ? startHour : 8;
      if(day <= 1 && hNow >= 6){
        const h1 = Number(rnd(Math.max(10.8, hNow + 2.8), 14.6).toFixed(2));
        const h2 = Number(clamp(h1 + rnd(6.4, 8.2), 18.2, 22.8).toFixed(2));
        return [h1, h2];
      }
      const h1 = Number(rnd(2.6, 10.2).toFixed(2));
      const h2 = Number(clamp(h1 + rnd(7.5, 11.2), 14.6, 22.8).toFixed(2));
      return [h1, h2];
    }
    let S;
    function newState(){
      return {
        started:false, over:false, paused:false, speed:1,
        day:1, hour:8, weather:WEATHERS[0], weatherT:1,
        health:100, hunger:82, thirst:80, stress:12, expo:0, air:88, bunkerTemp:21,
        battery:62, fuel:60, oil:92, genTemp:28, genRpm:3000, genRunHours:0, genTotalHours:0, cond:65,
        genOn:true, genStalled:false, genFault:null,
        sysFault:null, battFire:false,
        faultDay:1, faultHours:buildDayFaultHours(1, 8), faultDone:[false, false], faultCooldownH:2.2, lastFaultSys:'',
        lightsOn:true, pumpOn:true, fanOn:true, heaterOn:true,
        clean:12, dirty:10, food:0, cans:2, scrap:4, parts:1, spares:1, med:0,
        genParts:{
          spark_plug:0, oil_gear:0, thermostat:0, carb_filter:0, alt_belt:0,
          batt_cell:0, fan_motor:0, heater_coil:0, pump_valve:0, hydro_uv:0, panel_relay:0
        },
        backpack:[],
        crisisTimer:180, crisisCount:0,
        solarCond:100, solarFault:null,
        growth:0, cropType:null, cropPlanted:false, autoIrrig:true, radioBuff:0,
        levels:{ gen:1, pump:1, fan:1, hydro:1, batt:1, solar:0 },
        mode:'bunker', sleeping:false, sleepH:0,
        tutDone:false, tutStage:0, cobGen:false, cobFan:false,
        exped:null, cause:''
      };
    }
    S = newState();

    const REAL_SEC_PER_GAME_HOUR = 600; // 10 minutos reales para consumos por hora de juego
    const REAL_SEC_PER_CLOCK_HOUR = 240; // 4 minutos reales por hora en reloj horario y clima (×2.5 más rápido)
    function fmtHour(h){
      const hh = Math.floor(h)%24, mm = Math.floor((h%1)*60);
      return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
    }
    function fmtRunHours(h){
      const totalMins = Math.max(0, Math.floor((h || 0) * 60));
      const hh = Math.floor(totalMins / 60);
      const mm = totalMins % 60;
      return String(hh).padStart(3, '0') + 'h ' + String(mm).padStart(2, '0') + 'm';
    }
    function fmtMins(sec){
      const s = Math.max(0, Math.ceil(sec));
      const m = Math.floor(s / 60), r = s % 60;
      return m + ':' + String(r).padStart(2,'0');
    }

    /* ---------- energía ---------- */
    function effBattCap(){
      const base = BATT_CAP[S.levels.batt] || 100;
      if(S.battFire || S.sysFault === 'batt_fire') return Math.round(base * 0.48);
      return base;
    }
    function solarOut(){
      if(S.levels.solar < 1 || S.solarFault) return 0;
      const dayF = clamp(Math.sin((S.hour-6)/12*Math.PI), 0, 1);
      const eff = 0.45 + 0.55 * (clamp(S.solarCond, 0, 100) / 100);
      return 2.1 * dayF * S.weather.solar * eff;
    }
    function heatingNeeded(){
      return !!(S && (S.weather.id === 'snow' || S.bunkerTemp < 16));
    }
    function heatingDemandW(){
      if(!S || S.heaterOn === false || S.sysFault === 'heater_coil') return 0;
      if(S.weather.id === 'snow') return 2.45;
      if(S.bunkerTemp < 16) return Number((0.85 + clamp((16 - S.bunkerTemp) / 10, 0, 1) * 1.60).toFixed(2));
      return 0;
    }
    function thermalState(powFlag){
      const snowNow = S.weather.id === 'snow';
      const extT = typeof S.weather.tempExt === 'number' ? S.weather.tempExt : 18;
      const genActiveNow = S.genOn && !S.genStalled && !S.genFault && S.fuel > 0;
      let target = snowNow ? 5.5 : clamp(19.0 + (extT - 18) * 0.14, 15.0, 22.5);
      const heaterBroken = S.sysFault === 'heater_coil';
      const heaterOnAndPow = S.heaterOn !== false && !heaterBroken && !!powFlag && (snowNow || S.bunkerTemp < 17);
      if(heaterOnAndPow){
        const genHeatBoost = genActiveNow ? (12.0 * clamp(genRpmStressRatio(), 0.25, 1.35)) : 0;
        const heatedTarget = snowNow ? (0.5 + 7.5 + genHeatBoost) : 20.5;
        target = Math.max(target, heatedTarget);
      } else if(genActiveNow){
        target += snowNow ? 4.8 : 1.5;
      }
      if(S.battFire) target += 2.2;
      target = clamp(target, -2, 26.5);
      const heaterEffective = heaterOnAndPow && (target >= 15.0 || (target > S.bunkerTemp + 0.5 && target >= 13.0));
      return { snowNow, extT, genActiveNow, heaterBroken, heaterOnAndPow, heaterEffective, target };
    }
    function demandBreakdown(){
      const relayLeak = S.sysFault === 'panel_relay' ? 0.42 : 0;
      const standby = 0.04 + relayLeak;
      const lights = S.lightsOn ? 0.32 : 0;
      const hydroActive = (S.cropPlanted && S.growth < 100 && S.clean > 0.2 && S.sysFault !== 'hydro_uv') ? 0.45 : 0;
      const fan = (S.fanOn && S.sysFault !== 'fan_motor') ? 0.95 : 0;
      const pumpActive = (S.pumpOn && S.sysFault !== 'pump_valve') ? ((S.dirty > 0 && S.clean < CLEAN_CAP) ? 1.25 : 0.08) : 0;
      const heating = heatingDemandW();
      return {
        standby, lights, hydro: hydroActive, fan, pump: pumpActive, heating,
        total: standby + lights + hydroActive + fan + pumpActive + heating
      };
    }
    function demand(){
      return demandBreakdown().total;
    }
    function genRpmFactorAt(rpm){
      const r = clamp(Number(rpm) || 0, 0, 4500);
      if(r <= 50) return 0;
      if(r < GEN_RPM_MIN){
        return (r / GEN_RPM_MIN) * 0.28;
      }
      return r <= GEN_RPM_NOM
        ? 0.28 + (r - GEN_RPM_MIN) * 0.00036
        : 1.00 + (r - GEN_RPM_NOM) * 0.00050;
    }
    function genRpmPowerFactor(){
      return genRpmFactorAt(clamp(S.genRpm || GEN_RPM_NOM, GEN_RPM_MIN, GEN_RPM_MAX));
    }
    function genKvaForRpm(rpm){
      const nom = GEN_KVA_NOM[S.levels?.gen || 1] || 5.0;
      return nom * genRpmFactorAt(rpm);
    }
    function genKvaOut(){
      return (S.genOn && !S.genStalled && !S.genFault && S.fuel > 0)
        ? genKvaForRpm(clamp(S.genRpm || GEN_RPM_NOM, GEN_RPM_MIN, GEN_RPM_MAX))
        : 0;
    }
    function genRpmStressRatio(){
      return clamp(S.genRpm || GEN_RPM_NOM, GEN_RPM_MIN, GEN_RPM_MAX) / GEN_RPM_NOM;
    }
    function genOut(){ return (S.genOn && !S.genStalled && !S.genFault && S.fuel > 0) ? GEN_OUT[S.levels.gen] * genRpmPowerFactor() : 0; }
    function netPower(){ return genOut() + solarOut() - demand(); }
    function powered(){ return S.battery > 1 || netPower() >= 0; }

    /* ================= SIMULACIÓN ================= */
    let critFlags = {};
    let battFireAlarmT = 0;
    function flag(key, on, msg){ if(on && !critFlags[key] && !TUT.active){ toast(msg,'bad'); sfx.alarm(); } critFlags[key] = on; }

    function ensureDailyFaultSchedule(){
      if(typeof S.faultDay !== 'number' || !Array.isArray(S.faultHours) || S.faultHours.length < 2 || !Array.isArray(S.faultDone)){
        S.faultDay = S.day || 1;
        S.faultHours = buildDayFaultHours(S.faultDay, S.hour);
        S.faultDone = [false, false];
      }
      if(S.faultDay !== S.day){
        S.faultDay = S.day;
        S.faultHours = buildDayFaultHours(S.day, 0);
        S.faultDone = [false, false];
      }
    }
    function consumeTodayFaultSlot(){
      ensureDailyFaultSchedule();
      if(!S.faultDone[0]) S.faultDone[0] = true;
      else if(!S.faultDone[1]) S.faultDone[1] = true;
      S.faultCooldownH = 6.2;
    }
    function tickDailyFaults(dtClk){
      ensureDailyFaultSchedule();
      S.faultCooldownH = Math.max(0, (S.faultCooldownH || 0) - dtClk);
      if(TUT.active || !S.tutDone) return;
      for(let i = 0; i < 2; i++){
        if(S.faultDone[i]) continue;
        if(S.hour >= S.faultHours[i]){
          /* Si el jugador ya tiene una falla activa sin resolver, este turno del día se omite para no acumular fallas consecutivas */
          if(getActiveCrisis() || S.battFire){
            S.faultDone[i] = true;
            S.faultCooldownH = Math.max(S.faultCooldownH || 0, 5.5);
            return;
          }
          /* Si está explorando el yermo o dormido o aún en enfriamiento entre fallas, posponer un poco dentro del día */
          if(S.exped || S.sleeping || (S.faultCooldownH || 0) > 0){
            const nextH = S.hour + Math.max(1.2, S.faultCooldownH || 1.2);
            if(nextH < 23.3){
              S.faultHours[i] = nextH;
              if(i === 0 && S.faultHours[1] < nextH + 5.5){
                S.faultHours[1] = clamp(nextH + 6.0, 16.0, 23.2);
              }
            } else {
              S.faultDone[i] = true;
            }
            return;
          }
          S.faultDone[i] = true;
          S.faultCooldownH = 6.5;
          triggerBunkerCrisis();
          return;
        }
      }
    }

    function update(dtG, dtH, dtClk){
      /* --- clima (cambia cada hora del reloj horario) --- */
      S.weatherT -= (dtClk ?? dtH);
      if(S.weatherT <= 0){
        const w = pickWeather(S.weather.id);
        S.weather = w;
        if(w.id === 'snow'){
          toast('<b>Tormenta de nieve intensa:</b> la temperatura cae rápido. Sube el generador para sostener la calefacción.', 'bad');
          sfx.alarm();
        } else {
          toast('El clima cambia: <b>' + w.name.toLowerCase() + '</b> en el exterior.');
        }
        S.weatherT = 1 + (S.weatherT > -1 ? S.weatherT : 0);
      }
      /* --- programador de 2 fallas por día a distintas horas (no consecutivas) --- */
      tickDailyFaults(dtClk ?? dtH);

      /* --- generador: depende de las RPM y la carga de calefacción --- */
      const genRunning = S.genOn && !S.genStalled && !S.genFault;
      const demNow = demandBreakdown();
      const powPre = S.battery > 1 || (genOut() + solarOut() - demNow.total) >= 0;
      const heaterWorking = S.heaterOn !== false && S.sysFault !== 'heater_coil' && powPre && demNow.heating > 0;
      if(genRunning){
        if(S.fuel <= 0){
          S.genOn = false;
          toast('El generador se quedó <b>sin combustible</b>.','bad');
          sfx.alarm();
        } else {
          const rpmR = genRpmStressRatio();
          const fuelRpmMult = Math.pow(rpmR, 1.45);
          const heatFuelMult = heaterWorking ? (1 + (demNow.heating / 2.45) * 0.38) : 1;
          const oilRpmMult = Math.pow(rpmR, 2.20);
          const fuelPctBurn = (GEN_FUEL_LPH[S.levels.gen] * fuelRpmMult * heatFuelMult / GEN_TANK_LITERS) * 100 * dtH;
          S.fuel = Math.max(0, S.fuel - fuelPctBurn);
          const oilPctPerHour = (100 / 65) * (1 + (100 - S.cond) * 0.004) * oilRpmMult * (heaterWorking ? 1.12 : 1);
          S.oil = Math.max(0, S.oil - oilPctPerHour * dtH);
          S.cond = Math.max(5, S.cond - 0.18 * Math.pow(rpmR, 1.5) * dtH);
          S.genRunHours = (S.genRunHours || 0) + dtH * (rpmR > 1 ? Math.pow(rpmR, 1.35) : Math.max(0.45, rpmR * 0.72));
          S.genTotalHours = (S.genTotalHours || 0) + dtH;
          const overHours = Math.max(0, S.genRunHours - 4);
          const rpmHeatShift = (rpmR - 1) * 44;
          const ambientChill = S.weather.id === 'snow' ? -6 : 0;
          const tempTarget = clamp(
            72 + ambientChill + rpmHeatShift + demNow.total * 2.0 + overHours * 8.2 + (S.oil < 25 ? (25 - S.oil) * 1.1 : 0) + (S.cond < 35 ? (35 - S.cond) * 0.35 : 0),
            30, 118
          );
          const heatFollow = dtH * (1.25 + Math.max(0, rpmR - 1) * 1.45);
          S.genTemp += (tempTarget - S.genTemp) * Math.min(1, heatFollow);

          /* Solo si se abusa al límite extremo (114°C o 0% aceite) sin otra falla activa */
          if(!TUT.active && !getActiveCrisis() && (S.faultCooldownH || 0) <= 0){
            if(S.genTemp >= 114){
              consumeTodayFaultSlot();
              triggerGenCrisis('overheat');
            } else if(S.oil <= 0){
              consumeTodayFaultSlot();
              triggerGenCrisis('oil_pump');
            }
          }
        }
      } else {
        S.genRunHours = Math.max(0, (S.genRunHours || 0) - dtH * 1.8);
        const genCoolTgt = S.weather.id === 'snow' ? 14 : 26;
        S.genTemp += (genCoolTgt - S.genTemp) * Math.min(1, dtH * 2.6);
      }

      /* --- panel solar: suciedad suave por clima severo --- */
      if(S.levels.solar >= 1 && !S.solarFault){
        const wid = S.weather.id;
        if(wid === 'sand' || wid === 'acid' || wid === 'dust'){
          const wear = wid === 'sand' ? 0.22 : wid === 'acid' ? 0.16 : 0.08;
          S.solarCond = Math.max(35, S.solarCond - wear * dtG);
        }
      }

      /* --- incendio activo en las baterías: drena carga lentamente y humea hasta que se apague --- */
      const cap = effBattCap();
      const fireDrain = S.battFire ? 0.45 * dtG : 0;
      S.battery = clamp(S.battery + netPower()*dtG - fireDrain, 0, cap);
      if(S.battFire){
        battFireAlarmT += dtG;
        if(battFireAlarmT >= 4.2){
          battFireAlarmT = 0;
          if(!S.exped) sfx.alarm();
        }
      } else {
        battFireAlarmT = 0;
      }
      const pow = powered();
      if(!pow && !critFlags.nopow && !TUT.active) toast('Sin energía: luces, bomba, calefacción y ventilador se detienen.','bad');
      critFlags.nopow = !pow;

      /* --- temperatura interior del búnker y calefacción --- */
      const th = thermalState(pow);
      const thermRate = th.snowNow ? (th.target < S.bunkerTemp ? 0.026 : 0.042) : 0.024;
      S.bunkerTemp = clamp(S.bunkerTemp + (th.target - S.bunkerTemp) * Math.min(1, dtG * thermRate), -2, 28);

      /* --- agua --- */
      const widW = S.weather.id;
      if((widW === 'rain' || widW === 'storm' || widW === 'acid') && S.dirty < 80){
        const rainIn = widW === 'storm' ? 0.45 : widW === 'rain' ? 0.28 : 0.20;
        S.dirty = Math.min(80, S.dirty + rainIn * dtG);
      }
      if(S.pumpOn && S.sysFault !== 'pump_valve' && pow && S.dirty > 0 && S.clean < CLEAN_CAP){
        const c = Math.min(PUMP_RATE[S.levels.pump]*dtG, S.dirty, CLEAN_CAP - S.clean);
        S.dirty -= c; S.clean += c;
      }
      /* --- aire (caída gradual si falla el ventilador o hay humo de baterías para dar tiempo de sobra al jugador) --- */
      const fanWorks = S.fanOn && S.sysFault !== 'fan_motor' && pow;
      const airTarget = fanWorks ? (S.battFire ? 58 : 100) : (S.exped ? 30 : 22);
      const airRate = fanWorks ? (1.6 + S.levels.fan*0.9) : (S.battFire ? 0.34 : 0.20);
      S.air += clamp(airTarget - S.air, -airRate*dtG, airRate*dtG);
      S.air = clamp(S.air, 0, 100);
      /* --- invernadero (regado automático opcional o ahorro manual de agua) --- */
      const cropTempMult = S.bunkerTemp < 4 ? 0 : (S.bunkerTemp < 12 ? clamp(0.30 + (S.bunkerTemp - 4) / 8 * 0.70, 0.30, 1) : 1);
      if(S.cropPlanted && S.cropType && S.sysFault !== 'hydro_uv' && pow && S.growth < 100 && S.clean > 0.2 && cropTempMult > 0){
        const crop = CROPS[S.cropType] || CROPS.tomato;
        const hydroMult = 1 + (S.levels.hydro - 1) * 0.22;
        if(irrigActiveT > 0){
          irrigActiveT = Math.max(0, irrigActiveT - dtG);
        } else if(S.autoIrrig !== false){
          irrigCooldown -= dtG;
          if(irrigCooldown <= 0){
            irrigActiveT = 3.2;
            irrigCooldown = 12;
          }
        }
        const waterBoost = irrigActiveT > 0 ? 1.36 : (S.autoIrrig !== false ? 0.90 : 0.72);
        const waterDrainMult = irrigActiveT > 0 ? 2.4 : (S.autoIrrig !== false ? 0.45 : 0.14);
        const prevG = S.growth;
        S.growth = Math.min(100, S.growth + (100 / (crop.minutes * 60)) * hydroMult * waterBoost * cropTempMult * dtG);
        S.clean = Math.max(0, S.clean - crop.waterRate * waterDrainMult * dtG);
        if(prevG < 100 && S.growth >= 100){
          irrigActiveT = 0;
          toast('Cosecha de <b>' + crop.name + '</b> lista para recoger en el invernadero.', 'good');
          sfx.ok();
        }
      } else {
        irrigActiveT = 0;
      }
      /* --- exploración --- */
      if(S.exped){
        const ex = S.exped;
        ex.t += dtG;
        ex.lootT -= dtG;
        S.expo = clamp(S.expo + S.weather.rad * 0.035 * dtG, 0, 100);
        if(ex.lootT <= 0){ ex.lootT = rnd(3.5, 5.5); grantLoot(ex); }
        if(ex.t >= ex.dur) endExped(false);
      } else if(S.mode === 'bunker'){
        S.expo = clamp(S.expo - (S.air > 50 ? 1.1 : 0.4)*dtG, 0, 100);
      }
      /* --- necesidades --- */
      const sleepF = S.sleeping ? 0.45 : 1;
      const activeTemp = S.exped ? (typeof S.weather.tempExt === 'number' ? S.weather.tempExt : S.bunkerTemp) : S.bunkerTemp;
      const tempThirstMult = clamp(1 + (activeTemp - 20) * 0.035, 0.78, 1.55);
      S.hunger = clamp(S.hunger - 2.3*dtH*sleepF, 0, 100);
      S.thirst = clamp(S.thirst - 3.1*tempThirstMult*dtH*sleepF, 0, 100);
      const lightsOk = S.lightsOn && pow;
      let dStress = 0;
      if(!lightsOk) dStress += 3.2;
      if(S.air < 40) dStress += 4;
      if(S.expo > 50) dStress += 3;
      if(S.hunger < 45) dStress += ((45 - S.hunger) / 45) * 4.8 + (S.hunger < 15 ? 2.8 : 0);
      if(S.thirst < 45) dStress += ((45 - S.thirst) / 45) * 5.6 + (S.thirst < 15 ? 3.2 : 0);
      if(S.bunkerTemp < 12) dStress += (12 - S.bunkerTemp) * 0.55;
      if(S.weather.id === 'rad' && S.mode === 'bunker') dStress += 1;
      if(lightsOk && S.air >= 50 && S.bunkerTemp >= 13 && S.hunger >= 40 && S.thirst >= 40) dStress -= 1.6;
      if(S.radioBuff > 0){ S.radioBuff -= dtH; dStress -= 9; }
      if(S.sleeping) dStress -= 7;
      S.stress = clamp(S.stress + dStress*dtH*(S.sleeping?0.6:1), 0, 100);
      /* --- salud --- */
      let dH = 0;
      if(S.thirst <= 0) dH -= 6;
      if(S.hunger <= 0) dH -= 5;
      if(S.air < 25 && S.mode === 'bunker') dH -= 5;
      if(S.bunkerTemp < 10 && S.mode === 'bunker') dH -= (10 - S.bunkerTemp) * 0.9;
      if(S.exped && S.weather.id === 'snow') dH -= 3.5;
      if(S.expo > 70) dH -= 8;
      if(S.stress >= 100) dH -= 2;
      if(dH === 0 && S.hunger > 30 && S.thirst > 30 && S.air > 50 && S.bunkerTemp >= 12 && S.expo < 30) dH += S.sleeping ? 4.5 : 2.6;
      S.health = clamp(S.health + dH*dtH, 0, 100);
      /* --- dormir --- */
      if(S.sleeping){
        S.sleepH += dtH;
        if(S.sleepH >= 9 || S.hunger < 18 || S.thirst < 18) wake('Te despiertas.');
      }
      /* --- avisos --- */
      flag('hunger', S.hunger < 20, '<b>Hambre crítica.</b> Toca el almacén para comer.');
      flag('thirst', S.thirst < 20, '<b>Sed crítica.</b> Toca el tanque de agua limpia para beber.');
      flag('air', S.air < 30, 'El aire se está viciando. Revisa el <b>ventilador</b> y la energía.');
      flag('cold', S.bunkerTemp < 10, '<b>Frío extremo (' + Math.round(S.bunkerTemp) + '°C).</b> Revisa la calefacción y las RPM del generador.');
      flag('fuel', S.fuel < 15 && S.genOn, 'El generador tiene <b>poco combustible</b>.');
      flag('expo', S.expo > 65, '<b>Exposición alta a la radiación.</b>');
      /* --- muerte --- */
      if(S.health <= 0 && !S.over){
        S.over = true;
        S.cause = S.thirst <= 0 ? 'La deshidratación te venció.' :
                  S.hunger <= 0 ? 'El hambre te venció.' :
                  S.bunkerTemp < 10 ? 'La hipotermia por frío extremo te venció.' :
                  S.expo > 70 ? 'La radiación te venció.' :
                  S.air < 25 ? 'El aire viciado te venció.' : 'Tu cuerpo no aguantó más.';
        $('dead-cause').textContent = S.cause;
        $('dead-days').textContent = S.day + (S.day === 1 ? ' día' : ' días');
        $('ov-dead').hidden = false;
        clearSave();
        sfx.err();
      }
    }
    function wake(msg){
      if(!S.sleeping) return;
      S.sleeping = false; S.sleepH = 0;
      if(msg) toast(msg);
      refreshSheet();
    }

    /* ================= ACCIONES COMPARTIDAS ================= */
    function costStr(c){ const p=[]; if(c.s) p.push(c.s+' chatarra'); if(c.p) p.push(c.p+' piezas'); return p.join(' · ') || 'Gratis'; }
    function canPay(c){ return S.scrap >= (c.s||0) && S.parts >= (c.p||0); }
    function pay(c){ S.scrap -= (c.s||0); S.parts -= (c.p||0); }

    /* ================= MOCHILA DEL YERMO Y CASOS DE SUPERVIVENCIA MULTISISTEMA ================= */
    function ensureBagState(){
      if(!Array.isArray(S.backpack)) S.backpack = [];
      if(!S.genParts || typeof S.genParts !== 'object'){
        S.genParts = {};
      }
      GEN_PART_LIST.forEach(p=>{ if(typeof S.genParts[p.id] !== 'number') S.genParts[p.id] = 0; });
      if(typeof S.sysFault === 'undefined') S.sysFault = null;
      if(typeof S.battFire !== 'boolean') S.battFire = false;
      ensureDailyFaultSchedule();
    }
    function getActiveCrisis(){
      ensureBagState();
      if(S.sysFault && SYS_FAULTS[S.sysFault]){
        const sf = SYS_FAULTS[S.sysFault];
        return Object.assign({}, sf, {
          isGen: false,
          isBattFire: !!S.battFire,
          activeDesc: (S.battFire && sf.fireDesc) ? sf.fireDesc : sf.crisisDesc
        });
      }
      if(S.genFault && GEN_FAULTS[S.genFault]){
        const gf = GEN_FAULTS[S.genFault];
        return Object.assign({}, gf, {
          isGen: true,
          isBattFire: false,
          activeDesc: gf.crisisDesc
        });
      }
      return null;
    }
    function backpackUsed(){
      ensureBagState();
      let n = 0;
      S.backpack.forEach(it=>{ n += (it.qty || 1); });
      return n;
    }
    function bagPartCount(partId){
      ensureBagState();
      let n = 0;
      S.backpack.forEach(it=>{ if(it.partId === partId) n += (it.qty || 1); });
      return n;
    }
    function totalGenPartCount(partId){
      ensureBagState();
      return (S.genParts[partId] || 0) + bagPartCount(partId);
    }
    function consumeGenPart(partId){
      ensureBagState();
      if((S.genParts[partId] || 0) > 0){
        S.genParts[partId]--;
        return { ok:true, fromBag:false };
      }
      for(let i = 0; i < S.backpack.length; i++){
        const it = S.backpack[i];
        if(it.partId === partId && (it.qty || 1) > 0){
          it.qty = (it.qty || 1) - 1;
          if(it.qty <= 0) S.backpack.splice(i, 1);
          return { ok:true, fromBag:true };
        }
      }
      return { ok:false, fromBag:false };
    }
    function addToBackpack(itemDef, qty){
      ensureBagState();
      const amount = Math.max(1, qty || 1);
      const used = backpackUsed();
      let free = BACKPACK_CAP - used;
      /* Si es la pieza crítica de la falla activa y la mochila está llena, reemplaza 1 chatarra común para no perderla */
      const activeCrisis = getActiveCrisis();
      const neededPartId = activeCrisis ? activeCrisis.partId : null;
      if(free <= 0 && itemDef.partId && itemDef.partId === neededPartId){
        const scrapIdx = S.backpack.findIndex(it => !it.partId && it.type === 'scrap');
        if(scrapIdx >= 0){
          S.backpack[scrapIdx].qty--;
          if(S.backpack[scrapIdx].qty <= 0) S.backpack.splice(scrapIdx, 1);
          free = 1;
        } else {
          free = 1; // bolsillo exterior de emergencia para la pieza crítica
        }
      }
      if(free <= 0){
        toast('<b>🎒 Mochila llena (' + BACKPACK_CAP + '/' + BACKPACK_CAP + ').</b> Vuelve al búnker para descargarla o abre la Mochila para hacer espacio.', 'bad');
        sfx.err();
        return 0;
      }
      const addN = Math.min(amount, Math.max(1, free));
      const key = itemDef.partId ? ('part:' + itemDef.partId) : itemDef.type;
      const existing = S.backpack.find(it => it.key === key);
      if(existing){
        existing.qty += addN;
      } else {
        S.backpack.push({
          key,
          type: itemDef.type,
          partId: itemDef.partId || null,
          label: itemDef.label,
          icon: itemDef.icon || '📦',
          qty: addN
        });
      }
      return addN;
    }
    function applyBagEntryToBunker(it, qtyToMove){
      ensureBagState();
      const n = Math.max(1, qtyToMove ?? it.qty ?? 1);
      if(it.partId){
        S.genParts[it.partId] = (S.genParts[it.partId] || 0) + n;
      } else if(it.type === 'scrap') S.scrap += n;
      else if(it.type === 'spares') S.spares += n;
      else if(it.type === 'parts') S.parts += n;
      else if(it.type === 'food') S.food += n;
      else if(it.type === 'can') S.cans += n;
      else if(it.type === 'dirty') S.dirty = Math.min(80, S.dirty + n * 7);
      else if(it.type === 'med') S.med += n;
    }
    function unloadBackpack(silent){
      ensureBagState();
      if(S.exped){
        if(!silent){ toast('Debes volver al búnker antes de descargar la mochila en el almacén.','bad'); sfx.err(); }
        return false;
      }
      if(!S.backpack.length){
        if(!silent) toast('La mochila ya está vacía.');
        return false;
      }
      const summary = S.backpack.map(it => it.icon + ' ' + it.label + (it.qty > 1 ? ' ×' + it.qty : '')).join(', ');
      S.backpack.forEach(it => applyBagEntryToBunker(it, it.qty));
      S.backpack = [];
      if(!silent){
        toast('<b>🎒 Mochila descargada en el búnker:</b> ' + summary + '.', 'good');
        sfx.ok();
      }
      refreshSheet();
      if(activeEquip) renderEquipModal();
      saveProgress();
      return true;
    }
    function actBagItem(idx){

        /* En el yermo: tirar 1 unidad para liberar espacio en la mochila */
        it.qty--;

      /* En el búnker: si es la pieza que pide la falla activa, instalarla directo */
      const cr = getActiveCrisis();
      if(it.partId && cr && cr.partId === it.partId){
        actRepairActiveCrisis(false);

      applyBagEntryToBunker(it, 1);
      it.qty--;

    function triggerGenCrisis(forcedKey){
      ensureBagState();

      let key = forcedKey;
      if(!key){
        if(S.genTemp >= 88) key = 'overheat';
        else if(S.oil < 38) key = 'oil_pump';
        else if((S.genRpm || 3000) >= 3500) key = 'alternator';
        else {
          const keys = ['spark', 'filter', 'alternator', 'oil_pump', 'overheat'];
          key = keys[(S.crisisCount || 0) % keys.length];
        }
      }
      const f = GEN_FAULTS[key] || GEN_FAULTS.spark;
      S.genFault = f.id;
      S.genStalled = true;
      S.genOn = false;
      S.lastFaultSys = 'gen';
      S.crisisCount = (S.crisisCount || 0) + 1;
      toast('<b>⚠️ ' + f.crisisTitle.toUpperCase() + ':</b> ' + f.label + '. Sal al <b>yermo</b> con tu <b>mochila</b> a buscar <b>' + f.partIcon + ' ' + f.partName + '</b>.', 'bad');

    function triggerBunkerCrisis(forcedType){
      ensureBagState();
      if(getActiveCrisis()) return;
      /* Orden rotativo de sistemas del búnker para variar entre baterías en candela, ventilación, calefacción, generador, bomba, cultivos y tablero */
      const rotation = ['batt_fire', 'fan_motor', 'heater_coil', 'gen', 'pump_valve', 'hydro_uv', 'panel_relay'];
      let chosen = forcedType;
      if(!chosen){
        const candidates = rotation.filter(k => k !== S.lastFaultSys);
        /* Si no hay plantas sembradas, evitar hydro_uv en automático para que la falla siempre sea relevante */
        const filtered = candidates.filter(k => !(k === 'hydro_uv' && !S.cropPlanted));
        const pool = filtered.length ? filtered : candidates;
        chosen = pool[(S.crisisCount || 0) % pool.length];
      }
      if(chosen === 'gen' || GEN_FAULTS[chosen]){
        triggerGenCrisis(GEN_FAULTS[chosen] ? chosen : undefined);
        return;
      }
      const sf = SYS_FAULTS[chosen] || SYS_FAULTS.batt_fire;
      S.sysFault = sf.id;
      S.lastFaultSys = sf.id;
      S.crisisCount = (S.crisisCount || 0) + 1;
      if(sf.id === 'batt_fire'){
        S.battFire = true;
        toast('<b>🔥 ¡BATERÍAS EN CANDELA!</b> Cortocircuito térmico en el banco de baterías. <b>Toca las baterías o abre Control para apagar el fuego</b> y luego sal al yermo por una <b>🔋 Celda de batería de litio</b>.', 'bad');
      } else {
        toast('<b>⚠️ ' + sf.crisisTitle.toUpperCase() + ':</b> ' + sf.label + '. Sal al <b>yermo</b> con tu <b>mochila</b> a buscar <b>' + sf.partIcon + ' ' + sf.partName + '</b>.', 'bad');

    function actRepairActiveCrisis(useEmergency){
      ensureBagState();
      const cr = getActiveCrisis();
      if(!cr){ actRepairGen(); return; }
      if(S.exped){
        toast('Estás en el yermo. Vuelve al búnker con la mochila para instalar la pieza.', 'bad');
        sfx.err();
        return;

      if(cr.isBattFire){
        actExtinguishBatt();
        return;
      }
      if(cr.isGen){
        actRepairGenFault(useEmergency);
        return;
      }
      const partRes = !useEmergency ? consumeGenPart(cr.partId) : { ok:false };
      if(partRes.ok){
        const fixedSys = cr.sys;
        S.sysFault = null;
        S.battFire = false;
        if(fixedSys === 'batt') S.battery = clamp(S.battery + 36, 0, effBattCap());
        if(fixedSys === 'fan') S.fanOn = true;
        if(fixedSys === 'heater') S.heaterOn = true;
        if(fixedSys === 'pump') S.pumpOn = true;
        toast('Instalaste <b>' + cr.partIcon + ' ' + cr.partName + '</b>' + (partRes.fromBag ? ' desde tu mochila' : '') + '. ¡<b>' + cr.sysName + '</b> reparado y funcionando!', 'good');
        sfx.ok();
        refreshSheet();
        if(activeEquip) renderEquipModal();
        saveProgress();
        return;
      }
      if(useEmergency && S.spares >= 2 && S.scrap >= 2){
        const fixedSys = cr.sys;
        S.spares -= 2; S.scrap -= 2;
        S.sysFault = null;
        S.battFire = false;

        if(activeEquip) renderEquipModal();
        saveProgress();
        return;

    function actRepairGenFault(useEmergency){

      if(S.exped){
        toast('Estás en el yermo. Vuelve al búnker con la mochila para instalar la pieza en el generador.','bad');
        sfx.err(); return;
      }
      const partRes = !useEmergency ? consumeGenPart(f.partId) : { ok:false };
      if(partRes.ok){
        S.genFault = null; S.genStalled = false; S.genOn = true;
        S.cond = clamp(S.cond + 40, 0, 100);
        if(S.oil < 45) S.oil = 68;
        if(S.genTemp > 88) S.genTemp = 68;
        if(S.genRunHours > 2.0) S.genRunHours = 1.0;
        triggerGenCheckGearSpin();
        toast('Instalaste <b>' + f.partIcon + ' ' + f.partName + '</b>' + (partRes.fromBag ? ' desde tu mochila' : '') + '. ¡Generador reparado y en marcha!', 'good');
        sfx.ok();
        refreshSheet(); if(activeEquip) renderEquipModal();
        saveProgress();
        return;
      }
      if(useEmergency && S.spares >= 2 && S.scrap >= 2){
        S.spares -= 2; S.scrap -= 2;
        S.genFault = null; S.genStalled = false; S.genOn = true;
        S.cond = clamp(S.cond + 28, 0, 100);
        if(S.oil < 40) S.oil = 58;

        sfx.ok();
        refreshSheet(); if(activeEquip) renderEquipModal();
        saveProgress();
        return;

      toast('Necesitas <b>' + f.partIcon + ' ' + f.partName + '</b> para reparar el generador. ¡Sal al yermo y tráela en tu <b>mochila</b>!', 'bad');

    function grantLoot(ex, fromSpot){
      ensureBagState();
      const activeCrisis = getActiveCrisis();
      const needFaultPart = activeCrisis && totalGenPartCount(activeCrisis.partId) <= 0;
      if(backpackUsed() >= BACKPACK_CAP && !needFaultPart){
        if(fromSpot){
          toast('<b>🎒 Mochila llena (' + BACKPACK_CAP + '/' + BACKPACK_CAP + ').</b> Vuelve al búnker para descargarla o tira algo desde la Mochila.', 'bad');
          sfx.err();
        }
        return;
      }
      /* Si hay una avería activa en cualquier sistema del búnker y aún no tenemos su pieza, alta prioridad de encontrarla */
      const searchesDone = ex.searches || 0;
      const findFaultPartNow = needFaultPart && (fromSpot ? (searchesDone >= 1 || Math.random() < 0.72) : (Math.random() < 0.36));

      if(findFaultPartNow){
        const gp = GEN_PARTS[activeCrisis.partId];
        if(gp){
          const added = addToBackpack({ type:'gen_part', partId:gp.id, label:gp.name, icon:gp.icon }, 1);
          if(added > 0){
            ex.found.parts = (ex.found.parts || 0) + 1;
            ex.log.push('¡' + gp.icon + ' ' + gp.name + '!');
            toast('<b>🎒 ¡Encontraste ' + gp.icon + ' ' + gp.name + '!</b> Guardada en tu mochila (' + backpackUsed() + '/' + BACKPACK_CAP + '). ¡Vuelve al búnker para reparar <b>' + activeCrisis.sysName + '</b>!', 'good');
            sfx.ok();
            refreshSheet();
            return;
          }
        }
      }
      /* Posibilidad secundaria de hallar una pieza técnica de reserva al registrar un punto del yermo */
      if(fromSpot && Math.random() < 0.24){
        const rp = GEN_PART_LIST[Math.floor(Math.random() * GEN_PART_LIST.length)];
        const added = addToBackpack({ type:'gen_part', partId:rp.id, label:rp.name, icon:rp.icon }, 1);
        if(added > 0){
          ex.log.push(rp.icon + ' ' + rp.name);
          toast('🎒 Guardas en la mochila: <b>' + rp.icon + ' ' + rp.name + '</b> (' + backpackUsed() + '/' + BACKPACK_CAP + ').', 'good');
          sfx.pickup();
          refreshSheet();
          return;
        }
      }

      let tot = 0; LOOT.forEach(l => tot += l.w);
      let r = Math.random() * tot, kind = LOOT[0];
      for(const l of LOOT){ if((r -= l.w) <= 0){ kind = l; break; } }
      const qty = (kind.t === 'scrap') ? irnd(1, 2) : 1;
      const added = addToBackpack({ type:kind.t, label:kind.label, icon:kind.icon }, qty);
      if(added <= 0) return;

      if(kind.t === 'scrap') ex.found.scrap += added;
      else if(kind.t === 'spares') ex.found.spares += added;
      else if(kind.t === 'food') ex.found.food += added;
      else if(kind.t === 'can') ex.found.can += added;
      else if(kind.t === 'dirty') ex.found.dirty += added * 7;
      else if(kind.t === 'parts') ex.found.parts += added;
      else if(kind.t === 'med') ex.found.med += added;

      const txt = kind.icon + ' ' + kind.label + (added > 1 ? ' ×' + added : '');
      ex.log.push(txt);
      if(fromSpot){
        toast('🎒 Guardas en tu mochila: <b>' + txt + '</b> (' + backpackUsed() + '/' + BACKPACK_CAP + ').', 'good');
      }
      sfx.pickup();
      refreshSheet();
    }
    function scavengeExpedNode(nodeIdx){
      if(!S.exped) return;
      const ex = S.exped;
      if(!Array.isArray(ex.nodes)) ex.nodes = makeExpedNodes();
      const nd = ex.nodes[nodeIdx];
      if(!nd || nd.searched){
        toast('Ya registraste este punto. Prueba otra zona del yermo.');

      const cr = getActiveCrisis();
      const needCritical = cr && totalGenPartCount(cr.partId) <= 0;
      if(backpackUsed() >= BACKPACK_CAP && !needCritical){
        toast('<b>🎒 Mochila llena (' + BACKPACK_CAP + '/' + BACKPACK_CAP + ').</b> Vuelve al búnker o descarta algo en la Mochila.', 'bad');
        sfx.err();
        return;

      nd.searched = true;
      ex.searches = (ex.searches || 0) + 1;
      S.expo = clamp(S.expo + Math.max(2.2, S.weather.rad * 0.25), 0, 100);
      grantLoot(ex, true);
      refreshSheet();

    const bgImg = new Image();

    function buildSurfaceForegroundMask(srcImg){
      const fh = 520;
      const c = document.createElement('canvas');
      c.width = W; c.height = fh;
      const g = c.getContext('2d');
      g.drawImage(srcImg, 0, 0, W, H);

      /* Matte vectorial anti-aliased para siluetas exactas de poste, panel solar y chimenea */
      const mc = document.createElement('canvas');
      mc.width = W; mc.height = fh;
      const mg = mc.getContext('2d');

      /* 1. Horizonte y terreno del búnker: desvanecido suave en y=342..378, sólido debajo */
      const groundG = mg.createLinearGradient(0, 342, 0, 378);
      groundG.addColorStop(0, 'rgba(0,0,0,0)');
      groundG.addColorStop(0.55, 'rgba(0,0,0,0.45)');
      groundG.addColorStop(1, 'rgba(0,0,0,1)');
      mg.fillStyle = groundG;
      mg.fillRect(0, 342, W, fh - 342);

      /* 2. Estructuras que sobresalen sobre el horizonte con bordes suavizados (sin halos de cielo) */
      mg.save();
      mg.fillStyle = '#000';
      mg.shadowColor = '#000';
      mg.shadowBlur = 1.6;
      mg.lineJoin = 'round';

      /* Embudo pluvial izquierdo */
      mg.beginPath();
      mg.moveTo(10, 355); mg.lineTo(96, 355); mg.lineTo(72, 412); mg.lineTo(29, 412);
      mg.closePath(); mg.fill();

      /* Poste central de reflectores: fuste, cruceta y ambos cabezales */
      mg.fillRect(584, 178, 16, 200);
      mg.beginPath();
      mg.moveTo(557, 170); mg.lineTo(627, 170); mg.lineTo(624, 184); mg.lineTo(560, 184);
      mg.closePath(); mg.fill();
      /* Cabezal izquierdo */
      mg.beginPath();
      mg.moveTo(500, 111); mg.lineTo(573, 106); mg.lineTo(569, 160); mg.lineTo(514, 159);
      mg.closePath(); mg.fill();
      /* Cabezal derecho */
      mg.beginPath();
      mg.moveTo(611, 106); mg.lineTo(684, 111); mg.lineTo(670, 159); mg.lineTo(615, 160);
      mg.closePath(); mg.fill();

      /* Panel solar exterior (marco exterior exacto + pedestal inferior) */
      mg.beginPath();
      mg.moveTo(705, 275); mg.lineTo(971, 275); mg.lineTo(905, 413); mg.lineTo(627, 411);
      mg.closePath(); mg.fill();
      mg.fillRect(746, 392, 84, 34);

      /* Chimenea de escape derecha (sombrerete cónico + tubo vertical) */
      mg.beginPath();
      mg.moveTo(1095, 332); mg.lineTo(1137, 377); mg.lineTo(1053, 377);
      mg.closePath(); mg.fill();
      mg.beginPath();
      mg.moveTo(1070, 375); mg.lineTo(1120, 375); mg.lineTo(1117, 420); mg.lineTo(1073, 420);
      mg.closePath(); mg.fill();
      mg.restore();

      g.globalCompositeOperation = 'destination-in';
      g.drawImage(mc, 0, 0);
      g.globalCompositeOperation = 'source-over';

      /* Limpieza sutil de halo naranja únicamente en píxeles semitransparentes del borde exterior */
      const id = g.getImageData(0, 0, W, fh);
      const d = id.data;
      for(let y = 90; y < 382; y++){
        const rowOff = y * W;
        for(let x = 490; x < W; x++){
          const idx = (rowOff + x) * 4;
          const a = d[idx + 3];
          if(a === 0 || a === 255) continue;
          const r = d[idx], gr = d[idx + 1], b = d[idx + 2];
          if((r - b) > 34 && (r - gr) > 16 && r > 120){
            d[idx + 3] = Math.round(a * 0.28);
          }
        }
      }
      g.putImageData(id, 0, 0);
      return c;
    }

    function drawUnlitCenterFloodlights(g){
      g.save();
      g.lineCap = 'round'; g.lineJoin = 'round';
      /* Base y poste oscuro exactamente alineados con la imagen iluminada (x=592) */
      g.fillStyle = '#1b2025';
      g.strokeStyle = '#090b0d'; g.lineWidth = 2.6;
      g.beginPath(); g.ellipse(592, 502, 26, 7.5, 0, 0, Math.PI*2); g.fill(); g.stroke();
      g.fillStyle = '#2d333a';
      g.fillRect(584, 178, 16, 322);
      g.strokeRect(584, 178, 16, 322);
      g.fillStyle = '#3b424b';
      g.fillRect(587, 182, 4, 314);
      /* Barra horizontal superior alineada al matte */
      g.fillStyle = '#282d33';
      g.fillRect(558, 170, 68, 13);
      g.strokeRect(558, 170, 68, 13);
      /* Dos cabezales de reflector apagados exactamente dentro de las siluetas */
      [
        [[502,112],[572,107],[568,159],[515,158]],
        [[612,107],[682,112],[669,158],[616,159]]
      ].forEach(pts=>{
        g.fillStyle = '#23282e';
        g.strokeStyle = '#0a0c0e'; g.lineWidth = 2.8;
        g.beginPath();
        g.moveTo(pts[0][0], pts[0][1]); g.lineTo(pts[1][0], pts[1][1]);
        g.lineTo(pts[2][0], pts[2][1]); g.lineTo(pts[3][0], pts[3][1]);
        g.closePath(); g.fill(); g.stroke();
        const cx = (pts[0][0] + pts[1][0] + pts[2][0] + pts[3][0]) * 0.25;
        const cy = (pts[0][1] + pts[1][1] + pts[2][1] + pts[3][1]) * 0.25;
        g.fillStyle = '#343c44';
        g.strokeStyle = '#14181c'; g.lineWidth = 1.6;
        g.beginPath(); g.rect(cx - 21, cy - 14, 42, 28); g.fill(); g.stroke();
        g.fillStyle = '#4a535e';
        g.fillRect(cx - 16, cy - 9, 14, 5);
      });
      g.restore();
    }

    /* TELARAÑAS dibujadas por código: abanicos en las esquinas de cada sala y

    function webCorner(x, y, r, dx, dy, seed){
