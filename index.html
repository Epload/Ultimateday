      const hx = x + dx*r*0.45, hy = y + dy*8;
      ctx.strokeStyle = 'rgba(226,224,212,.4)';
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy + dy*30); ctx.stroke();
      ctx.fillStyle = 'rgba(24,20,16,.85)';
      ctx.beginPath(); ctx.arc(hx, hy + dy*34, 4.2, 0, 7); ctx.fill();
      ctx.restore();
    }
    function webPatch(cx, cy, r, seed){
      ctx.save();
      ctx.strokeStyle = 'rgba(226,224,212,.42)'; ctx.lineCap = 'round';
      const n = 7, pts = [];
      for(let i = 0; i < n; i++){
        const a = seed + i*(Math.PI*2/n) + ((seed*i*7) % 0.5);
        const rr = r * (0.72 + ((seed*(i + 3)*13) % 0.35));
        pts.push([cx + Math.cos(a)*rr, cy + Math.sin(a)*rr*0.82, a]);
      }
      ctx.lineWidth = 1.8;
      pts.forEach(p=>{ ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p[0], p[1]); ctx.stroke(); });
      ctx.lineWidth = 1.4;
      [0.45, 0.75].forEach(f=>{
        ctx.beginPath();
        pts.forEach((p, i)=>{
          const px = cx + (p[0] - cx)*f, py = cy + (p[1] - cy)*f + Math.sin(seed + i*1.8)*5;
          if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.closePath(); ctx.stroke();
      });
      ctx.fillStyle = 'rgba(24,20,16,.8)';
      ctx.beginPath(); ctx.arc(cx + r*0.3, cy + r*0.22, 3.6, 0, 7); ctx.fill();
      ctx.restore();
    }
    /* niveles de tanque suavizados: el agua se ve subir y bajar, no saltar */
    let dispClean = 12/60, dispDirty = 10/80;
    let irrigCooldown = 10, irrigActiveT = 0;
    let animClock = 0, genAnimClock = 0;

    function buildRoundedPath(pts, cornerR){
      if(!pts || pts.length < 2) return pts || [];
      const r = cornerR || 10;
      const out = [pts[0]];
      for(let i = 1; i < pts.length - 1; i++){
        const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
        const dx1 = p0[0] - p1[0], dy1 = p0[1] - p1[1];
        const dx2 = p2[0] - p1[0], dy2 = p2[1] - p1[1];
        const len1 = Math.hypot(dx1, dy1), len2 = Math.hypot(dx2, dy2);
        if(len1 < 0.5 || len2 < 0.5){ out.push(p1); continue; }
        const u1x = dx1 / len1, u1y = dy1 / len1;
        const u2x = dx2 / len2, u2y = dy2 / len2;
        const dot = clamp(u1x * u2x + u1y * u2y, -0.999, 0.999);
        const theta = Math.acos(dot);
        if(theta < 0.06 || theta > Math.PI - 0.03){ out.push(p1); continue; }
        const tanHalf = Math.tan(theta * 0.5);
        const tDist = Math.min(r / tanHalf, len1 * 0.45, len2 * 0.45);
        const effR = tDist * tanHalf;
        if(effR < 0.8){ out.push(p1); continue; }
        const t1x = p1[0] + u1x * tDist, t1y = p1[1] + u1y * tDist;
        const t2x = p1[0] + u2x * tDist, t2y = p1[1] + u2y * tDist;
        const bx = u1x + u2x, by = u1y + u2y;
        const bLen = Math.hypot(bx, by);
        if(bLen < 0.001){ out.push(p1); continue; }
        const cDist = effR / Math.sin(theta * 0.5);
        const cx = p1[0] + (bx / bLen) * cDist;
        const cy = p1[1] + (by / bLen) * cDist;
        const a1 = Math.atan2(t1y - cy, t1x - cx);
        const a2 = Math.atan2(t2y - cy, t2x - cx);
        let da = a2 - a1;
        while(da > Math.PI) da -= Math.PI * 2;
        while(da < -Math.PI) da += Math.PI * 2;
        out.push([t1x, t1y]);
        const steps = 5;
        for(let s = 1; s < steps; s++){
          const ang = a1 + da * (s / steps);
          out.push([cx + Math.cos(ang) * effR, cy + Math.sin(ang) * effR]);
        }
        out.push([t2x, t2y]);
      }
      out.push(pts[pts.length - 1]);
      return out;
    }
    function tracePipePath(pts, cornerR){
      const rPts = (cornerR === 0) ? pts : buildRoundedPath(pts, cornerR || 10);
      if(!rPts || rPts.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(rPts[0][0], rPts[0][1]);
      for(let i = 1; i < rPts.length; i++){
        ctx.lineTo(rPts[i][0], rPts[i][1]);
      }
    }
    function samplePolyline(pts, dist){
      let rem = dist;
      for(let i = 0; i < pts.length - 1; i++){
        const x1 = pts[i][0], y1 = pts[i][1], x2 = pts[i + 1][0], y2 = pts[i + 1][1];
        const seg = Math.hypot(x2 - x1, y2 - y1);
        if(rem <= seg || i === pts.length - 2){
          const f = seg > 0 ? clamp(rem / seg, 0, 1) : 0;
          return [x1 + (x2 - x1) * f, y1 + (y2 - y1) * f];
        }
        rem -= seg;
      }
      return pts[pts.length - 1];
    }
    function polylineLength(pts){
      let total = 0;
      for(let i = 0; i < pts.length - 1; i++){
        total += Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      }
      return total;
    }
    function drawElectricFlow(pts, opts){
      const o = opts || {};
      const w = o.width || 2.4;
      const rgb = o.rgb || '255,214,96';
      const intensity = clamp(o.intensity ?? 1, 0.25, 1.35);
      const speed = o.speed || 95;
      const clock = o.clock ?? animClock;
      const cornerR = o.cornerR || 10;
      const rPts = buildRoundedPath(pts, cornerR);
      const total = polylineLength(rPts);
      if(total < 1) return;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      /* canal interior oscuro dentro de la funda del cable */
      ctx.strokeStyle = 'rgba(8,10,14,0.40)';
      ctx.lineWidth = w + 1.2;
      tracePipePath(rPts, 0);
      ctx.stroke();

      /* hilo conductor vivo dentro del cable */
      ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.34 * intensity).toFixed(3) + ')';
      ctx.lineWidth = w;
      tracePipePath(rPts, 0);
      ctx.stroke();

      /* ráfagas direccionales viajando estrictamente por dentro del cable */
      const dashLen = o.dashLen || 13;
      const gapLen = o.gapLen || 24;
      const cycle = dashLen + gapLen;
      ctx.strokeStyle = 'rgba(' + rgb + ',' + Math.min(0.95, 0.85 * intensity).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1.4, w * 0.80);
      ctx.setLineDash([dashLen, gapLen]);
      ctx.lineDashOffset = -((clock * speed) % cycle);
      tracePipePath(rPts, 0);
      ctx.stroke();

      /* núcleo blanco-dorado del pulso interno */
      ctx.strokeStyle = 'rgba(255,252,235,' + Math.min(0.95, 0.72 * intensity).toFixed(3) + ')';
      ctx.lineWidth = Math.max(0.85, w * 0.36);
      ctx.setLineDash([Math.max(4, dashLen * 0.42), cycle - Math.max(4, dashLen * 0.42)]);
      ctx.lineDashOffset = -((clock * speed) % cycle);
      tracePipePath(rPts, 0);
      ctx.stroke();
      ctx.setLineDash([]);

      /* chispas compactas viajando dentro del alma del cable (sin halo exterior) */
      const count = o.pulses ?? 3;
      if(count > 0){
        const sparkR = Math.min(w * 0.65, o.dotR || 1.5);
        for(let i = 0; i < count; i++){
          const d = (clock * speed + i * (total / count)) % total;
          const pt = samplePolyline(rPts, d);
          ctx.fillStyle = 'rgba(' + rgb + ',' + Math.min(0.85, 0.60 * intensity).toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(pt[0], pt[1], sparkR * 1.35, 0, 7); ctx.fill();
          ctx.fillStyle = 'rgba(255,252,235,' + Math.min(0.96, 0.85 * intensity).toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(pt[0], pt[1], sparkR * 0.75, 0, 7); ctx.fill();
        }
      }
      ctx.restore();
    }
    function drawWaterFlow(pts, opts){
      const o = opts || {};
      const w = o.width || 5.2;
      const rgb = o.rgb || '116,208,248';
      const hiRgb = o.hiRgb || '225,248,255';
      const intensity = clamp(o.intensity ?? 1, 0.25, 1.3);
      const speed = o.speed || 135;
      const clock = o.clock ?? animClock;
      const cornerR = o.cornerR || 11;
      const rPts = buildRoundedPath(pts, cornerR);
      const total = polylineLength(rPts);
      if(total < 1) return;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      /* hueco interior oscuro dentro de la tubería */
      ctx.strokeStyle = 'rgba(6,14,22,0.36)';
      ctx.lineWidth = w + 1.0;
      tracePipePath(rPts, 0);
      ctx.stroke();

      /* columna líquida continua dentro del diámetro interno del tubo */
      ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.38 * intensity).toFixed(3) + ')';
      ctx.lineWidth = w;
      tracePipePath(rPts, 0);
      ctx.stroke();

      /* corrientes laminares animadas desplazándose por dentro del tubo */
      const dashLen = o.dashLen || 16;
      const gapLen = o.gapLen || 16;
      const cycle = dashLen + gapLen;
      ctx.strokeStyle = 'rgba(' + hiRgb + ',' + Math.min(0.88, 0.58 * intensity).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1.5, w * 0.42);
      ctx.setLineDash([dashLen, gapLen]);
      ctx.lineDashOffset = -((clock * speed) % cycle);
      tracePipePath(rPts, 0);
      ctx.stroke();

      /* segunda estela desfasada para fluidez continua */
      ctx.strokeStyle = 'rgba(' + rgb + ',' + Math.min(0.92, 0.76 * intensity).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1.8, w * 0.56);
      ctx.setLineDash([dashLen * 0.65, cycle - dashLen * 0.65]);
      ctx.lineDashOffset = -((clock * speed + cycle * 0.48) % cycle);
      tracePipePath(rPts, 0);
      ctx.stroke();
      ctx.setLineDash([]);

      /* microburbujas nítidas contenidas dentro de la columna de agua */
      const count = o.drops ?? 5;
      const dropR = Math.min(w * 0.34, o.dropR || 1.6);
      ctx.fillStyle = 'rgba(' + hiRgb + ',' + Math.min(0.88, 0.72 * intensity).toFixed(3) + ')';
      for(let i = 0; i < count; i++){
        const d = (clock * speed + i * (total / count)) % total;
        const pt = samplePolyline(rPts, d);
        ctx.beginPath(); ctx.arc(pt[0], pt[1], dropR, 0, 7); ctx.fill();
      }

      /* reflejo translúcido sutil de pared de tubo sobre el flujo */
      ctx.strokeStyle = 'rgba(225,240,250,0.16)';
      ctx.lineWidth = 1.0;
      tracePipePath(rPts, 0);
      ctx.stroke();
      ctx.restore();
    }

    function R(x,y,w,h,c){ ctx.fillStyle = c; ctx.fillRect(x|0,y|0,w|0,h|0); }
    function lampGlow(x, y, r, col){
      const g = ctx.createRadialGradient(x,y,4, x,y,r);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,186,84,0)');
      ctx.fillStyle = g; ctx.fillRect(x-r, y-r, r*2, r*2);
    }
    /* halo suave circular (nunca un cuadro): luz que nace del propio equipo */
    function glowDot(x, y, r, col, a){
      const g = ctx.createRadialGradient(x, y, 1, x, y, r);
      g.addColorStop(0, col.replace('A', a));
      g.addColorStop(1, col.replace('A', 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    /* redibuja un trozo de la PROPIA foto (para moverla: vibrar, girar…) */
    function drawRegion(x, y, w, h){
      const img = curImg;
      const iw = img && (img.naturalWidth || img.width);
      const ih = img && (img.naturalHeight || img.height);
      if(!iw || !ih) return;
      const sx = x/W*iw, sy = y/H*ih;
      const sw = w/W*iw, sh = h/H*ih;
      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }
    function rrPath(x, y, w, h, r){
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y, x+w, y+h, r);
      ctx.arcTo(x+w, y+h, x, y+h, r);
      ctx.arcTo(x, y+h, x, y, r);
      ctx.arcTo(x, y, x+w, y, r);
      ctx.closePath();
    }
    /* cámara central transparente de los tanques: marco metálico remachado,
       interior hueco oscuro traslúcido, líquido ondulante, burbujas y lectura */
    function tankFill(x, y, w, h, r, level, topCol, botCol, t, kind, lights, curL, capL, flowOpts){
      level = clamp(level, 0, 1);
      const fo = flowOpts || {};
      const dim = lights === false ? 0.56 : 1;
      ctx.save();
      ctx.globalAlpha *= dim;
      /* brida exterior metálica del visor transparente */
      rrPath(x - 5, y - 5, w + 10, h + 10, r + 3);
      ctx.fillStyle = '#2b3238'; ctx.fill();
      ctx.strokeStyle = '#58626b'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#111519'; ctx.lineWidth = 1.5;
      rrPath(x - 1, y - 1, w + 2, h + 2, r + 1); ctx.stroke();
      /* remaches del marco */
      ctx.fillStyle = '#7b8690';
      [[x - 2, y + 10],[x + w + 2, y + 10],[x - 2, y + h - 10],[x + w + 2, y + h - 10]].forEach(rv=>{
        ctx.beginPath(); ctx.arc(rv[0], rv[1], 1.8, 0, 7); ctx.fill();
      });

      ctx.save();
      rrPath(x, y, w, h, r); ctx.clip();
      /* fondo hueco transparente del tanque (degradado cilíndrico interior + tubo interno) */
      const cav = ctx.createLinearGradient(x, 0, x + w, 0);
      cav.addColorStop(0, '#090e13');
      cav.addColorStop(0.25, '#131d26');
      cav.addColorStop(0.5, '#192630');
      cav.addColorStop(0.8, '#101820');
      cav.addColorStop(1, '#080c10');
      ctx.fillStyle = cav;
      ctx.fillRect(x, y, w, h);
      /* tubo interior vertical visto a través del cristal */
      ctx.fillStyle = 'rgba(130,155,175,.14)';
      ctx.fillRect(x + w*0.26, y, 5, h);
      ctx.fillStyle = 'rgba(255,255,255,.06)';
      ctx.fillRect(x + w*0.26 + 1, y, 1.5, h);

      const activeWave = (fo.pouringIn || fo.pumpingIn || fo.drainingOut) ? 1.65 : 1;
      const surfY = y + h*(1 - level);
      /* chorro entrante desde arriba cuando llueve en el tanque sucio */
      if(fo.pouringIn){
        const streamCol = fo.acidRain ? 'rgba(162,226,102,.70)' : 'rgba(128,212,248,.72)';
        const streamX = x + w*0.30;
        const streamBot = Math.min(y + h, surfY + 4);
        ctx.strokeStyle = streamCol;
        ctx.lineWidth = 3.2; ctx.lineCap = 'round';
        ctx.setLineDash([8, 6]);
        ctx.lineDashOffset = -((t * 0.14) % 14);
        ctx.beginPath(); ctx.moveTo(streamX, y); ctx.lineTo(streamX, streamBot); ctx.stroke();
        ctx.setLineDash([]);
        for(let di = 0; di < 3; di++){
          const ph = ((t * 0.0028 + di * 0.33) % 1);
          const dy = y + ph * Math.max(8, streamBot - y);
          ctx.fillStyle = streamCol;
          ctx.beginPath(); ctx.arc(streamX + Math.sin(t/180 + di)*2.5, dy, 2.2, 0, 7); ctx.fill();
        }
      }
      /* el líquido dentro del tanque transparente */
      if(level > 0.01){
        const wg = ctx.createLinearGradient(0, surfY, 0, y + h);
        wg.addColorStop(0, topCol); wg.addColorStop(1, botCol);
        ctx.fillStyle = wg;
        ctx.beginPath();
        ctx.moveTo(x, y + h);
        for(let px = 0; px <= w; px += 8) ctx.lineTo(x + px, surfY + Math.sin(px/18 + t/320)*2.8*activeWave);
        ctx.lineTo(x + w, y + h);
        ctx.closePath(); ctx.fill();
        /* burbujas que suben dentro del agua (más intensas al bombear agua limpia) */
        const nb = fo.pumpingIn ? 14 : (kind === 'dirty' ? 5 : 8);
        const span = Math.max(12, (y + h - 8) - (surfY + 6));
        for(let i = 0; i < nb; i++){
          const colBase = fo.pumpingIn && i >= 8
            ? (x + w*0.42 + Math.sin(t/260 + i*1.7)*10)
            : (x + 12 + ((i*59 + (kind === 'dirty' ? 23 : 0)) % Math.max(18, w - 24)));
          const spd = fo.pumpingIn ? 11 : (kind === 'dirty' ? 40 : 16);
          const by = (y + h - 6) - ((t/spd + i*37) % span);
          if(by > surfY + 5){
            ctx.fillStyle = kind === 'dirty' ? 'rgba(232,222,180,.36)' : 'rgba(225,248,255,.54)';
            ctx.beginPath(); ctx.arc(colBase + Math.sin(t/450 + i)*2, by, kind === 'dirty' ? 2.6 : 2.1 + (i % 3)*0.55, 0, 7); ctx.fill();
          }
        }
        /* superficie luminosa del agua */
        ctx.strokeStyle = kind === 'dirty' ? 'rgba(236,216,158,.85)' : 'rgba(225,248,255,.92)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        for(let px = 0; px <= w; px += 8){
          const yy = surfY + Math.sin(px/18 + t/320)*2.8*activeWave;
          if(px === 0) ctx.moveTo(x + px, yy); else ctx.lineTo(x + px, yy);
        }
        ctx.stroke();
      }
      /* reflejo vertical del cristal frontal (da sensación de vidrio transparente) */
      const hg = ctx.createLinearGradient(x, 0, x + w, 0);
      hg.addColorStop(0.08, 'rgba(255,255,255,0)');
      hg.addColorStop(0.18, 'rgba(255,255,255,.15)');
      hg.addColorStop(0.28, 'rgba(255,255,255,0)');
      hg.addColorStop(0.84, 'rgba(255,255,255,0)');
      hg.addColorStop(0.92, 'rgba(255,255,255,.08)');
      ctx.fillStyle = hg; ctx.fillRect(x, y, w, h);

      /* marcas de ¼, ½ y ¾ grabadas en el cristal */
      ctx.strokeStyle = 'rgba(230,244,250,.40)'; ctx.lineWidth = 1.8;
      [0.25, 0.5, 0.75].forEach(f=>{
        const ty = y + h*(1 - f);
        ctx.beginPath(); ctx.moveTo(x + 4, ty); ctx.lineTo(x + 14, ty); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + w - 14, ty); ctx.lineTo(x + w - 4, ty); ctx.stroke();
      });
      /* marcador ámbar en la superficie */
      if(level > 0.01 && level < 0.995){
        ctx.fillStyle = '#e8a33d';
        ctx.save(); ctx.translate(x + w - 7, surfY); ctx.rotate(Math.PI/4); ctx.fillRect(-4.5, -4.5, 9, 9); ctx.restore();
      }
      /* lectura de litros dentro del visor */
      if(typeof curL === 'number'){
        const lbl = Math.floor(curL) + '/' + capL + 'L';
        ctx.fillStyle = 'rgba(7,10,14,.74)';
        rrPath(x + w/2 - 30, y + h - 22, 60, 17, 4); ctx.fill();
        ctx.fillStyle = kind === 'dirty' ? '#e5c67a' : '#9ee0fa';
        ctx.font = '600 11px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(lbl, x + w/2, y + h - 13.5);
      }
      ctx.restore();
      ctx.restore();
    }

    function shapePath(c, el){
      const { x, y, w, h } = el;
      c.beginPath();
      if(el.shape === 'circle'){
        c.ellipse(x + w/2, y + h/2, Math.max(1, w/2), Math.max(1, h/2), 0, 0, Math.PI*2);
      } else if(el.shape === 'roundrect'){
        const r = Math.min(el.radius || 0, w/2, h/2);
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      } else if(el.shape === 'polygon' && Array.isArray(el.points) && el.points.length >= 3){
        el.points.forEach((pt, idx)=>{
          const px = x + pt[0]*w, py = y + pt[1]*h;
          if(idx === 0) c.moveTo(px, py); else c.lineTo(px, py);
        });
        c.closePath();
      } else {
        c.rect(x, y, w, h);
      }
    }

    function elementHitTest(el, px, py){
      const cx = el.x + el.w/2, cy = el.y + el.h/2;
      let lx = px, ly = py;
      if(el.rot){
        const r = -((el.rot * Math.PI) / 180);
        const dx = px - cx, dy = py - cy;
        lx = cx + dx * Math.cos(r) - dy * Math.sin(r);
        ly = cy + dx * Math.sin(r) + dy * Math.cos(r);
      }
      if(lx < el.x || lx > el.x + el.w || ly < el.y || ly > el.y + el.h) return false;
      if(el.shape === 'circle'){
        const nx = (lx - cx) / Math.max(1, el.w/2);
        const ny = (ly - cy) / Math.max(1, el.h/2);
        return nx*nx + ny*ny <= 1;
      }
      if(el.shape === 'polygon' && Array.isArray(el.points) && el.points.length >= 3){
        const pts = el.points.map(pt => [el.x + pt[0]*el.w, el.y + pt[1]*el.h]);
        let inside = false;
        for(let i = 0, j = pts.length - 1; i < pts.length; j = i++){
          const xi = pts[i][0], yi = pts[i][1];
          const xj = pts[j][0], yj = pts[j][1];
          const intersect = ((yi > ly) !== (yj > ly)) && (lx < (xj - xi) * (ly - yi) / ((yj - yi) || 1e-7) + xi);
          if(intersect) inside = !inside;
        }
        return inside;
      }
      return true;
    }

    function drawCustomSpriteElement(c, el, t){
      const im = getSpriteImage(el.spriteId);
      if(!im) return;
      const iw = im.naturalWidth || im.width;
      const ih = im.naturalHeight || im.height;
      if(!iw || !ih) return;

      const cr = el.spriteCrop || { x:0, y:0, w:iw, h:ih };
      const sx = clamp(cr.x, 0, iw - 1), sy = clamp(cr.y, 0, ih - 1);
      const sw = Math.max(1, Math.min(iw - sx, cr.w)), sh = Math.max(1, Math.min(ih - sy, cr.h));

      c.save();
      c.globalAlpha *= (el.opacity ?? 1);
      const cx = el.x + el.w/2, cy = el.y + el.h/2;
      let animRot = 0, animBobY = 0, animScale = 1, animShX = 0, animShY = 0;
      const spd = el.animSpeed || 1;
      if(el.anim === 'spin') animRot = ((t/1000) * 1.4 * spd) % (Math.PI*2);
      else if(el.anim === 'bob') animBobY = Math.sin((t/420) * spd) * Math.max(4, el.h*0.04);
      else if(el.anim === 'pulse') animScale = 1 + Math.sin((t/320) * spd) * 0.06;
      else if(el.anim === 'shake'){ animShX = Math.sin((t/35) * spd)*2.5; animShY = Math.cos((t/43) * spd)*2; }

      if(el.rot){
        c.translate(cx, cy);
        c.rotate((el.rot * Math.PI) / 180);
        c.translate(-cx, -cy);
      }
      if(el.clipToShape !== false){
        shapePath(c, el);
        c.clip();
      }
      c.translate(cx + animShX, cy + animBobY + animShY);
      if(animRot) c.rotate(animRot);
      c.scale((el.flipX ? -1 : 1) * animScale, (el.flipY ? -1 : 1) * animScale);

      let dw = el.w, dh = el.h;
      if(el.spriteFit === 'contain'){
        const sc = Math.min(el.w / sw, el.h / sh);
        dw = sw * sc; dh = sh * sc;
      } else if(el.spriteFit === 'cover'){
        const sc = Math.max(el.w / sw, el.h / sh);
        dw = sw * sc; dh = sh * sc;
      }
      c.drawImage(im, sx, sy, sw, sh, -dw/2, -dh/2, dw, dh);
      c.restore();
    }

    function drawVectorShapeElement(c, el, t){
      c.save();
      c.globalAlpha *= (el.opacity ?? 1);
      const cx = el.x + el.w/2, cy = el.y + el.h/2;
      if(el.rot){
        c.translate(cx, cy);
        c.rotate((el.rot * Math.PI) / 180);
        c.translate(-cx, -cy);
      }
      if(el.anim === 'bob') c.translate(0, Math.sin(t/420)*5);
      shapePath(c, el);
      if(el.fillColor){ c.fillStyle = el.fillColor; c.fill(); }
      if((el.strokeWidth ?? 2) > 0 && el.strokeColor){
        c.strokeStyle = el.strokeColor; c.lineWidth = el.strokeWidth ?? 2; c.stroke();
      }
      c.restore();
    }

    function drawBunker(){
      const t = performance.now();
      const dtF = Math.min((t - lastDrawT)/1000, 0.05); lastDrawT = t;
      /* fondo del lienzo: color tierra, jamás barras negras */
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#171310'; ctx.fillRect(0, 0, cv.width, cv.height);
      const edState = editor.active && editor.getState ? editor.getState() : null;
      const pow = powered(), lights = (edState && edState.previewDark) ? false : (S.lightsOn && pow);
      /* FUNDIDO CRUZADO entre paisajes: si el objetivo cambió, la imagen
         saliente queda debajo y la entrante se revela encima en ~2,6 s */
      const bgTarget = pickBg(lights);
      if(bgTarget !== bgShown){
        if(bgFadeT >= 1 || !bgFrom) bgFrom = bgShown;
        bgShown = bgTarget; bgFadeT = 0;
      }
      if(bgFadeT < 1) bgFadeT = Math.min(1, bgFadeT + dtF/2.6);
      curImg = bgShown;
      const useDark = bgShown === darkImg;
      if((effView() === 'fit' || editor.active) && imgReady(curImg)){
        /* en vista completa, el hueco lo rellena la propia foto difuminada */
        const bs = Math.max(cv.width/W, cv.height/H) * 1.08;
        ctx.save();
        try{ ctx.filter = 'blur(18px) brightness(.45) saturate(.85)'; }catch(e){}
        ctx.drawImage(curImg, (cv.width - W*bs)/2, (cv.height - H*bs)/2, W*bs, H*bs);
        ctx.restore();
      }
      ctx.setTransform(dpr*view.s, 0, 0, dpr*view.s, dpr*view.ox, dpr*view.oy);
      if(!imgReady(bgImg)){
        R(0,0,W,H,'#171310');
        ctx.fillStyle = '#e3e0d2'; ctx.font = '44px "VT323", monospace';
        ctx.fillText('Cargando el búnker…', 370, 1050);
        /* si la descarga se alarga, la pantalla lo dice en vez de parecer
           colgada: la foto principal se está bajando (y reintentando sola
           si la red corta) y el juego entra en cuanto llegue */
        if(performance.now() - bgWaitSince > 9000){
          ctx.fillStyle = '#a5a294'; ctx.font = '27px "IBM Plex Mono", monospace';
          ctx.fillText('Descargando la foto del búnker…', 330, 1115);
          ctx.fillText('Con conexión lenta puede tardar un poco más.', 262, 1155);
        }
        return;
      }
      if(bgFrom && bgFadeT < 1 && imgReady(bgFrom)){
        ctx.drawImage(bgFrom, 0, 0, W, H);
        ctx.save(); ctx.globalAlpha = bgFadeT;
        ctx.drawImage(curImg, 0, 0, W, H);
        ctx.restore();
      } else ctx.drawImage(curImg, 0, 0, W, H);

      /* velocidad del ventilador: giro suave y legible (sin aliasing), con inercia al arrancar y parar */
      const fanTarget = (S.fanOn && S.sysFault !== 'fan_motor' && pow) ? (4.8 + S.levels.fan*1.1) : 0;
      fanVel += (fanTarget - fanVel) * (1 - Math.exp(-dtF*1.6));
      if(Math.abs(fanVel) < 0.02 && fanTarget === 0) fanVel = 0;
      fanAng = (fanAng + fanVel * dtF) % (Math.PI*2);
      /* niveles de tanque: persiguen el nivel real con suavidad */
      dispDirty += (clamp(S.dirty/80, 0, 1) - dispDirty) * Math.min(1, dtF*1.7);
      dispClean += (clamp(S.clean/CLEAN_CAP, 0, 1) - dispClean) * Math.min(1, dtF*1.7);

      /* ---- PAISAJE EXTERIOR: imagen de paisaje distinta por cada clima + efectos continuos hasta la cubierta del búnker ---- */
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, 622); ctx.clip();
      const dayF = clamp(Math.sin((S.hour-6)/12*Math.PI), 0, 1);
      const nightA = (1 - dayF) * 0.52;
      function surfTint(col, a){
        const g = ctx.createLinearGradient(0, 0, 0, 588);
        g.addColorStop(0, col.replace('A', a));
        g.addColorStop(0.76, col.replace('A', a * 0.85));
        g.addColorStop(0.90, col.replace('A', a * 0.35));
        g.addColorStop(1, col.replace('A', 0));
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, 588);
      }
      const wid = S.weather.id;
      const wxTgt = { clear:0, cloudy:0, rain:0, storm:0, sand:0, dust:0, acid:0, rad:0, snow:0 };
      wxTgt[wid] = 1;
      const wxK = 1 - Math.exp(-dtF*0.85);
      for(const k in wxFx) wxFx[k] += (wxTgt[k] - wxFx[k]) * wxK;
      const F = wxFx;

      /* Dibujar paisajes reales por clima detrás de los reflectores, panel solar y chimenea */
      let anyWxDrawn = false;
      for(const wk in F){
        const wAlpha = F[wk];
        const wIm = WXIMGS[wk];
        if(wAlpha > 0.015 && imgReady(wIm)){
          const sw = wIm.naturalWidth || wIm.width;
          const sh = wIm.naturalHeight || wIm.height;
          ctx.save();
          ctx.globalAlpha = Math.min(1, wAlpha);
          ctx.drawImage(wIm, sw * 0.04, sh * 0.04, sw * 0.92, sh * 0.76, 0, 0, W, 396);
          ctx.restore();
          anyWxDrawn = true;
        }
      }
      if(dayF > 0.55) surfTint('rgba(255,214,160,A)', (dayF - 0.55)*0.16);
      if(F.clear > 0.02 && dayF > 0.05){
        glowDot(640, 88, 200, 'rgba(255,232,170,A)', F.clear * dayF * (anyWxDrawn ? 0.18 : 0.30));
      }
      if(F.cloudy > 0.02 && !anyWxDrawn) surfTint('rgba(120,126,132,A)', 0.24 * F.cloudy);
      if(F.rain > 0.02) surfTint('rgba(70,92,120,A)', (anyWxDrawn ? 0.09 : 0.22) * F.rain);
      if(F.storm > 0.02) surfTint('rgba(34,42,68,A)', (anyWxDrawn ? 0.14 : 0.38) * F.storm);
      if(F.sand > 0.02) surfTint('rgba(176,120,52,A)', (anyWxDrawn ? 0.18 : 0.44) * F.sand);
      if(F.dust > 0.02) surfTint('rgba(150,105,50,A)', (anyWxDrawn ? 0.09 : 0.17) * F.dust);
      if(F.acid > 0.02) surfTint('rgba(74,104,56,A)', (anyWxDrawn ? 0.10 : 0.24) * F.acid);
      if(F.rad > 0.02){
        surfTint('rgba(74,112,40,A)', (anyWxDrawn ? 0.08 : 0.22) * F.rad);
        glowDot(580, 150, 310, 'rgba(140,200,80,A)', F.rad * (0.09 + Math.sin(t/900)*0.03));
      }
      if(F.snow > 0.02){
        surfTint('rgba(175,212,240,A)', (anyWxDrawn ? 0.14 : 0.36) * F.snow);
      }

      /* Restaurar primer plano de superficie (reflectores, escotilla, panel solar y chimenea) delante del paisaje */
      if(anyWxDrawn && surfaceFgLit){
        const fgShow = useDark && surfaceFgDark ? surfaceFgDark : surfaceFgLit;
        const fgPrev = (bgFrom === darkImg && surfaceFgDark) ? surfaceFgDark : surfaceFgLit;
        if(bgFadeT < 1 && fgPrev && fgPrev !== fgShow){
          ctx.drawImage(fgPrev, 0, 0);
          ctx.save(); ctx.globalAlpha = bgFadeT;
          ctx.drawImage(fgShow, 0, 0);
          ctx.restore();
        } else {
          ctx.drawImage(fgShow, 0, 0);
        }
      }
      if(nightA > 0.02) surfTint('rgba(8,12,30,A)', nightA);
      if(S.exped) surfTint('rgba(90,140,40,A)', 0.06 + S.expo/100*0.16);
      /* Haces de luz de los reflectores de superficie cuando las luces están encendidas */
      if(lights){
        const beamA = 0.22 + (1 - dayF) * 0.16;
        ctx.save();
        const b1 = ctx.createLinearGradient(540, 145, 290, 505);
        b1.addColorStop(0, 'rgba(255,244,205,' + (beamA * 1.1) + ')');
        b1.addColorStop(0.6, 'rgba(255,222,155,' + (beamA * 0.45) + ')');
        b1.addColorStop(1, 'rgba(255,212,135,0)');
        ctx.fillStyle = b1;
        ctx.beginPath(); ctx.moveTo(522, 148); ctx.lineTo(560, 148); ctx.lineTo(445, 505); ctx.lineTo(185, 505); ctx.closePath(); ctx.fill();
        const b2 = ctx.createLinearGradient(644, 145, 780, 495);
        b2.addColorStop(0, 'rgba(255,244,205,' + (beamA * 0.95) + ')');
        b2.addColorStop(0.6, 'rgba(255,222,155,' + (beamA * 0.35) + ')');
        b2.addColorStop(1, 'rgba(255,212,135,0)');
        ctx.fillStyle = b2;
        ctx.beginPath(); ctx.moveTo(626, 148); ctx.lineTo(664, 148); ctx.lineTo(840, 495); ctx.lineTo(640, 495); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      const t2 = t/16;
      const wxFadeY = y => y > 508 ? clamp(1 - (y - 508) / 70, 0, 1) : 1;
      function rainStreaks(col, n, len, spd, baseA){
        ctx.lineWidth = 2.2; ctx.lineCap = 'round';
        for(let i=0;i<n;i++){
          const p = rainP[i % rainP.length];
          const x = ((p.x - t2*p.s*1.1) % W + W) % W;
          const y = (p.y + t2*p.s*spd) % 578;
          const fy = wxFadeY(y);
          if(fy <= 0.02) continue;
          ctx.strokeStyle = col.replace('A', (baseA * fy).toFixed(3));
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len*0.28, y + len); ctx.stroke();
        }
      }
      if(F.rain > 0.02){
        ctx.save(); ctx.globalAlpha = F.rain;
        rainStreaks('rgba(168,196,224,A)', Math.max(1, Math.round(52*F.rain)), 16, 3, 0.56);
        ctx.fillStyle = 'rgba(190,215,235,.12)';
        ctx.beginPath(); ctx.ellipse(580, 514, 340, 12, 0, 0, 7); ctx.fill();
        ctx.restore();
      }
      if(F.storm > 0.02){
        ctx.save(); ctx.globalAlpha = F.storm;
        rainStreaks('rgba(178,204,232,A)', Math.max(1, Math.round(74*F.storm)), 20, 3.8, 0.66);
        ctx.restore();
      }
      if(F.acid > 0.02 || F.sand > 0.02){
        buildWxMistSprites();
        const gust = 1 + 0.24 * Math.sin(t/1500) + 0.10 * Math.sin(t/620);
        const driftScale = F.sand >= F.acid ? (2.4 * gust) : 0.72;
        wxWisps.forEach(w=>{
          w.x += w.spd * driftScale * dtF;
          if(w.x - w.w*0.5 > W) w.x = -w.w*0.5;
        });
        wxParticles.forEach(p=>{
          p.x += (F.sand >= F.acid ? 165 * gust : 22) * p.s * dtF;
          p.y += (F.sand >= F.acid ? Math.sin(t/420 + p.phase)*18 : -11 * p.s) * dtF;
          if(p.x > W + 16) p.x = -16;
          if(p.y < -12) p.y = 570;
          else if(p.y > 576) p.y = 4;
        });
      }
      if(F.acid > 0.02){
        ctx.save(); ctx.globalAlpha = F.acid;
        rainStreaks('rgba(150,205,95,A)', Math.max(1, Math.round(60*F.acid)), 15, 3.2, 0.70);
        const shim = 0.5 + Math.sin(t/300)*0.18;
        [[530,512,48],[740,514,56],[970,510,40]].forEach(pc=>{
          ctx.fillStyle = 'rgba(110,185,70,.20)';
          ctx.beginPath(); ctx.ellipse(pc[0], pc[1], pc[2], 6, 0, 0, 7); ctx.fill();
          glowDot(pc[0], pc[1], pc[2]*0.8, 'rgba(140,220,90,A)', 0.13*shim + 0.08);
        });
        if(wxMistAcid){
          wxWisps.forEach((w, idx)=>{
            const wy = 340 + (idx % 6) * 36 + Math.sin(t/1700 + w.phase) * 7;
            ctx.globalAlpha = F.acid * w.a * wxFadeY(wy) * (0.55 + 0.15 * Math.sin(t/1900 + w.phase));
            ctx.drawImage(wxMistAcid, w.x - w.w*0.5, wy - w.h*0.5, w.w, w.h);
          });
        }
        wxParticles.forEach((p, idx)=>{
          if(idx >= 30) return;
          const py = 270 + ((p.y * 0.52 + Math.sin(t/1100 + p.phase)*10) % 290);
          ctx.globalAlpha = F.acid * p.a * wxFadeY(py) * 0.72;
          ctx.fillStyle = idx % 3 === 0 ? 'rgba(182,226,128,0.85)' : 'rgba(140,196,92,0.75)';
          ctx.beginPath();
          ctx.arc(p.x, py, p.r * 0.9, 0, Math.PI*2);
          ctx.fill();
        });
        ctx.restore();
      }
      if(F.rad > 0.02){
        ctx.save(); ctx.globalAlpha = F.rad;
        rainP.slice(0, Math.max(1, Math.round(rainP.length * F.rad))).forEach(p=>{
          const rx = (p.x % W) + Math.sin(t2/9 + p.y)*5;
          const ry = (p.y + t2*p.s*1.4) % 576;
          const fy = wxFadeY(ry);
          if(fy <= 0.02) return;
          ctx.fillStyle = 'rgba(150,180,90,' + (0.55 * fy).toFixed(3) + ')';
          ctx.fillRect(rx, ry, 4, 4);
        });
        ctx.restore();
      }
      if(F.sand > 0.02){
        ctx.save(); ctx.globalAlpha = F.sand;
        rainP.slice(0, Math.max(1, Math.round(rainP.length * F.sand))).forEach(p=>{
          const sx = (p.x + t2*p.s*7) % W;
          const sy = p.y % 576;
          const fy = wxFadeY(sy);
          if(fy <= 0.02) return;
          ctx.fillStyle = 'rgba(196,150,84,' + (0.60 * fy).toFixed(3) + ')';
          ctx.fillRect(sx, sy, 16, 2.5);
        });
        /* neblina de arena continua sin borde rectangular inferior */
        const g2 = ctx.createLinearGradient(0, 260, 0, 588);
        g2.addColorStop(0, 'rgba(178,124,54,0)');
        g2.addColorStop(0.58, 'rgba(178,124,54,.30)');
        g2.addColorStop(0.82, 'rgba(178,124,54,.22)');
        g2.addColorStop(1, 'rgba(178,124,54,0)');
        ctx.fillStyle = g2; ctx.fillRect(0, 260, W, 328);
        glowDot(220, 395, 210, 'rgba(196,150,84,A)', .18);
        glowDot(960, 395, 210, 'rgba(196,150,84,A)', .15);
        if(wxMistSand){
          wxWisps.forEach(w=>{
            const wy = 240 + ((w.y - 160) * 0.95) + Math.sin(t/1200 + w.phase) * 8;
            ctx.globalAlpha = F.sand * w.a * wxFadeY(wy) * (0.58 + 0.18 * Math.sin(t/1400 + w.phase));
            ctx.drawImage(wxMistSand, w.x - w.w*0.65, wy - w.h*0.42, w.w*1.3, w.h*0.84);
          });
        }
        wxParticles.forEach((p, idx)=>{
          const py = p.y + Math.sin(t/380 + p.phase) * 6;
          ctx.globalAlpha = F.sand * p.a * wxFadeY(py) * 0.85;
          ctx.fillStyle = idx % 2 === 0 ? 'rgba(236,196,136,0.85)' : 'rgba(208,158,92,0.80)';
          if(idx % 4 === 0){
            ctx.fillRect(p.x, py, 7 * p.s, 1.4);
          } else {
            ctx.beginPath();

        } else if(k === 'fuelGauge'){

          rrPath(cx - 7, tubeTopY, 14, 6, 2); ctx.fill(); ctx.stroke();

          /* soporte / orejetas con remaches en la pared */
          const earR = r + 3.5;
          [[-0.75, -0.75], [0.75, -0.75], [-0.75, 0.75], [0.75, 0.75]].forEach(([dx, dy]) => {

            const blink = Math.floor(t/440) % 2 === 0;
            ctx.save();
            ctx.fillStyle = 'rgba(18,12,12,.92)';
            rrPath(846, 864, 162, 24, 6); ctx.fill();
            ctx.strokeStyle = blink ? '#e8a33d' : '#8a5229';
            ctx.lineWidth = 1.8; ctx.stroke();
            ctx.fillStyle = blink ? '#ffbe55' : '#e09a48';
            ctx.font = '700 10.5px "IBM Plex Mono", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🔋 CELDA QUEMADA (' + cap + 'W)', 927, 876);
            ctx.restore();
          }
        } else if(k === 'battBar'){
          /* Pantalla izquierda del centro de computación casero: Energía y Baterías */
          const cap = effBattCap();
          const net = netPower();
          const bpct = clamp(S.battery / Math.max(1, cap) * 100, 0, 100);
          const bcol = (S.battFire || bpct < 22) ? '#e0524d' : (S.sysFault === 'batt_fire' || bpct < 45) ? '#e8a33d' : '#7fb069';
          const dim = lights ? 1 : (pow ? 0.88 : 0.45);
          const ix = 466, iy = 822, iw = 122, ih = 88;
          ctx.save(); ctx.globalAlpha *= dim;
          rrPath(ix, iy, iw, ih, 4);
          ctx.fillStyle = S.battFire ? '#1c0807' : '#070d09'; ctx.fill();
          ctx.strokeStyle = S.battFire ? '#e0524d' : '#2d3732'; ctx.lineWidth = 1.4; ctx.stroke();
          ctx.save(); rrPath(ix, iy, iw, ih, 4); ctx.clip();
          /* cabecera de la pantalla de energía */
          ctx.fillStyle = S.battFire ? 'rgba(224,82,77,.28)' : 'rgba(127,176,105,.16)';
          ctx.fillRect(ix, iy, iw, 17);
          ctx.fillStyle = S.battFire ? '#ff9b96' : '#9bb5a3';
          ctx.font = '600 9.5px "IBM Plex Mono", monospace';
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText(S.battFire ? '🔥 FUEGO BAT' : (S.sysFault === 'batt_fire' ? '⚠️ CELDA ROTA' : 'ENERGÍA·Nv' + S.levels.batt), ix + 6, iy + 9);
          ctx.fillStyle = net >= 0 && !S.battFire ? '#7fb069' : (bpct < 22 || S.battFire ? '#e0524d' : '#e8a33d');
          ctx.beginPath(); ctx.arc(ix + iw - 7, iy + 9, 3.0, 0, 7); ctx.fill();
          /* porcentaje grande centrado */
          ctx.fillStyle = pow || S.battFire ? bcol : '#6d5757';
          ctx.font = '38px "VT323", monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(Math.round(bpct) + '%', ix + iw/2, iy + 38);
          /* barra segmentada horizontal */
          const barX = ix + 7, barY = iy + 57, barW = iw - 14, barH = 9;
          const activeCells = Math.round(bpct / 100 * 8);
          const cw2 = (barW - 7*2) / 8;
          for(let ci = 0; ci < 8; ci++){
            const cx2 = barX + ci*(cw2 + 2);
            ctx.fillStyle = ci < activeCells ? bcol : 'rgba(255,255,255,.11)';
            ctx.fillRect(cx2, barY, cw2, barH);
          }
          /* lectura inferior compacta: W y carga neta */
          ctx.fillStyle = '#c9d4ca';
          ctx.font = '600 9.5px "IBM Plex Mono", monospace';
          ctx.textAlign = 'left';
          ctx.fillText(Math.round(S.battery) + '/' + cap + 'W', ix + 7, iy + ih - 9.5);
          ctx.fillStyle = net >= 0 ? '#7fb069' : '#e8a33d';
          ctx.textAlign = 'right';
          ctx.fillText((net >= 0 ? '+' : '') + net.toFixed(1) + '/s', ix + iw - 7, iy + ih - 9.5);
          ctx.restore();
          ctx.restore();
          /* LEDs de actividad de la torre PC casera bajo el escritorio */
          if(pow){
            const pcPulse = Math.floor(t/220) % 2 === 0;
            glowDot(644, 1030, 5, 'rgba(127,176,105,A)', pcPulse ? 0.85 : 0.45);
            glowDot(688, 1020, 6, 'rgba(232,163,61,A)', !pcPulse ? 0.80 : 0.35);
          }
          if(lights && (bpct < 22 || S.battFire) && Math.floor(t/450) % 2 === 0) glowDot(ix + iw/2, iy + ih/2, 42, 'rgba(224,82,77,A)', .28);
        } else if(k === 'tempScreen'){
          /* Pantalla derecha CRT del centro de computación casero: Temperatura */
          const thScr = thermalState(pow);
          const tNow = S.bunkerTemp;
          const heaterBroken = S.sysFault === 'heater_coil';
          const tCol = heaterBroken ? '#e0524d' : (tNow < 10 ? '#7bc8f6' : (tNow < 14 ? '#a3dcf9' : (tNow <= 23.5 ? '#7fb069' : '#e8a33d')));
          const extVal = typeof S.weather.tempExt === 'number' ? S.weather.tempExt : 18;
          const dim = lights ? 1 : (pow ? 0.88 : 0.45);
          const ix = 642, iy = 844, iw = 74, ih = 60;
          ctx.save(); ctx.globalAlpha *= dim;
          rrPath(ix, iy, iw, ih, 4);
          ctx.fillStyle = heaterBroken ? '#190909' : '#060c10'; ctx.fill();
          ctx.strokeStyle = heaterBroken ? '#c94a44' : '#313d46'; ctx.lineWidth = 1.2; ctx.stroke();
          ctx.save(); rrPath(ix, iy, iw, ih, 4); ctx.clip();
          /* cabecera */
          ctx.fillStyle = heaterBroken ? 'rgba(224,82,77,.24)' : (tNow < 12 ? 'rgba(123,200,246,.16)' : (thScr.heaterEffective ? 'rgba(232,163,61,.18)' : 'rgba(127,176,105,.15)'));
          ctx.fillRect(ix, iy, iw, 13);
          ctx.fillStyle = heaterBroken ? '#ff9b96' : '#9bb2be';
          ctx.font = '600 8px "IBM Plex Mono", monospace';
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText(heaterBroken ? 'FALLA' : 'TEMP', ix + 4, iy + 6.8);
          const ledCol = (!pow || heaterBroken) ? '#e0524d' : (thScr.heaterEffective ? '#e8a33d' : (tNow < 12 ? '#7bc8f6' : '#7fb069'));
          ctx.fillStyle = ledCol;
          ctx.beginPath(); ctx.arc(ix + iw - 5.5, iy + 6.8, 2.3, 0, 7); ctx.fill();
          /* lectura principal en grande */
          ctx.fillStyle = pow ? tCol : '#5a6870';
          ctx.font = '31px "VT323", monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(Math.round(tNow) + '°C', ix + iw/2, iy + 31);
          /* línea inferior: exterior y estado de calefacción */
          ctx.fillStyle = '#92a5b0';
          ctx.font = '600 7.8px "IBM Plex Mono", monospace';
          ctx.textAlign = 'left';
          ctx.fillText('E:' + extVal + '°', ix + 4, iy + ih - 7);
          let stTxt = 'OK', stCol = '#7fb069';
          if(heaterBroken){ stTxt = 'ROTA'; stCol = '#e0524d'; }
          else if(!pow){ stTxt = 'S/E'; stCol = '#e0524d'; }
          else if(thScr.heaterEffective){ stTxt = 'CAL'; stCol = '#e8a33d'; }
          else if(thScr.heaterOnAndPow){ stTxt = 'BAJ'; stCol = '#7bc8f6'; }
          else if(S.heaterOn === false && (tNow < 16 || thScr.snowNow)){ stTxt = 'OFF'; stCol = '#e0524d'; }
          ctx.fillStyle = stCol;
          ctx.textAlign = 'right';
          ctx.fillText(stTxt, ix + iw - 4, iy + ih - 7);
          ctx.restore();
          ctx.restore();
          if(pow && (tNow < 10 || heaterBroken) && Math.floor(t/500) % 2 === 0){
            glowDot(ix + iw/2, iy + ih/2, 28, heaterBroken ? 'rgba(224,82,77,A)' : 'rgba(123,200,246,A)', .28);
          }
        } else if(k === 'cleanFill'){
          const irrigatingNow = irrigActiveT > 0 && S.cropPlanted && S.growth < 100 && pow && S.sysFault !== 'hydro_uv' && S.clean > 0.2;
          tankFill(834, 1320, 88, 68, 8, dispClean, 'rgba(116,204,242,.78)', 'rgba(26,98,158,.90)', t + 900, 'clean', lights, S.clean, CLEAN_CAP, { pumpingIn: pumping, drainingOut: irrigatingNow });
        } else if(k === 'pump'){
          const pjx = pumping ? (Math.random() - 0.5)*2.0 : 0;
          const pjy = pumping ? (Math.random() - 0.5)*1.5 : 0;
          if(pumping){
            ctx.save();
            ctx.translate(pjx, pjy);
            drawRegion(400, 1934, 158, 82);
            ctx.restore();
          }
          if(S.sysFault === 'pump_valve'){
            const blink = Math.floor(t/400) % 2 === 0;
            ctx.save();
            ctx.fillStyle = 'rgba(18,10,10,.92)';
            rrPath(412, 1912, 134, 24, 6); ctx.fill();
            ctx.strokeStyle = blink ? '#ff6247' : '#a83b32';
            ctx.lineWidth = 1.8; ctx.stroke();
            ctx.fillStyle = blink ? '#ff8b78' : '#e0524d';
            ctx.font = '700 10.5px "IBM Plex Mono", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🚰 VÁLVULA ROTA', 479, 1924);
            ctx.restore();
          }
        } else if(k === 'fan' || k === 'fanZone'){
          const fanSpec =
            el.id === 'fan1' ? FANS[0] :
            el.id === 'fan2' ? FANS[1] :
            el.id === 'fan'  ? FANS[2] :
            {
              cx: (def ? def.x + def.w/2 : el.x + el.w/2),
              cy: (def ? def.y + def.h/2 : el.y + el.h/2),
              rx: (def ? def.w : el.w) * 0.36,
              ry: (def ? def.h : el.h) * 0.36,
              dir: ((el.x + el.w/2) < W/2 ? 1 : -1)
            };
          const cx = fanSpec.cx, cy = fanSpec.cy, rx = fanSpec.rx, ry = fanSpec.ry;
          const rOut = Math.max(rx, ry) + 12;
          const movedOrResized = !def || Math.abs(el.x - def.x) > 6 || Math.abs(el.y - def.y) > 6 || Math.abs(el.w - def.w) > 6 || Math.abs(el.h - def.h) > 6;
          if(movedOrResized){
            ctx.save();
            ctx.strokeStyle = '#333b42';
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx + 3, ry + 3, 0, 0, 7);
            ctx.stroke();
            ctx.restore();
          }
          if(fanSprite){
            const baseFanA = ctx.globalAlpha;
            ctx.save();
            ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.clip();
            ctx.translate(cx, cy);
            ctx.scale(rx / FAN_R, ry / FAN_R);
            if(Math.abs(fanVel) > 0.05){
              if(fanVel > 2.2){
                ctx.strokeStyle = 'rgba(160,180,192,.11)'; ctx.lineWidth = 10;
                for(let kk=0;kk<3;kk++){
                  ctx.beginPath(); ctx.arc(0, 0, FAN_R*(0.42 + kk*0.22), fanAng*(1 + kk*0.13), fanAng*(1 + kk*0.13) + 3.2); ctx.stroke();
                }
                ctx.globalAlpha = baseFanA * 0.16;
                ctx.save(); ctx.rotate(fanAng - 0.95); ctx.drawImage(fanSprite, -FAN_R, -FAN_R, FAN_R*2, FAN_R*2); ctx.restore();
                ctx.globalAlpha = baseFanA * 0.28;
                ctx.save(); ctx.rotate(fanAng - 0.47); ctx.drawImage(fanSprite, -FAN_R, -FAN_R, FAN_R*2, FAN_R*2); ctx.restore();
                ctx.globalAlpha = baseFanA;
              }
              ctx.rotate(fanAng);
              ctx.drawImage(fanSprite, -FAN_R, -FAN_R, FAN_R*2, FAN_R*2);
            } else {
              ctx.rotate(fanAng);
              ctx.drawImage(fanSprite, -FAN_R, -FAN_R, FAN_R*2, FAN_R*2);
            }
            ctx.restore();
          }
          if(fanVel > 2){
            const dir = el.flipX ? -(fanSpec.dir || -1) : (fanSpec.dir || -1);
            for(let i=0;i<3;i++){
              const prog = (t/9 + i*50) % 130;
              const ax = cx + dir*(rx + 12 + prog);
              const ay = cy + (i - 1)*(ry*0.46) + Math.sin(t/300 + i*2)*3.5;
              ctx.strokeStyle = 'rgba(180,215,230,' + (0.20*(1 - prog/130)).toFixed(3) + ')';
              ctx.lineWidth = 3.2; ctx.lineCap = 'round';
              ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + dir*20, ay); ctx.stroke();
            }
          }
          if(S.fanOn && S.sysFault !== 'fan_motor' && pow) glowDot(cx, cy, rOut + 10, 'rgba(165,205,220,A)', .09 + Math.sin(t/240)*0.025);
          if(S.sysFault === 'fan_motor' && el.id === 'fan'){
            const blink = Math.floor(t/400) % 2 === 0;
            ctx.save();
            ctx.fillStyle = 'rgba(18,10,10,.92)';
            rrPath(cx - 64, cy + ry - 8, 128, 22, 6); ctx.fill();
            ctx.strokeStyle = blink ? '#ff6247' : '#a83b32';
            ctx.lineWidth = 1.8; ctx.stroke();
            ctx.fillStyle = blink ? '#ff8b78' : '#e0524d';
            ctx.font = '700 10px "IBM Plex Mono", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🌀 MOTOR QUEMADO', cx, cy + ry + 3);
            ctx.restore();
          }
        }
        ctx.restore();
      }

      /* ---- oscuridad por nivel: pozas de sombra suaves alrededor de cada sala ---- */
      for(let f=0; f<LEVELS.length; f++){
        const rm = LEVELS[f];
        let a = lights ? 0 : (pow ? 0.42 : 0.62);
        if(useDark) a = 0;
        if(S.sleeping) a = Math.max(a, useDark ? 0.22 : 0.45);
        if(a > 0){
          const cx = rm.x + rm.w/2, cy = rm.y + rm.h/2;
          ctx.save(); ctx.translate(cx, cy); ctx.scale(rm.w*0.66, rm.h*1.02);
          const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
          g.addColorStop(0, 'rgba(3,5,9,' + a + ')');
          g.addColorStop(0.72, 'rgba(3,5,9,' + a + ')');
          g.addColorStop(1, 'rgba(3,5,9,0)');
          ctx.fillStyle = g; ctx.fillRect(-1, -1, 2, 2);
          ctx.restore();
        }
      }
      if(lights){
        const lampA = 0.34 - dayF2 * 0.10;
        LAMPS.forEach(L=> lampGlow(L[0], L[1], 220, 'rgba(255,186,84,' + lampA + ')'));
      }

      /* humo sutil en la superficie saliendo por la chimenea de escape del generador */
      if(running && (getElement('gen')?.visible !== false)){
        for(let i=0;i<5;i++){
          const ph = (t/2200 + i/5) % 1;
          const sy = 354 - ph*170;
          const sx = 1096 + Math.sin(ph*5 + i*1.7)*6 + ph*24;
          glowDot(sx, sy, 10 + ph*26, 'rgba(198,198,198,A)', (1 - ph)*0.30);
        }
      }

      /* Render de todos los elementos del Layout en orden de capa (Z-order) */
      for(let i = 0; i < LAYOUT.elements.length; i++){
        const el = LAYOUT.elements[i];
        if(!el.visible) continue;
        const rm = el.renderMode || (el.builtin ? 'default' : 'sprite');
        if(rm === 'default' || rm === 'both'){
          renderNativeKind(el);
        }
        if(rm === 'shape'){
          drawVectorShapeElement(ctx, el, t);
        }
        if((rm === 'sprite' || rm === 'both') && el.spriteId){
          drawCustomSpriteElement(ctx, el, t);
        }
      }

      /* ---- FLUJOS CONTINUOS DE ELECTRICIDAD Y AGUA POR TUBERÍAS Y CABLES ---- */
      {
        const solW = solarOut();
        const solVisible = getElement('solar')?.visible !== false;
        const genVisible = getElement('gen')?.visible !== false;
        const pumpSpd = 120 + (S.levels.pump - 1) * 42;

        /* 1. Corriente ÚNICAMENTE del Panel Solar -> Baterías (por dentro de la funda del cable) */
        if(solVisible && S.levels.solar >= 1 && solW > 0.15){
          const solI = clamp(0.55 + solW / 2.2, 0.55, 1.25);
          const solSpd = 85 + solW * 38;
          drawElectricFlow([[898, 514], [958, 558], [962, 650], [974, 682], [1038, 688], [1047, 704], [1047, 962], [1036, 974], [1006, 976]], {
            rgb:'255,214,96', width:2.4, intensity:solI, speed:solSpd, cornerR:9, pulses:4, dotR:1.5
          });
        }

        /* 2. Corriente ÚNICAMENTE del Generador -> Baterías (velocidad según RPM, por dentro del cable blindado) */
        if(genVisible && running){
          const rpmR = genRpmStressRatio();
          const genI = clamp(0.50 + rpmR * 0.70, 0.50, 1.30);
          drawElectricFlow([[1006, 1922], [1062, 1914], [1088, 1890], [1088, 1750], [1084, 1500], [1084, 1100], [1078, 1076], [1054, 1052], [1008, 1046]], {
            rgb:'255,172,62', width:2.6, intensity:genI, speed:155, clock:genAnimClock, cornerR:10, pulses:6, dotR:1.6
          });
        }

        /* 3. Agua de lluvia entrando por el interior del tubo exterior izquierdo -> Tanque de agua sucia */
        if(rainIncoming){
          const isAcid = wid === 'acid';
          const isStorm = wid === 'storm';
          const rainSpd = isStorm ? 235 : 165;
          const rainRgb = isAcid ? '155,215,105' : '116,208,248';
          const rainHi = isAcid ? '218,248,176' : '222,248,255';
          ctx.save();
          for(let ri = 0; ri < 2; ri++){
            const rp = (animClock * 1.4 + ri * 0.5) % 1;
            ctx.strokeStyle = 'rgba(' + rainHi + ',' + ((1 - rp) * 0.55).toFixed(3) + ')';
            ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.ellipse(58, 492, 6 + rp * 11, 2.2 + rp * 3.2, 0, 0, 7); ctx.stroke();
          }
          ctx.restore();
          drawWaterFlow([[58, 508], [58, 1656], [230, 1656], [230, 1694]], {
            rgb:rainRgb, hiRgb:rainHi, width:5.4, intensity:isStorm ? 1.18 : 0.98, speed:rainSpd, cornerR:10, drops:9, dropR:1.6
          });
        }

        /* 4. Circuito de agua: Tanque agua sucia -> Bomba -> Filtros -> Tanque agua limpia */
        if(pumping){
          /* succión turbia por dentro del tubo del tanque sucio a la bomba */
          drawWaterFlow([[364, 1986], [414, 1986]], {
            rgb:'202,174,104', hiRgb:'238,218,162', width:5.0, intensity:1.0, speed:pumpSpd * 0.85, cornerR:6, drops:2, dropR:1.4
          });
          /* subida por dentro del tubo hacia el colector de los filtros */
          drawWaterFlow([[456, 1938], [456, 1750], [590, 1750]], {
            rgb:'178,168,128', hiRgb:'225,222,190', width:4.8, intensity:0.96, speed:pumpSpd * 0.9, cornerR:8, drops:3, dropR:1.4
          });
          /* circulación contenida estrictamente dentro de los dos cartuchos de filtro */
          ctx.save();
          const fPulse = 0.20 + Math.sin(animClock * 6) * 0.08;
          glowDot(530, 1824, 11, 'rgba(116,208,248,A)', fPulse);
          glowDot(590, 1824, 11, 'rgba(116,208,248,A)', fPulse);
          [530, 590].forEach((fx, fi)=>{
            for(let bi = 0; bi < 5; bi++){
              const bp = (animClock * 1.15 + fi * 0.37 + bi * 0.20) % 1;
              const by = 1864 - bp * 68;
              const bx = fx + Math.sin(animClock * 6 + bi * 2.1 + fi) * 3.8;
              ctx.fillStyle = bp < 0.35
                ? 'rgba(218,194,132,' + (0.68 * Math.sin(bp * Math.PI)).toFixed(3) + ')'
                : 'rgba(182,238,255,' + (0.82 * Math.sin(bp * Math.PI)).toFixed(3) + ')';
              ctx.beginPath(); ctx.arc(bx, by, 1.8 + (bi % 2) * 0.6, 0, 7); ctx.fill();
            }
          });
          ctx.restore();
          /* salida purificada por dentro de la tubería hacia el tanque de agua limpia */
          drawWaterFlow([[456, 1750], [456, 1580], [898, 1580], [898, 1530]], {
            rgb:'104,204,248', hiRgb:'225,248,255', width:5.2, intensity:1.05, speed:pumpSpd, cornerR:9, drops:7, dropR:1.6
          });
        }

        /* 5. Tanque de agua limpia -> Interior del tubo de riego hacia los cultivos */
        if(irrigActiveT > 0 && S.cropPlanted && S.growth < 100 && pow && S.clean > 0.2){
          drawWaterFlow([[754, 1304], [754, 1246], [586, 1246], [586, 1270]], {
            rgb:'116,208,248', hiRgb:'225,248,255', width:4.2, intensity:1.08, speed:145, cornerR:7, drops:5, dropR:1.3
          });
          drawWaterFlow([[586, 1246], [484, 1246]], {
            rgb:'116,208,248', hiRgb:'225,248,255', width:3.6, intensity:0.95, speed:120, cornerR:4, drops:3, dropR:1.2
          });
        }
      }

      /* ---- polvo flotante dentro del búnker ---- */
      ctx.fillStyle = 'rgba(227,224,210,.12)';
      const tt = t/1000;
      motes.forEach(m=>{ const x = 116 + ((m.x + tt*m.s*7) % 928); const y = 632 + ((m.y + Math.sin(tt*m.s + m.p)*9) % 1380); ctx.beginPath(); ctx.arc(x, y, 2.0, 0, 7); ctx.fill(); });

      /* ---- efecto visual térmico interior: partículas de frío si hace mucho frío y aún no calienta; efecto cálido solo si la calefacción trabaja bien ---- */
      {
        const thVis = thermalState(pow);
        const showHeat = thVis.heaterEffective;
        const showCold = !showHeat && S.bunkerTemp < 14;
        if(showCold){
          const coldA = clamp((14 - S.bunkerTemp) / 11, 0.15, 1);
          ctx.save();
          /* bruma fría orgánica por planta (sin cuadros ni bordes rectos) */
          LEVELS.forEach(rm=>{
            glowDot(rm.x + rm.w*0.5, rm.y + rm.h*0.52, rm.w*0.44, 'rgba(136,204,246,A)', coldA * 0.14);
          });
          /* partículas de frío / escarcha flotando dentro de las habitaciones */
          const activeCount = Math.max(8, Math.round(coldParticles.length * coldA));
          for(let ci = 0; ci < activeCount; ci++){
            const cp = coldParticles[ci];
            const rm = LEVELS[cp.floor];
            const px = rm.x + 22 + (((cp.x + tt * cp.s * 0.035 + Math.sin(tt * 0.9 + cp.phase) * 0.02) % 1 + 1) % 1) * (rm.w - 44);
            const py = rm.y + 18 + (((cp.y + tt * cp.s * 0.06) % 1 + 1) % 1) * (rm.h - 36);
            const edgeFade = Math.sin(clamp((py - rm.y) / rm.h, 0, 1) * Math.PI);
            const a = coldA * edgeFade * (0.42 + 0.30 * Math.sin(tt * 2.2 + cp.phase));
            if(a <= 0.02) continue;
            if(cp.flake){
              const r = cp.r * 1.45;
              ctx.strokeStyle = 'rgba(204,238,255,' + a.toFixed(3) + ')';
              ctx.lineWidth = 1.15;
              ctx.beginPath();
              ctx.moveTo(px - r, py); ctx.lineTo(px + r, py);
              ctx.moveTo(px, py - r); ctx.lineTo(px, py + r);
              ctx.moveTo(px - r*0.65, py - r*0.65); ctx.lineTo(px + r*0.65, py + r*0.65);
              ctx.moveTo(px + r*0.65, py - r*0.65); ctx.lineTo(px - r*0.65, py + r*0.65);
              ctx.stroke();
            } else {
              ctx.fillStyle = 'rgba(182,228,255,' + (a * 0.85).toFixed(3) + ')';
              ctx.beginPath(); ctx.arc(px, py, cp.r, 0, 7); ctx.fill();
            }
          }
          ctx.restore();
        }
        if(showHeat){
          const hp = 0.16 + Math.sin(t/360) * 0.04;
          ctx.save();
          LEVELS.forEach(rm=>{
            glowDot(rm.x + rm.w*0.33, rm.y + 42, 74, 'rgba(255,146,68,A)', hp);
            glowDot(rm.x + rm.w*0.68, rm.y + rm.h - 32, 62, 'rgba(255,134,58,A)', hp * 0.8);
          });
          /* corrientes ascendentes cálidas cuando la calefacción está funcionando bien */
          heatParticles.forEach(hpObj=>{
            const rm = LEVELS[hpObj.floor];
            const prog = (((hpObj.y - tt * hpObj.s * 0.14) % 1) + 1) % 1;
            const px = rm.x + 28 + hpObj.x * (rm.w - 56) + Math.sin(tt * 2.4 + hpObj.phase) * 9;
            const py = rm.y + 20 + prog * (rm.h - 38);
            const a = Math.sin(prog * Math.PI) * 0.36;
            if(a <= 0.02) return;
            ctx.fillStyle = 'rgba(255,176,92,' + a.toFixed(3) + ')';
            ctx.beginPath(); ctx.arc(px, py, hpObj.r, 0, 7); ctx.fill();
          });
          ctx.restore();
        }
      }

      /* ---- ABANDONO (partida nueva, hasta terminar el tutorial) ---- */
      if(!S.tutDone){
        const dg = ctx.createLinearGradient(0, 626, 0, 2020);
        dg.addColorStop(0, 'rgba(148,134,102,.13)'); dg.addColorStop(1, 'rgba(120,106,78,.07)');
        ctx.fillStyle = dg; ctx.fillRect(108, 626, 944, 1394);
        LEVELS.forEach((rm, fi)=>{
          webCorner(rm.x + 8, rm.y + 10, 96, 1, 1, fi*1.7);
          webCorner(rm.x + rm.w - 8, rm.y + 10, 88, -1, 1, fi*2.3 + 1);
          if(fi % 2 === 0) webCorner(rm.x + 8, rm.y + rm.h - 6, 76, 1, -1, fi*3.1 + 2);
        });
        if(S.cobGen) webPatch(870, 1922, 86, 3.7);
        if(S.cobFan){ webPatch(922, 1712, 72, 8.2); webPatch(216, 782, 52, 6.5); }
        webPatch(225, 978, 84, 2.9);
        webPatch(560, 938, 58, 9.3);
        webPatch(927, 972, 78, 1.2);
        webPatch(277, 1362, 86, 6.4);
        webPatch(883, 1370, 82, 7.8);
        webPatch(254, 1850, 82, 4.6);
        webPatch(470, 1964, 64, 5.9);
      }

      /* ---- marcadores táctiles (ocultos dentro del Editor Admin) ---- */
      if(!editor.active){
        const pulse = 0.16 + Math.sin(t/600)*0.08;
        LAYOUT.elements.forEach(z=>{
          if(!z.visible || z.marker === false || !z.action || z.action === 'none') return;
          const cx = z.x + z.w/2, cy = z.y + z.h/2;
          ctx.strokeStyle = 'rgba(255,216,115,' + pulse + ')'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(cx, cy, 15 + Math.sin(t/600)*3, 0, 7); ctx.stroke();
          ctx.fillStyle = 'rgba(255,216,115,' + (pulse + 0.12) + ')';
          ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, 7); ctx.fill();
        });
        if(tapped && performance.now() - tappedT < 400){
          const k = (performance.now() - tappedT)/400;
          const cx = tapped.x + tapped.w/2, cy = tapped.y + tapped.h/2;
          ctx.strokeStyle = 'rgba(255,216,115,' + (0.8*(1 - k)) + ')'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(cx, cy, 16 + k*54, 0, 7); ctx.stroke();
          glowDot(cx, cy, 30, 'rgba(255,216,115,A)', 0.25*(1 - k));
        }
        if(TUT.active && TUT.phase === 'steps'){
          const stp = TUT_STEPS[TUT.step];
          if(stp && stp.zone){
            const z = getElement(stp.zone);
            if(z){
              const cx = z.x + z.w/2, cy = z.y + z.h/2;
              const rr = Math.max(z.w, z.h)/2 + 16;
              ctx.strokeStyle = 'rgba(232,163,61,' + (0.55 + Math.sin(t/300)*0.3) + ')'; ctx.lineWidth = 6;
              ctx.beginPath(); ctx.arc(cx, cy, rr + Math.sin(t/300)*5, 0, 7); ctx.stroke();
              const k = (t % 1400)/1400;
              ctx.strokeStyle = 'rgba(255,216,115,' + (0.5*(1 - k)) + ')'; ctx.lineWidth = 3.5;
              ctx.beginPath(); ctx.arc(cx, cy, rr + k*46, 0, 7); ctx.stroke();
              glowDot(cx, cy, rr*0.9, 'rgba(232,163,61,A)', .10 + Math.sin(t/300)*0.04);
            }
          }
        }
      }

      /* viñeta de radiación y puntos interactivos de búsqueda en la superficie durante la exploración */
      if(S.exped){
        const g = ctx.createRadialGradient(584, 1050, 350, 584, 1050, 1350);
        g.addColorStop(0, 'rgba(90,140,40,0)'); g.addColorStop(1, 'rgba(90,140,40,' + (0.10 + S.expo/100*0.28) + ')');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

        if(Array.isArray(S.exped.nodes)){
          const activeCr = getActiveCrisis();
          const needPart = !!(activeCr && totalGenPartCount(activeCr.partId) <= 0);
          S.exped.nodes.forEach(nd => {
            ctx.save();
            const pulseR = nd.r + Math.sin(t / 240 + nd.id) * 5;
            if(!nd.searched){
              glowDot(nd.x, nd.y, 48, needPart ? 'rgba(232,163,61,A)' : 'rgba(127,176,105,A)', 0.42);
              ctx.strokeStyle = needPart ? '#ffbe55' : '#8fd175';
              ctx.lineWidth = 3;
              ctx.beginPath(); ctx.arc(nd.x, nd.y, pulseR, 0, Math.PI * 2); ctx.stroke();
            }
            ctx.fillStyle = nd.searched ? 'rgba(14,16,14,.68)' : 'rgba(16,20,16,.92)';
            ctx.strokeStyle = nd.searched ? '#3e453c' : (needPart ? '#e8a33d' : '#7fb069');
            ctx.lineWidth = 2.2;
            rrPath(nd.x - 62, nd.y - 24, 124, 48, 10);
            ctx.fill(); ctx.stroke();

            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(nd.icon + ' ' + nd.name, nd.x, nd.y - 6);
            ctx.font = '600 10.5px "IBM Plex Mono", monospace';
            ctx.fillStyle = nd.searched ? '#6c7369' : (needPart ? '#ffbe55' : '#8fd175');
            ctx.fillText(nd.searched ? '✓ REGISTRADO' : (needPart ? '🔧 BUSCAR PIEZA' : '🎒 REBUSCAR'), nd.x, nd.y + 11);
            ctx.restore();
          });
        }
      }

      /* Gizmos y rejilla del Editor Admin */
      if(editor.active && editor.drawOverlay){
        editor.drawOverlay(ctx);
      }
    }

    function canvasPos(e){
      const r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left - view.ox) / view.s, y: (e.clientY - r.top - view.oy) / view.s };
    }
    /* tocar = usar un equipo · mantener presionado (admin) = editar · arrastrar = recorrer el búnker */
    const drag = { down:false, moved:false, pointerId:null, sx:0, sy:0, lx:0, ly:0, holdTimer:null, heldOpened:false };
    function clearHoldTimer(){
      if(drag.holdTimer){ clearTimeout(drag.holdTimer); drag.holdTimer = null; }
    }
    function findTopElementAt(px, py, pad){
      const els = LAYOUT.elements;
      for(let i = els.length - 1; i >= 0; i--){
        const z = els[i];
        if(!z.visible) continue;
        if(elementHitTest(z, px, py)) return z;
      }
      if(pad > 0){
        for(let i = els.length - 1; i >= 0; i--){
          const z = els[i];
          if(!z.visible) continue;
          if(px >= z.x - pad && px <= z.x + z.w + pad && py >= z.y - pad && py <= z.y + z.h + pad) return z;
        }
      }
      return null;
    }
    cv.addEventListener('pointerdown', e=>{
      if(editor.active && editor.onPointerDown){
        try{ cv.setPointerCapture(e.pointerId); }catch(err){}
        editor.onPointerDown(e);
        return;
      }
      if(drag.down && drag.pointerId !== null && drag.pointerId !== e.pointerId) return;
      clearHoldTimer();
      drag.down = true; drag.moved = false; drag.heldOpened = false; drag.pointerId = e.pointerId;
      drag.sx = drag.lx = e.clientX; drag.sy = drag.ly = e.clientY;
      if(S.started && !S.over) audio();
      if(S.started && !S.over && isAdmin()){
        const p = canvasPos(e);
        const pad = e.pointerType !== 'mouse' ? Math.max(12, 18 / Math.max(0.3, view.s)) : 0;
        const hitEl = findTopElementAt(p.x, p.y, pad);
        if(hitEl){
          drag.holdTimer = setTimeout(()=>{
            drag.holdTimer = null;
            if(!drag.down || drag.moved || editor.active || !S.started || S.over) return;
            drag.down = false; drag.moved = false; drag.heldOpened = true; drag.pointerId = null;

    cv.addEventListener('pointermove', e=>{
      if(editor.active && editor.onPointerMove){
        editor.onPointerMove(e);
        return;
      }
      if(drag.down){
        if(drag.pointerId !== null && e.pointerId !== drag.pointerId) return;
        const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
        drag.lx = e.clientX; drag.ly = e.clientY;
        const dragThresh = e.pointerType !== 'mouse' ? 22 : 10;
        if(Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > dragThresh){
          drag.moved = true;
          clearHoldTimer();
        }
        if(drag.moved && effView() === 'cover'){ pan.x += dx; pan.y += dy; computeView(); }
        return;
      }
      if(!S.started){ cv.style.cursor = ''; return; }
      const p = canvasPos(e);
      const els = LAYOUT.elements;
      let hit = false;
      for(let i = els.length - 1; i >= 0; i--){
        const z = els[i];
        if(z.visible && z.action && z.action !== 'none' && elementHitTest(z, p.x, p.y)){ hit = true; break; }
      }
      cv.style.cursor = hit ? 'pointer' : '';
    });
    function findTopInteractiveAt(px, py, pad){
      const els = LAYOUT.elements;
      for(let i = els.length - 1; i >= 0; i--){
        const z = els[i];
        if(z.visible && z.action && z.action !== 'none' && elementHitTest(z, px, py)) return z;
      }
      if(pad > 0){
        for(let i = els.length - 1; i >= 0; i--){
          const z = els[i];
          if(z.visible && z.action && z.action !== 'none' &&
             px >= z.x - pad && px <= z.x + z.w + pad && py >= z.y - pad && py <= z.y + z.h + pad) return z;
        }
      }
      return null;
    }
    function endPointer(e){

        editor.onPointerUp(e);

      if(drag.pointerId !== null && e.pointerId !== drag.pointerId) return;
      clearHoldTimer();
      const wasDrag = drag.moved;
      const wasHeld = drag.heldOpened;
      drag.down = false; drag.moved = false; drag.heldOpened = false; drag.pointerId = null;
      if(wasDrag || wasHeld || !S.started || S.over) return;

      return 'M ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);

    /* Física realista de las agujas analógicas (resorte amortiguado + vibración + carga + chapoteo) */
    const genDialPhys = {
      init: false,
      prevRun: false,
      prevLoadW: 0,
      prevFuel: 60,
      rpm: 0, rpmVel: 0,
      temp: 28, tempVel: 0,
      fuel: 60, fuelVel: 0,
      rpmDeg: -125, tempDeg: -105, fuelDeg: 25,
      canvasFuelDeg: 25, canvasFuelVel: 0,
      phase: 0
    };
    function stepGenDialPhysics(realDt){
      const dt = clamp(realDt || 0.016, 0.004, 0.05);
      const genRun = !!(S.genOn && !S.genStalled && !S.genFault && S.fuel > 0);
      const rpmSet = clamp(S.genRpm || GEN_RPM_NOM, GEN_RPM_MIN, GEN_RPM_MAX);
      const demW = demandBreakdown().total;
      if(!genDialPhys.init){
        genDialPhys.init = true;
        genDialPhys.prevRun = genRun;
        genDialPhys.prevLoadW = demW;
        genDialPhys.prevFuel = S.fuel;
        genDialPhys.rpm = genRun ? rpmSet : 0;
        genDialPhys.temp = S.genTemp;
        genDialPhys.fuel = S.fuel;
        genDialPhys.canvasFuelDeg = -125 + clamp(S.fuel / 100, 0, 1) * 250;
      }
      genDialPhys.phase += dt;
      const p = genDialPhys.phase;

      /* Golpe de arranque (sobreimpulso al encender) y caída de carga al conectar equipos */
      if(genRun && !genDialPhys.prevRun){
        genDialPhys.rpmVel += 5200;
        genDialPhys.tempVel += 28;
        genDialPhys.fuelVel += 18;
        genDialPhys.canvasFuelVel += 45;
      } else if(!genRun && genDialPhys.prevRun){
        genDialPhys.rpmVel -= 1400;
      }
      if(genRun && Math.abs(demW - genDialPhys.prevLoadW) > 0.25){
        genDialPhys.rpmVel -= (demW - genDialPhys.prevLoadW) * 580;
      }
      if(S.fuel - genDialPhys.prevFuel > 5){
        genDialPhys.fuelVel += 140;
        genDialPhys.canvasFuelVel += 260;
      }
      genDialPhys.prevRun = genRun;
      genDialPhys.prevLoadW = demW;
      genDialPhys.prevFuel = S.fuel;

      /* Oscilación natural del gobernador del motor + temblor por desgaste/aceite bajo */
      const wearJitter = 1 + (S.cond < 55 ? (55 - S.cond) * 0.04 : 0) + (S.oil < 35 ? (35 - S.oil) * 0.04 : 0);
      const loadSag = genRun ? Math.min(95, demW * 16) : 0;
      const rpmHunt = genRun
        ? (Math.sin(p * 6.7) * 24 + Math.sin(p * 17.3) * 14 + Math.cos(p * 33.1) * 9) * wearJitter
        : 0;
      const rpmTarget = genRun ? clamp(rpmSet - loadSag * 0.35 + rpmHunt, 450, 4480) : 0;
      const rpmK = genRun ? 48 : 16;
      const rpmD = genRun ? 7.4 : 5.2;
      genDialPhys.rpmVel += ((rpmTarget - genDialPhys.rpm) * rpmK - genDialPhys.rpmVel * rpmD) * dt;
      genDialPhys.rpm = clamp(genDialPhys.rpm + genDialPhys.rpmVel * dt, 0, 4500);

      /* Aguja de temperatura con leve vibración mecánica cuando el motor corre */
      const tempTarget = S.genTemp;
      genDialPhys.tempVel += ((tempTarget - genDialPhys.temp) * 32 - genDialPhys.tempVel * 8.2) * dt;
      genDialPhys.temp = clamp(genDialPhys.temp + genDialPhys.tempVel * dt, 15, 130);

      /* Aguja de gasolina con chapoteo del tanque cuando el generador vibra */
      const slosh = genRun ? (Math.sin(p * 2.3) * 0.95 + Math.sin(p * 5.9) * 0.45) : 0;
      const fuelTarget = clamp(S.fuel + slosh, 0, 100);
      genDialPhys.fuelVel += ((fuelTarget - genDialPhys.fuel) * 26 - genDialPhys.fuelVel * 6.4) * dt;
      genDialPhys.fuel = clamp(genDialPhys.fuel + genDialPhys.fuelVel * dt, 0, 100);

      /* Micro-vibración de alta frecuencia sobre los ejes de las agujas */
      const vibAmp = genRun ? (0.45 + (genDialPhys.rpm / GEN_RPM_NOM) * 0.72) : 0;
      const vibRpm  = vibAmp * (Math.sin(p * 47.0) * 0.75 + Math.sin(p * 79.0) * 0.35);
      const vibTemp = vibAmp * 0.48 * Math.sin(p * 43.0 + 1.1);
      const vibFuel = vibAmp * 0.62 * Math.sin(p * 39.0 + 2.4);

      genDialPhys.rpmDeg  = clamp(-125 + (genDialPhys.rpm / 4500) * 250 + vibRpm, -127, 127);
      genDialPhys.tempDeg = clamp(-125 + ((genDialPhys.temp - 20) / 100) * 250 + vibTemp, -127, 127);
      genDialPhys.fuelDeg = clamp(-125 + (genDialPhys.fuel / 100) * 250 + vibFuel, -127, 127);

      /* Aguja del manómetro de gasolina en el búnker (canvas) */
      const cFuelTgt = -125 + clamp((S.fuel + slosh * 1.15) / 100, 0, 1) * 250 + vibFuel * 1.1;
      genDialPhys.canvasFuelVel += ((cFuelTgt - genDialPhys.canvasFuelDeg) * 34 - genDialPhys.canvasFuelVel * 7.0) * dt;
      genDialPhys.canvasFuelDeg = clamp(genDialPhys.canvasFuelDeg + genDialPhys.canvasFuelVel * dt, -128, 128);
    }
    function updateGenLiveDials(needlesOnly){
      const genRun = !!(S.genOn && !S.genStalled && !S.genFault && S.fuel > 0);
      const rpmSet = clamp(S.genRpm || GEN_RPM_NOM, GEN_RPM_MIN, GEN_RPM_MAX);
      const rpmSetDeg = -125 + clamp(rpmSet / 4500, 0, 1) * 250;
      const nt = $('gn-temp'), nr = $('gn-rpm'), nrs = $('gn-rpm-set'), nf = $('gn-fuel');
      if(nt) nt.style.transform = 'rotate(' + genDialPhys.tempDeg.toFixed(2) + 'deg)';
      if(nr) nr.style.transform = 'rotate(' + genDialPhys.rpmDeg.toFixed(2) + 'deg)';
      if(nrs) nrs.style.transform = 'rotate(' + rpmSetDeg.toFixed(1) + 'deg)';
      if(nf) nf.style.transform = 'rotate(' + genDialPhys.fuelDeg.toFixed(2) + 'deg)';
      const vr = $('gv-rpm');
      if(vr){
        const liveShown = Math.round(genDialPhys.rpm);
        vr.textContent = genRun ? (liveShown + ' rpm') : (liveShown > 80 ? (liveShown + ' rpm ↓') : ('Obj. ' + rpmSet));
        vr.className = 'gauge-val' + (rpmSet >= 4000 ? ' crit' : rpmSet >= 3500 ? ' warn' : '');
      }
      const vk = $('gv-kva'), vks = $('gv-kva-sub');
      const liveKva = genRun ? genKvaForRpm(genDialPhys.rpm) : (genDialPhys.rpm > 80 ? genKvaForRpm(genDialPhys.rpm) : 0);
      const tgtKva = genKvaForRpm(rpmSet);
      if(vk){
        vk.textContent = liveKva.toFixed(2) + ' kVA';
        vk.className = 'rust-kva-val' + (!genRun && liveKva < 0.05 ? ' off' : (rpmSet >= 3500 ? ' high' : ''));
      }
      if(vks){
        const outW = GEN_OUT[S.levels?.gen || 1] * genRpmFactorAt(rpmSet);
        vks.textContent = rpmSet + ' rpm → ' + tgtKva.toFixed(2) + ' kVA (' + outW.toFixed(2) + ' W/s)';
      }
      if(needlesOnly) return;
      const vt = $('gv-temp'), vf = $('gv-fuel');
      if(vt){ vt.textContent = Math.round(S.genTemp) + ' °C'; vt.className = 'gauge-val' + (S.genTemp >= 96 ? ' crit' : S.genTemp >= 85 ? ' warn' : ''); }
      const bDn = $('gv-rpm-down'), bUp = $('gv-rpm-up');
      if(bDn) bDn.classList.toggle('lim', rpmSet <= GEN_RPM_MIN);
      if(bUp) bUp.classList.toggle('lim', rpmSet >= GEN_RPM_MAX);
      const vo = $('gv-oil'), vof = $('gv-oil-fill');
      const oilCls = S.oil < 22 ? 'crit' : S.oil < 42 ? 'warn' : '';
      if(vo){ vo.textContent = Math.round(S.oil) + '%'; vo.className = 'rust-oil-val' + (oilCls ? ' ' + oilCls : ''); }
      if(vof){ vof.style.width = clamp(S.oil, 0, 100).toFixed(1) + '%'; vof.className = oilCls; }
      if(vf){ vf.textContent = (S.fuel * 0.1).toFixed(1) + ' L'; vf.className = 'gauge-val' + (S.fuel < 18 ? ' crit' : S.fuel < 38 ? ' warn' : ''); }
      const vh = $('gv-hours'), hm = $('gv-hm');
      if(vh) vh.textContent = fmtRunHours(S.genTotalHours);
      if(hm) hm.classList.toggle('run', genRun);
      const hn = $('gv-heat-note'), hv = $('gv-heat-val');
      if(hn && hv){
        const hw = heatingDemandW();
        const isCrit = S.bunkerTemp < 12 || (hw > 0 && (!genRun || netPower() < -0.05));
        hn.className = 'rust-heat-note' + (isCrit ? ' crit' : '');
        hv.textContent = Math.round(S.bunkerTemp) + '°C · ' + (S.heaterOn === false ? 'Apagada' : (hw > 0 ? '+' + hw.toFixed(2) + ' W/s' : 'OK'));
      }
      const ce = $('gn-check-lamp');
      if(ce){
        const faultObj = S.genFault ? GEN_FAULTS[S.genFault] : null;
        const warn = !faultObj && (S.oil < 24 || S.genTemp >= 95 || S.fuel < 15);
        const gearSpin = !faultObj && performance.now() < genCheckSpinUntil;
        ce.className = 'check-eng-lamp' + (gearSpin ? ' gear-repaired' : (faultObj ? ' fault' : (warn ? ' warn' : '')));
        ce.title = gearSpin ? 'Pieza instalada · Sistema reparado' : (faultObj ? faultObj.label : (warn ? 'Revisar generador' : 'Check Engine normal'));
      }
    }

          h += '<div class="bar-row"><span>' + curCrop.name + '</span><div class="bar ' + (ready ? '' : 'blue') + '"><i id="eq-crop-bar-fill" style="width:' + clamp(S.growth, 0, 100) + '%"></i></div><span class="num" id="eq-crop-bar-num">' + Math.round(S.growth) + '%</span></div>';
          if(pauseType){
            const pMsg = pauseType === 'uv' ? 'Pausado: lámpara UV fundida' : pauseType === 'pow' ? 'Pausado: falta energía' : pauseType === 'water' ? 'Pausado: falta agua limpia' : pauseType === 'cold' ? 'Pausado: frío extremo (< 4°C)' : 'Juego en pausa';
            h += '<div class="eq-mini-info"><span style="color:var(--amber)">' + pMsg + '</span><b id="eq-crop-water">' + (pauseType === 'cold' ? Math.round(S.bunkerTemp) + ' °C' : Math.floor(S.clean) + ' L') + '</b></div>';

        h += '<div class="eq-mini-info" style="flex-direction:column; align-items:stretch; gap:7px">' +
          '<div style="display:flex; justify-content:space-between; align-items:center; gap:8px">' +
