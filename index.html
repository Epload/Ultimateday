          '</div>' +
          '<div style="font-size:11px; color:var(--mut)">' + (autoOn ? 'Riega solo cada ciclo para acelerar el cultivo (+36%).' : 'Solo consume agua mínima y riegas manualmente cuando decidas.') + '</div>' +
          '<div class="eq-acts" style="margin-top:0">' +
          '<button type="button" class="abtn ' + (autoOn ? 'primary' : '') + '" data-eq="hydro-auto-on">Sí, automático</button>' +
          '<button type="button" class="abtn ' + (!autoOn ? 'primary' : '') + '" data-eq="hydro-auto-off">No, guardar agua</button>' +
          '</div></div>';

        h += '<div class="eq-crop-grid">';
        CROP_LIST.forEach(c => {
          const minsReal = (c.minutes / hydroMult).toFixed(1).replace(/\.0$/, '');
          const isSel = curCrop && curCrop.id === c.id;
          h += '<button type="button" class="eq-crop ' + (isSel ? 'sel' : '') + '" data-eq="plant-' + c.id + '"' + (planted && !isSel ? ' disabled' : '') + '>' +
            '<b>' + c.icon + ' ' + c.name + '</b>' +
            '<span class="tm">' + minsReal + ' min · +' + (c.yield + Math.max(0, S.levels.hydro - 1)) + ' rac.</span>' +
            '</button>';
        });
        h += '</div>';

        h += '<div class="eq-acts">';
        if(uvFault){
          if(haveUvPart > 0) h += '<button type="button" class="abtn primary" data-eq="sys-fix">🔧 Instalar Tubo UV de cultivo</button>';
          else h += '<button type="button" class="abtn primary" data-eq="gen-go-scavenge">🎒 Salir al yermo a buscar Tubo UV</button>';
        }
        if(ready){
          h += '<button type="button" class="abtn primary" data-eq="harvest">Cosechar <span class="cost">+' + (curCrop.yield + Math.max(0, S.levels.hydro - 1)) + '</span></button>';
        }
        if(planted && !ready){
          h += '<button type="button" class="abtn" data-eq="clean-plants"' + (canManualWater ? '' : ' disabled') + '>Regar ahora <span class="cost">1 L · +4%</span></button>';
          h += '<button type="button" class="abtn" data-eq="clear-crop">Cambiar siembra</button>';
        }
        h += '</div>';

        equipCardEl.innerHTML = h;
        equipCardEl.scrollTop = prevScroll;
        return;
      }

      if(activeEquip === 'clean'){
        const planted = !!(S.cropPlanted && S.cropType);
        const curCrop = planted ? (CROPS[S.cropType] || CROPS.tomato) : null;
        const ready = !!(curCrop && S.growth >= 100);
        const canDrink = S.clean >= 1 && S.thirst < 98;
        const canWater = !curCrop || ready || (pow && S.clean >= 1);
        const pct = clamp(S.clean / CLEAN_CAP * 100, 0, 100);
        const numTxt = Math.floor(S.clean) + ' / ' + CLEAN_CAP + ' L';
        const plantSub = (curCrop && !ready) ? ('Regar ' + curCrop.name + ' · 1 L') : (ready ? 'Cosecha lista' : 'Ir a sembrar');
        const drinkSub = S.thirst >= 98 ? 'Sin sed' : '1 L · +20% sed';
        const sig = ['clean', curCrop ? curCrop.id : '', ready ? 1 : 0, canDrink ? 1 : 0, canWater ? 1 : 0].join('|');

        if(equipCardEl.dataset.rendered === sig){
          const barEl = $('eq-clean-bar'), numEl = $('eq-clean-num'), psEl = $('eq-clean-psub'), dsEl = $('eq-clean-dsub');
          if(barEl) barEl.style.width = pct.toFixed(1) + '%';
          if(numEl) numEl.textContent = numTxt;
          if(psEl) psEl.textContent = plantSub;
          if(dsEl) dsEl.textContent = drinkSub;
          return;
        }
        equipCardEl.dataset.rendered = sig;

        let h = '<div class="equip-head"><div><h2>Agua limpia</h2>' +
          '<p class="sub">Reserva purificada para riego y consumo</p></div>' +
          '<button type="button" class="x" data-eq="close" aria-label="Cerrar">✕</button></div>';

        h += '<div class="bar-row"><span>Nivel</span><div class="bar blue"><i id="eq-clean-bar" style="width:' + pct.toFixed(1) + '%"></i></div><span class="num" id="eq-clean-num">' + numTxt + '</span></div>';

        h += '<div class="eq-acts">' +
          '<button type="button" class="abtn" data-eq="clean-plants"' + (canWater ? '' : ' disabled') + '>Plantas <span class="cost" id="eq-clean-psub">' + plantSub + '</span></button>' +
          '<button type="button" class="abtn primary" data-eq="clean-drink"' + (canDrink ? '' : ' disabled') + '>Tomar agua <span class="cost" id="eq-clean-dsub">' + drinkSub + '</span></button>' +
          '</div>';

        equipCardEl.innerHTML = h;
        equipCardEl.scrollTop = prevScroll;
        return;
      }

      if(activeEquip === 'dirty'){
        const widW = S.weather.id;
        const raining = widW === 'rain' || widW === 'storm' || widW === 'acid';
        const pumpBroken = S.sysFault === 'pump_valve';
        const havePumpPart = pumpBroken ? totalGenPartCount('pump_valve') : 0;
        const pct = clamp(S.dirty / 80 * 100, 0, 100);
        const numTxt = Math.floor(S.dirty) + ' / 80 L';
        const cleanTxt = Math.floor(S.clean) + ' / ' + CLEAN_CAP + ' L';
        const subTxt = raining ? 'Llenándose con la lluvia por el tubo exterior' : 'Se llena por el tubo exterior cuando llueve';
        const pumpStateTxt = pumpBroken ? 'Válvula rota' : (!pow ? 'Sin energía' : S.dirty <= 0 ? 'Tanque vacío' : S.clean >= CLEAN_CAP ? 'Agua limpia llena' : 'Limpiando…');
        const sig = ['dirty', S.pumpOn ? 1 : 0, pow ? 1 : 0, S.dirty > 0 ? 1 : 0, S.clean < CLEAN_CAP ? 1 : 0, raining ? 1 : 0, pumpBroken ? 1 : 0, havePumpPart].join('|');

        if(equipCardEl.dataset.rendered === sig){
          const barEl = $('eq-dirty-bar'), numEl = $('eq-dirty-num'), cEl = $('eq-dirty-clean'), sEl = $('eq-dirty-sub');
          if(barEl) barEl.style.width = pct.toFixed(1) + '%';
          if(numEl) numEl.textContent = numTxt;
          if(cEl) cEl.textContent = cleanTxt;
          if(sEl) sEl.textContent = subTxt;
          return;
        }
        equipCardEl.dataset.rendered = sig;

        let h = '<div class="equip-head"><div><h2>Agua sucia</h2>' +
          '<p class="sub" id="eq-dirty-sub">' + subTxt + '</p></div>' +
          '<button type="button" class="x" data-eq="close" aria-label="Cerrar">✕</button></div>';

        if(pumpBroken){
          h += '<div class="bag-crisis ' + (havePumpPart > 0 ? 'ok' : '') + '">' +
            '<b>⚠️ Bomba de agua averiada:</b> La válvula de presión reventó y no purifica agua.' +
            '<div style="margin-top:4px;font-weight:600">' +
            (havePumpPart > 0 ? '✅ Tienes 🚰 Válvula de bomba de agua lista para instalar.' : '❌ Sal al yermo con tu mochila a buscar 🚰 Válvula de bomba de agua.') +
            '</div></div>';
        }

        h += '<div class="bar-row"><span>Sin tratar</span><div class="bar amberb"><i id="eq-dirty-bar" style="width:' + pct.toFixed(1) + '%"></i></div><span class="num" id="eq-dirty-num">' + numTxt + '</span></div>';
        h += '<div class="eq-mini-info"><span>Tanque de agua limpia</span><b id="eq-dirty-clean">' + cleanTxt + '</b></div>';

        h += '<div class="eq-acts">';
        if(pumpBroken){
          if(havePumpPart > 0) h += '<button type="button" class="abtn primary" data-eq="sys-fix">🔧 Instalar Válvula de bomba</button>';
          else h += '<button type="button" class="abtn primary" data-eq="gen-go-scavenge">🎒 Salir al yermo a buscar Válvula</button>';
        } else {
          h += '<button type="button" class="abtn ' + (S.pumpOn ? '' : 'primary') + '" data-eq="dirty-pump">' +
            (S.pumpOn ? 'Apagar bomba <span class="cost">' + pumpStateTxt + '</span>' : 'Encender bomba para limpiar <span class="cost">Pasar al agua limpia</span>') +
            '</button>';
        }
        h += '</div>';

        equipCardEl.innerHTML = h;
        equipCardEl.scrollTop = prevScroll;
        return;
      }

      equipCardEl.dataset.rendered = '';
      equipCardEl.innerHTML = '';
    }
    equipModalEl.addEventListener('pointerdown', e=>{
      equipHadPointerDown = true;
      equipDownOnBackdrop = (e.target === equipModalEl);
    });
    equipModalEl.addEventListener('pointercancel', ()=>{ equipDownOnBackdrop = false; });
    equipModalEl.addEventListener('click', e=>{
      if(!equipHadPointerDown && (e.detail > 0 || performance.now() - equipOpenedAt < 450)){
        e.preventDefault(); e.stopPropagation();
        return;
      }
      if(e.target === equipModalEl){
        const allowBackdropClose = equipDownOnBackdrop;
        equipDownOnBackdrop = false;
        if(allowBackdropClose) closeEquipModal();
        return;
      }
      equipDownOnBackdrop = false;
      const b = e.target.closest('[data-eq]');
      if(!b || b.disabled) return;
      audio();
      const act = b.dataset.eq;
      if(act === 'close') closeEquipModal();
      else if(act === 'gen-key') actGenToggle();
      else if(act === 'gen-rpm-tap') actGenRpm('cycle');
      else if(act === 'gen-rpm-down') actGenRpm(-1);
      else if(act === 'gen-rpm-up') actGenRpm(1);
      else if(act === 'gen-fuel') actRefuel();
      else if(act === 'gen-oil') actRefillOil();
      else if(act === 'gen-cool') actCoolGen();
      else if(act === 'gen-fix') actRepairGenFault(false);
      else if(act === 'gen-fix-emerg') actRepairGenFault(true);
      else if(act === 'sys-fix') actRepairActiveCrisis(false);
      else if(act === 'gen-go-scavenge'){ closeEquipModal(); startExped(); }
      else if(act === 'gen-maint') actRepairGen();
      else if(act === 'solar-install') actInstallSolar();
      else if(act === 'solar-fix') actRepairSolarFault();
      else if(act === 'solar-clean') actCleanSolar();
      else if(act === 'harvest') actHarvest();
      else if(act === 'hydro-auto-on') actSetAutoIrrig(true);
      else if(act === 'hydro-auto-off') actSetAutoIrrig(false);
      else if(act === 'clear-crop') actClearCrop();
      else if(act.indexOf('plant-') === 0) actPlantCrop(act.slice(6));
      else if(act === 'clean-plants') actWaterPlants();
      else if(act === 'clean-drink') actDrink();
      else if(act === 'dirty-pump') actDirtyPumpToggle();
    });

    /* ================= DOCK Y PANELES ================= */
    let activeSheet = null;
    let sheetOpenedAt = 0;
    let sheetHadPointerDown = true;
    let logoutArm = false;   // confirmación en dos toques del botón Salir (panel de Control)
    const sheetEl = $('sheet');
    function openSheet(name, fromCanvas){
      if(activeSheet === name){ closeSheet(); return; }
      closeEquipModal();
      activeSheet = name;
      sheetOpenedAt = performance.now();
      sheetHadPointerDown = !fromCanvas;
      sheetEl.hidden = false;
      document.querySelectorAll('.dbtn[data-panel]').forEach(b=> b.classList.toggle('on', b.dataset.panel === name));
      if($('top-wx-btn')) $('top-wx-btn').classList.toggle('on', name === 'clima');
      renderSheet();
      sfx.click();
    }
    function closeSheet(){
      activeSheet = null;
      sheetOpenedAt = 0;
      sheetHadPointerDown = true;
      logoutArm = false;
      sheetEl.hidden = true;
      document.querySelectorAll('.dbtn[data-panel]').forEach(b=> b.classList.remove('on'));
      if($('top-wx-btn')) $('top-wx-btn').classList.remove('on');
    }
    function refreshSheet(){ if(activeSheet) renderSheet(); updateDock(); }
    document.querySelectorAll('.dbtn[data-panel]').forEach(b=> b.addEventListener('click', ()=>{ audio(); openSheet(b.dataset.panel); }));
    $('top-wx-btn').addEventListener('click', ()=>{ audio(); openSheet('clima'); });

    function barRow(label, v, numTxt, cls, inv){
      const shown = inv ? 100 - v : v;
      const c = shown < 22 ? 'crit' : shown < 45 ? 'warn' : '';
      return '<div class="bar-row"><span>' + label + '</span><div class="bar ' + (cls||'') + '"><i class="' + c + '" style="width:' + clamp(v,0,100) + '%"></i></div><span class="num">' + numTxt + '</span></div>';
    }
    function statRow(label, sub, v, numTxt, cls){
      const c = v < 22 ? 'crit' : v < 45 ? 'warn' : '';
      return '<div class="stat-row"><span class="lbl">' + label + '<small>' + sub + '</small></span><div class="bar big ' + cls + '"><i class="' + c + '" style="width:' + clamp(v,0,100) + '%"></i></div><span class="num">' + numTxt + '</span></div>';
    }
    function switchRow(label, sub, on, fnName, dis){
      return '<div class="sw-row"><div class="lbl">' + label + '<small>' + sub + '</small></div>' +
        '<button type="button" class="switch" role="switch" aria-checked="' + (on ? 'true' : 'false') + '" data-act="' + fnName + '"' + (dis ? ' disabled' : '') + ' aria-label="' + label + '"></button></div>';
    }
    function sheetHead(title, sub){
      return '<h2>' + title + '<button type="button" class="x" data-act="close" aria-label="Cerrar panel">✕</button></h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '');
    }
    function renderSheet(){
      if(!activeSheet) return;
      let h = '';
      if(activeSheet === 'salud'){
        h += sheetHead('Salud', S.sleeping ? 'Durmiendo en la litera' : '');
        if(S.battFire){
          h += '<div class="bag-crisis" style="margin-bottom:8px"><b>🔥 ¡Baterías en candela!</b> El humo tóxico sube el estrés y consume aire.<div style="margin-top:6px"><button type="button" class="abtn primary" data-act="extinguish-batt">🧯 Apagar fuego de baterías (' + (S.clean >= 2 ? '2 L agua' : 'arena') + ')</button></div></div>';
        }
        h += barRow('Salud', S.health, Math.round(S.health) + '%', S.health < 30 ? 'red' : S.health < 60 ? 'amber' : '') +
             barRow('Hambre', S.hunger, Math.round(S.hunger) + '%', S.hunger < 25 ? 'red' : S.hunger < 50 ? 'amber' : '') +
             barRow('Sed', S.thirst, Math.round(S.thirst) + '%', S.thirst < 25 ? 'red' : S.thirst < 50 ? 'amber' : 'blue') +
             barRow('Estrés', S.stress, Math.round(S.stress) + '%', S.stress > 65 ? 'red' : S.stress > 40 ? 'amber' : '') +
             barRow('Radiación', S.expo, Math.round(S.expo) + '%', S.expo > 65 ? 'red' : S.expo > 35 ? 'amber' : '') +
             barRow('Aire', S.air, Math.round(S.air) + '%', S.air < 30 ? 'red' : S.air < 55 ? 'amber' : 'blue') +
             barRow('Temperatura', clamp((S.bunkerTemp + 5) / 35 * 100, 0, 100), Math.round(S.bunkerTemp) + ' °C', S.bunkerTemp < 8 ? '' : (S.bunkerTemp < 14 ? 'blue' : ''));
        h += '<div class="acts" style="margin-top:10px">' +
          '<button type="button" class="abtn primary" data-act="eat">Comer <span class="cost">' + S.food + '</span></button>' +
          '<button type="button" class="abtn primary" data-act="drink">Beber <span class="cost">' + Math.floor(S.clean) + ' L</span></button>' +
          '<button type="button" class="abtn" data-act="med">Botiquín <span class="cost">' + S.med + '</span></button>' +
          '<button type="button" class="abtn" data-act="sleep">' + (S.sleeping ? 'Despertar' : 'Dormir') + '</button>' +
          '<button type="button" class="abtn" data-act="radio">Radio</button>' +
          '</div>';
      }
      if(activeSheet === 'control'){
        ensureDailyFaultSchedule();
        const cap = effBattCap();
        const net = netPower();
        const dem = demandBreakdown();
        const battSecLeft = net < -0.005 ? (S.battery / (-net)) : Infinity;
        const battSub = S.battFire
          ? '🔥 ¡EN CANDELA! Apágala urgente'
          : (S.sysFault === 'batt_fire'
            ? 'Celda quemada (cap. máx ' + cap + ') · ' + (net >= 0 ? '+' + net.toFixed(2) : net.toFixed(2)) + ' W/s'
            : (net >= 0
              ? ('+' + net.toFixed(2) + ' W/s · cons. ' + dem.total.toFixed(2))
              : (dem.total.toFixed(2) + ' W/s · ~' + (battSecLeft > 300 ? Math.round(battSecLeft/60) + 'm' : Math.round(battSecLeft) + 's'))));
        const doneToday = Array.isArray(S.faultDone) ? S.faultDone.filter(Boolean).length : 0;
        h += sheetHead('Control', 'Fallas hoy: ' + doneToday + '/2 (máx. 2 por día, no seguidas)');
        const roleLabel = isAdmin() ? '👑 Administración completa' : '🛡 Usuario normal';
        const accLabel = (currentProfile && currentProfile.displayName) || currentUser || 'Superviviente';
        h += '<div class="role-banner ' + (isAdmin() ? 'admin' : '') + '">' +
          '<div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escHtml(accLabel) + '</b>' +
          '<span style="font-size:11.5px;color:var(--dim)">' + escHtml(currentUser || '') + '</span></div>' +
          '<span class="role-pill">' + roleLabel + '</span></div>';
        const cr = getActiveCrisis();
        if(cr){
          const haveCrPart = totalGenPartCount(cr.partId);
          h += '<div class="bag-crisis ' + (!S.battFire && haveCrPart > 0 ? 'ok' : '') + '" style="margin-bottom:8px">' +
            '<b>⚠️ ' + cr.crisisTitle + ' (' + cr.sysName + '):</b> ' + cr.crisisDesc +
            '<div style="margin-top:6px">';
          if(S.battFire){
            h += '<button type="button" class="abtn primary" data-act="extinguish-batt">🧯 Paso 1: Apagar fuego (' + (S.clean >= 2 ? '2 L agua' : 'arena') + ')</button>';
          } else if(haveCrPart > 0){
            h += '<button type="button" class="abtn primary" data-act="repair-crisis">🔧 Instalar ' + cr.partIcon + ' ' + cr.partName + ' en ' + cr.sysName + '</button>';
          } else {
            h += '<button type="button" class="abtn primary" data-act="go">🎒 Salir al yermo por ' + cr.partIcon + ' ' + cr.partName + '</button>';
          }
          h += '</div></div>';
        }
        const battPct = cap > 0 ? S.battery/cap*100 : 0;
        const genRun = S.genOn && !S.genStalled && !S.genFault && S.fuel > 0;
        h += '<div class="stat-block">' +
          statRow('Gasolina', S.genFault ? 'Check Engine · Avería' : (genRun ? 'En marcha · ' + (S.genRpm || 3000) + ' rpm · ' + Math.round(S.genTemp) + '°C' : 'Apagado'), S.fuel, (S.fuel * 0.1).toFixed(1) + ' L', 'fuelb') +
          statRow('Baterías', battSub, battPct, Math.round(battPct) + '%', S.battFire ? 'red' : 'chargeb') +
          '</div>';
        h += switchRow('Generador', S.genFault ? 'CHECK: ' + GEN_FAULTS[S.genFault].label : (genRun ? genKvaOut().toFixed(2) + ' kVA (+' + genOut().toFixed(2) + ' W/s) · ' + (S.genRpm || 3000) + ' rpm' : 'Apagado · ' + (S.genRpm || 3000) + ' rpm = ' + genKvaForRpm(S.genRpm || 3000).toFixed(2) + ' kVA'), genRun, 'sw-gen');
        h += switchRow('Calefacción', S.sysFault === 'heater_coil' ? 'FALLA: Bobina fundida (requiere 🔥 Bobina)' : (S.heaterOn === false ? 'Apagada · frío no mitigado' : (dem.heating > 0 ? (pow2() ? 'Activa · ' + dem.heating.toFixed(2) + ' W/s (' + Math.round(S.bunkerTemp) + '°C)' : 'Sin energía (' + Math.round(S.bunkerTemp) + '°C)') : 'En espera (' + Math.round(S.bunkerTemp) + '°C)')), S.heaterOn !== false && S.sysFault !== 'heater_coil', 'sw-heater');
        h += switchRow('Luces', S.lightsOn ? '0.32 W/s' : 'Apagadas', S.lightsOn, 'sw-lights');
        h += switchRow('Bomba de agua', S.sysFault === 'pump_valve' ? 'FALLA: Válvula reventada (requiere 🚰 Válvula)' : (S.pumpOn ? ((S.dirty > 0 && S.clean < CLEAN_CAP) ? '1.25 W/s' : '0.08 W/s') : 'Apagada'), S.pumpOn && S.sysFault !== 'pump_valve', 'sw-pump');
        h += switchRow('Ventilador', S.sysFault === 'fan_motor' ? 'FALLA: Motor quemado (requiere 🌀 Motor)' : (S.fanOn ? '0.95 W/s' : 'Apagado'), S.fanOn && S.sysFault !== 'fan_motor', 'sw-fan');
        h += barRow('Agua limpia', S.clean/CLEAN_CAP*100, Math.floor(S.clean) + ' L', 'blue');

        if(cr){
          h += '<div class="bag-crisis ' + (!S.battFire && havePart > 0 ? 'ok' : '') + '">' +
            '<b>⚠️ ' + cr.crisisTitle + ' (' + cr.sysName + ')</b><br>' + cr.crisisDesc +
            '<div style="margin-top:5px;font-weight:600">' +

              ? '🔥 ¡Primero apaga el fuego de las baterías antes de instalar la celda nueva!'
              : (havePart > 0
                ? '✅ Tienes ' + cr.partIcon + ' ' + cr.partName + ' lista para reparar ' + cr.sysName + '.'
                : '❌ Aún no tienes ' + cr.partIcon + ' ' + cr.partName + '. Sal al yermo a buscarla.')) +
            '</div></div>';
        }

        if(S.backpack.length === 0){
          h += '<p class="sub" style="margin:8px 0">Tu mochila está vacía. Cuando salgas al yermo, todas las piezas y suministros que encuentres vendrán aquí.</p>';

            h += '<div class="bag-card ' + (it.partId ? 'is-part' : '') + '">' +
              '<div class="bag-card-l"><span>' + it.icon + ' ' + it.label + '</span><b>×' + it.qty + '</b></div>' +

          h += '<button type="button" class="abtn primary" data-act="bag-unload">📥 Guardar todo en el búnker</button>';

          h += '<button type="button" class="abtn primary" data-act="repair-crisis">🔧 Instalar ' + cr.partName + ' en ' + cr.sysName + '</button>';
        }

          h += '<button type="button" class="abtn ' + (cr && !havePart ? 'primary' : '') + '" data-act="go">🧭 Salir al yermo a buscar piezas</button>';

    sheetEl.addEventListener('pointerdown', ()=>{ sheetHadPointerDown = true; });
    sheetEl.addEventListener('click', e=>{
      if(!sheetHadPointerDown && (e.detail > 0 || performance.now() - sheetOpenedAt < 450)){ e.preventDefault(); e.stopPropagation(); return; }
      const b = e.target.closest('[data-act]');
      if(!b || b.disabled) return;
      audio();
      const act = b.dataset.act;
      if(act === 'close') closeSheet();
      else if(act === 'toggle-mute') toggleMute();
      else if(act === 'story-replay'){ closeSheet(); openStoryOverlay(true); }
      else if(act === 'admin-open') openEditor();
      else if(act === 'open-admin-panel') openAdminUsersPanel();
      else if(act === 'admin-refresh-users') loadAdminUsersRoster();
      else if(act === 'admin-sync-layout'){
        if(isAdmin() && currentUid){
          const spPayload = JSON.stringify(customSpritesList).length < 360000 ? { list: customSpritesList } : { list: [] };
          saveGlobalLayoutCloud(currentUid, { version:2, elements:LAYOUT.elements }, spPayload)
            .then(()=>{ toast('☁️ <b>Diseño global publicado</b> para todos los jugadores.', 'good'); sfx.ok(); })
            .catch(()=>{ toast('No se pudo publicar el diseño en la nube.', 'bad'); sfx.err(); });
        }
      }
      else if(act === 'admin-reset-layout'){
        if(isAdmin()){
          resetLayout();
          toast('↺ Diseño del búnker restablecido.');
          sfx.ok();
        }
      }
      else if(act.indexOf('admin-role-') === 0) toggleTargetUserRole(act.slice(11));
      else if(act.indexOf('admin-del-') === 0) deleteTargetUser(act.slice(10));
      else if(act === 'logout'){
        if(!logoutArm){
          logoutArm = true; renderSheet();
          toast('Toca otra vez <b>Salir</b> para confirmar el cierre de sesión.');
          setTimeout(()=>{ logoutArm = false; if(activeSheet === 'control') renderSheet(); }, 4000);
        } else { logoutArm = false; doLogout(); }
      }
      else if(act === 'eat') actEat();
      else if(act === 'drink') actDrink();
      else if(act === 'med') actMedkit();
      else if(act === 'sleep') actSleepToggle();
      else if(act === 'radio') actRadio();
      else if(act === 'refuel') actRefuel();
      else if(act === 'extinguish-batt') actExtinguishBatt();
      else if(act === 'repair-crisis') actRepairActiveCrisis(false);
      else if(act === 'repairgen'){
        if(getActiveCrisis()) actRepairActiveCrisis(false);
        else actRepairGen();
      }
      else if(act === 'trigger-crisis') triggerBunkerCrisis();
      else if(act === 'open-bag') openSheet('mochila');
      else if(act === 'bag-unload') unloadBackpack(false);
      else if(act.indexOf('bag-item-') === 0) actBagItem(parseInt(act.slice(9), 10));
      else if(act.indexOf('scav-') === 0){
        if(act === 'scav-refresh') refreshExpedNodes();
        else scavengeExpedNode(parseInt(act.slice(5), 10));
      }
      else if(act === 'makemed'){
        if(S.scrap >= 3 && S.parts >= 1){ S.scrap -= 3; S.parts -= 1; S.med++; toast('Has fabricado un <b>botiquín</b>.','good'); sfx.ok(); refreshSheet(); }
        else { toast('Necesitas <b>3 chatarra · 1 pieza</b>.','bad'); sfx.err(); }
      }
      else if(act === 'sw-gen') actGenToggle();
      else if(act === 'sw-heater') toggleSwitch('heater');
      else if(act === 'sw-lights') toggleSwitch('lights');
      else if(act === 'sw-pump') toggleSwitch('pump');
      else if(act === 'sw-fan') toggleSwitch('fan');
      else if(act === 'go') startExped();
      else if(act === 'return') endExped(true);
      else if(act.indexOf('upg-') === 0){
        const u = UPGRADES[parseInt(act.slice(4), 10)];
        const lvl = S.levels[u.key];
        const cost = u.costs[lvl];
        if(cost && canPay(cost)){
          pay(cost);
          S.levels[u.key] = u.key === 'solar' ? 1 : lvl + 1;
          toast('<b>' + u.name + '</b> ' + (u.key === 'solar' ? 'reparado.' : 'mejorado a Nv ' + S.levels[u.key] + '.'), 'good');
          sfx.ok(); refreshSheet();
        }
      }
    });
    $('btn-return').addEventListener('click', ()=>{ audio(); endExped(true); });
    $('btn-exped-bag').addEventListener('click', ()=>{ audio(); openSheet('mochila'); });
    $('exped-spots').addEventListener('click', e=>{
      const b = e.target.closest('[data-spot]');
      if(!b || b.disabled) return;
      audio();
      const sp = b.dataset.spot;
      if(sp === 'refresh') refreshExpedNodes();
      else scavengeExpedNode(parseInt(sp, 10));
    });

    /* ---------- dock: estado compacto ---------- */
    function updateDock(){
      ensureBagState();
      const wxEl = $('dock-wx-name');
      wxEl.textContent = S.weather.name + ' · ' + Math.round(S.bunkerTemp) + '°C';
      wxEl.className = S.bunkerTemp < 8 ? 'freeze' : (S.bunkerTemp < 14 || S.weather.id === 'snow' ? 'cold' : '');
      $('dock-clock').textContent = 'Día ' + S.day + ' · ' + fmtHour(S.hour) + (S.sleeping ? ' · durmiendo' : '');
      $('dock-wx-icon').innerHTML = wxIcon();
      const hVal = Math.round(clamp(S.hunger, 0, 100));
      const tVal = Math.round(clamp(S.thirst, 0, 100));
      const hCls = hVal < 22 ? 'crit' : hVal < 45 ? 'warn' : '';
      const tCls = tVal < 22 ? 'crit' : tVal < 45 ? 'warn' : '';
      const critHunger = hVal < 22;
      const critThirst = tVal < 22;
      const cap = effBattCap() || 100;
      const bpct = cap > 0 ? clamp(S.battery / cap * 100, 0, 100) : 0;
      const cr = getActiveCrisis();
      const critPower = !pow2() || bpct < 15 || !!cr || !!S.battFire;
      const bagUsed = backpackUsed();
      const haveFaultPart = cr ? totalGenPartCount(cr.partId) > 0 : false;
      $('dock-hunger-val').textContent = hVal + '%';
      $('dock-hunger-val').className = hCls;
      $('dock-hunger-bar').style.width = hVal + '%';
      $('dock-hunger-bar').className = hCls;
      $('dock-thirst-val').textContent = tVal + '%';
      $('dock-thirst-val').className = tCls;
      $('dock-thirst-bar').style.width = tVal + '%';
      $('dock-thirst-bar').className = tCls;
      $('need-hunger').classList.toggle('crit-blink', critHunger);
      $('need-thirst').classList.toggle('crit-blink', critThirst);
      $('db-salud').classList.toggle('crit-blink', critHunger || critThirst || !!S.battFire);
      $('db-control').classList.toggle('crit-blink', critPower);
      $('db-explorar').classList.toggle('crit-blink', !!(cr && !haveFaultPart && !S.exped && !S.battFire));
      $('db-mochila').classList.toggle('crit-blink', !!(bagUsed >= BACKPACK_CAP || (cr && haveFaultPart && !S.battFire)));
      const bagCntEl = $('bag-count');
      if(bagCntEl){
        bagCntEl.hidden = bagUsed <= 0;
        bagCntEl.textContent = bagUsed;
      }
      $('badge-salud').classList.toggle('show', S.health < 35 || S.hunger < 20 || S.thirst < 20 || S.stress > 85 || S.expo > 65 || S.bunkerTemp < 10 || !!S.battFire);
      $('badge-control').classList.toggle('show', S.genStalled || !!cr || !!S.battFire || !!S.solarFault || !pow2() || bpct < 10 || S.fuel < 12 || S.oil < 20 || (S.bunkerTemp < 13 && (!pow2() || netPower() < 0 || S.heaterOn === false)));
      $('badge-explorar').classList.toggle('show', !!S.exped || !!(cr && !haveFaultPart));
      $('badge-mochila').classList.toggle('show', bagUsed > 0 || !!(cr && haveFaultPart));
      const bn = $('exped-banner');
      if(S.exped){
        bn.hidden = false;
        $('exped-bar').style.width = clamp(S.exped.t / S.exped.dur * 100, 0, 100) + '%';
        $('exped-txt').textContent = 'Explorando el yermo · rad ' + Math.round(S.expo) + '%';
        $('exped-bag-cnt').textContent = bagUsed + '/' + BACKPACK_CAP;
        const objEl = $('exped-obj');
        if(cr){
          objEl.hidden = false;
          objEl.className = 'exped-obj' + (haveFaultPart ? ' found' : '');
          objEl.innerHTML = haveFaultPart
            ? '<span>✅ <b>' + cr.partIcon + ' ' + cr.partName + '</b> (' + cr.sysName + ') en mochila</span><span>¡Vuelve al búnker!</span>'
            : '<span>⚠️ Buscando para ' + cr.sysName + ': <b>' + cr.partIcon + ' ' + cr.partName + '</b></span><span>Rebusca abajo</span>';
        } else {
          objEl.hidden = true;
        }
        const spotsEl = $('exped-spots');
        if(spotsEl && Array.isArray(S.exped.nodes)){
          const spSig = S.exped.nodes.map(n => n.id + ':' + (n.searched ? 1 : 0)).join('|') + '|' + bagUsed;
          if(spotsEl.dataset.sig !== spSig){
            spotsEl.dataset.sig = spSig;
            let sh = '';
            S.exped.nodes.forEach((nd, idx)=>{
              sh += '<button type="button" class="' + (nd.searched ? 'sec' : '') + '" data-spot="' + idx + '"' + (nd.searched ? ' disabled' : '') + '>' +
                (nd.searched ? '✓ ' + nd.short : '🔍 ' + nd.short) + '</button>';
            });
            sh += '<button type="button" class="sec" data-spot="refresh">🔄 Otra zona</button>';
            spotsEl.innerHTML = sh;
          }
        }
        const bagRowEl = $('exped-bag-row');
        if(bagRowEl){
          if(S.backpack.length === 0){
            bagRowEl.innerHTML = '<span>🎒 Mochila vacía · toca los puntos del yermo para guardar piezas y recursos</span>';

    let VW = 0, VH = 0, dpr = 1;
    const view = { s:1, ox:0, oy:0 };
    const pan = { x:0, y:0 };
    function effView(){
      if(viewMode !== 'auto') return viewMode;
      /* PANTALLA COMPLETA: la imagen del búnker llena todo el viewport
         (cover, sin deformar); el dock delgado va superpuesto encima y
         se recorre arrastrando */
      return 'cover';

    function computeView(){
      if(!VW || !VH) return;
      if(editor.active && editor.getState){
        const es = editor.getState();
        view.s = es.zoom || 0.45;
        view.ox = (VW - W * view.s) / 2 + (es.panX || 0);
        view.oy = (VH - H * view.s) / 2 + (es.panY || 0);
        return;
      }
      if(effView() === 'fit'){
        /* VH es el viewport entero: el búnker completo encaja en VW × VH */
        const availH = Math.max(200, VH);
        const s = Math.min(VW/W, availH/H);
        view.s = s; pan.x = 0; pan.y = 0;
        view.ox = (VW - W*s)/2;
        view.oy = Math.max(0, (availH - H*s)/2);
      } else {
        const s = Math.max(VW/W, VH/H);
        view.s = s;
        const bx = (VW - W*s)/2, by = (VH - H*s)/2;
        if(W*s <= VW) pan.x = 0; else pan.x = clamp(pan.x, (VW - W*s) - bx, -bx);
        if(H*s <= VH) pan.y = 0; else pan.y = clamp(pan.y, (VH - H*s) - by, -by);
        view.ox = bx + pan.x;
        view.oy = by + pan.y;
      }
    }

      const bpct = cap > 0 ? clamp(S.battery / cap * 100, 0, 100) : 100;
      const low10 = cap > 0 && bpct < 10;
      const draining = netPower() < 0.05 || !powered();
      if(low10 && !critFlags.batt10){

      critFlags.batt10 = low10;
      if(low10 && draining){

        battAlarmT += realDt;

      if(currentUid) clearCloudProgress(currentUid).catch(()=>{});
    }
    function applySaveObject(sv){
      if(!sv || typeof sv !== 'object') return false;
      S = newState();
      ['day','hour','weatherT','health','hunger','thirst','stress','expo','air','bunkerTemp','battery','fuel','oil','genTemp','genRpm','genRunHours','genTotalHours','cond',
       'genOn','genStalled','genFault','sysFault','battFire','faultDay','faultCooldownH','lastFaultSys','lightsOn','pumpOn','fanOn','heaterOn','clean','dirty','food','cans','scrap','parts',
       'spares','med','solarCond','solarFault','growth','cropType','cropPlanted','autoIrrig','speed',
       'tutStage','cobGen','cobFan','crisisTimer','crisisCount'].forEach(k=>{
        if(typeof sv[k] !== 'undefined') S[k] = sv[k];
      });
      if(Array.isArray(sv.faultHours) && sv.faultHours.length === 2) S.faultHours = sv.faultHours.slice(0,2);
      if(Array.isArray(sv.faultDone) && sv.faultDone.length === 2) S.faultDone = sv.faultDone.map(Boolean);
      if(sv.genParts && typeof sv.genParts === 'object') S.genParts = Object.assign(newState().genParts, sv.genParts);
      if(Array.isArray(sv.backpack)) S.backpack = sv.backpack;
      ensureBagState();
      ensureDailyFaultSchedule();
      S.weatherT = clamp(typeof sv.weatherT === 'number' ? sv.weatherT : 1, 0.01, 1);
      S.bunkerTemp = clamp(typeof sv.bunkerTemp === 'number' ? sv.bunkerTemp : 21, -5, 38);
      S.heaterOn = typeof sv.heaterOn === 'boolean' ? sv.heaterOn : true;
      S.autoIrrig = typeof sv.autoIrrig === 'boolean' ? sv.autoIrrig : true;
      S.genRpm = clamp(Math.round((S.genRpm || GEN_RPM_NOM) / GEN_RPM_STEP) * GEN_RPM_STEP, GEN_RPM_MIN, GEN_RPM_MAX);
      S.hour = ((Number(S.hour) || 8) % 24 + 24) % 24;
      S.genRunHours = clamp(Number(S.genRunHours) || 0, 0, 24);
      S.genTotalHours = Math.max(0, Number(S.genTotalHours) || 0);
      if(typeof sv.genTotalHours === 'undefined') S.genTotalHours = S.genRunHours || 0;
      if(typeof sv.cropPlanted === 'undefined' && S.growth > 0){
        S.cropPlanted = true;
        if(!S.cropType) S.cropType = 'tomato';
      }
      if(typeof sv.tutDone === 'undefined'){ S.tutDone = true; S.tutStage = 0; S.cobGen = false; S.cobFan = false; }
      else S.tutDone = !!sv.tutDone;
      if(sv.levels) S.levels = Object.assign(newState().levels, sv.levels);
      S.weather = WEATHERS.find(w=> w.id === sv.weatherId) || WEATHERS[0];
      S.speed = 1;
      S.started = true;
      dispClean = clamp(S.clean/CLEAN_CAP, 0, 1); dispDirty = clamp(S.dirty/80, 0, 1);
      return true;
    }
    function restoreSave(email){
      const sv = lsGet(LS_SAVES, {})[email];
      return applySaveObject(sv);
    }
    function loadAdminUsersRoster(){
      if(!isAdmin()) return;
      adminUsersLoading = true; adminUsersErr = '';
      if(activeSheet === 'admin') renderSheet();
      listAllUsersCloud().then(list=>{
        adminUsersList = list;
        adminUsersLoading = false;
        if(activeSheet === 'admin') renderSheet();
      }).catch(()=>{
        adminUsersLoading = false;
        adminUsersErr = 'No se pudo cargar la lista de usuarios.';
        if(activeSheet === 'admin') renderSheet();
      });
    }
    function openAdminUsersPanel(){
      if(!isAdmin()){ toast('Acceso restringido al administrador.'); sfx.err(); return; }
      openSheet('admin');
      loadAdminUsersRoster();
    }
    function toggleTargetUserRole(uid){
      if(!isAdmin()) return;
      const target = adminUsersList.find(u=> u.uid === uid);
      if(!target || target.isBootstrapAdmin) return;
      const nextRole = target.role === 'admin' ? 'user' : 'admin';
      updateUserRoleCloud(uid, nextRole).then(()=>{
        target.role = nextRole;
        toast('Rol de <b>' + escHtml(target.displayName) + '</b> actualizado a <b>' + (nextRole === 'admin' ? 'Administrador' : 'Usuario normal') + '</b>.', 'good');
        sfx.ok();
        if(activeSheet === 'admin') renderSheet();
      }).catch(()=>{ toast('No se pudo cambiar el rol del usuario.', 'bad'); sfx.err(); });
    }
    function deleteTargetUser(uid){
      if(!isAdmin() || uid === currentUid) return;
      const target = adminUsersList.find(u=> u.uid === uid);
      if(!target || target.isBootstrapAdmin) return;
      deleteUserProfileCloud(uid).then(()=>{
        adminUsersList = adminUsersList.filter(u=> u.uid !== uid);
        toast('Cuenta de <b>' + escHtml(target.displayName) + '</b> eliminada.');
        sfx.ok();
        if(activeSheet === 'admin') renderSheet();
      }).catch(()=>{ toast('No se pudo eliminar esa cuenta.', 'bad'); sfx.err(); });
    }
    function enterBunker(restored){
      critFlags = {}; battAlarmT = 0; tapped = null;
      genDialPhys.init = false;
      closeEquipModal();
      closeSheet();
      $('ov-login').hidden = true; $('ov-dead').hidden = true;
      $('dockwrap').hidden = false;
      $('top-wx-btn').hidden = false;
      if($('top-mute-btn')) $('top-mute-btn').hidden = false;
      syncMuteUi();
      AMB.prevGenRun = !!(S.genOn && !S.genStalled && !S.genFault && S.fuel > 0);
      updateAdminFab();
      resize();
      if(restored) toast('Bienvenido de nuevo a <b>BunkerDay</b>. Tu partida sigue en el <b>día ' + S.day + '</b>.');
      else if(S.tutDone) toast('Bajo la tierra te espera el refugio <b>BunkerDay</b>. Sellas la escotilla y el generador ronronea… por ahora. Toca los equipos para usarlos.');
      updateDock();
      maybeStartTutorial();
    }
    if($('top-mute-btn')) $('top-mute-btn').addEventListener('click', toggleMute);
    syncMuteUi();
    function loginError(msg){ $('login-err').textContent = msg; if(msg) sfx.err(); }
    function setAuthLoading(on, label){
      authBusy = on;
      const bl = $('btn-login'), bg = $('btn-google-login');
      if(bl){ bl.disabled = on; bl.textContent = on ? (label || 'Conectando…') : (loginMode === 'login' ? 'Entrar al búnker' : 'Crear cuenta'); }
      if(bg) bg.disabled = on;
    }
    function translateAuthError(err){
      const code = (err && err.code) ? String(err.code) : '';
      const msg = (err && err.message) ? String(err.message) : '';
      if(code === 'auth/email-already-in-use') return 'Ese correo ya está registrado. Cambia a "Iniciar sesión".';
      if(code === 'auth/invalid-email') return 'Escribe un correo válido, por ejemplo tu@correo.com.';
      if(code === 'auth/weak-password') return 'La contraseña debe tener al menos 6 caracteres.';
      if(code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') return 'Correo o contraseña incorrectos.';
      if(code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return 'Ventana de Google cerrada antes de completar el acceso.';
      if(code === 'auth/popup-blocked') return 'El navegador bloqueó la ventana emergente de Google. Permite ventanas emergentes e inténtalo de nuevo.';
      if(code === 'auth/operation-not-allowed') return 'El acceso por correo y contraseña no está habilitado en este momento. Usa "Continuar con Google".';
      if(code === 'auth/too-many-requests') return 'Demasiados intentos seguidos. Espera un momento e inténtalo de nuevo.';
      if(msg.includes('Missing or insufficient permissions')) return 'Permisos insuficientes. Verifica tu sesión e inténtalo de nuevo.';
      return 'No se pudo conectar con el servidor. Inténtalo de nuevo.';
    }
    function setLoginMode(mode){
      loginMode = mode;
      const isReg = mode === 'register';
      const formEl = $('login-form');
      if(formEl) formEl.classList.toggle('is-register', isReg);
      if($('tab-login')){ $('tab-login').classList.toggle('on', !isReg); $('tab-login').setAttribute('aria-selected', !isReg ? 'true' : 'false'); }
      if($('tab-register')){ $('tab-register').classList.toggle('on', isReg); $('tab-register').setAttribute('aria-selected', isReg ? 'true' : 'false'); }
      if($('login-logo')) $('login-logo').hidden = isReg;
      if($('btn-google-login')) $('btn-google-login').hidden = isReg;
      if($('login-sep')) $('login-sep').hidden = isReg;
      $('btn-login').textContent = isReg ? 'Crear cuenta' : 'Entrar al búnker';
      $('li-pass').setAttribute('autocomplete', isReg ? 'new-password' : 'current-password');
      if($('li-name-wrap')) $('li-name-wrap').hidden = !isReg;
      if($('li-name')){
        $('li-name').disabled = !isReg;
        if(!isReg) $('li-name').value = '';
      }
      if($('li-pass2-wrap')) $('li-pass2-wrap').hidden = !isReg;
      if($('li-pass2')){
        $('li-pass2').disabled = !isReg;
        $('li-pass2').required = isReg;
        $('li-pass2').value = '';
      }
      if($('login-note')) $('login-note').textContent = isReg
        ? 'Crea tu cuenta en BunkerDay.com · Tu partida se guarda en la nube.'
        : 'Acceso seguro · Tu partida se guarda en la nube.';
      $('login-err').textContent = '';
    }
    async function enterWithFirebaseProfile(fbUser, profile){
      currentUid = fbUser.uid;
      currentUser = profile.email || (fbUser.email || fbUser.uid).toLowerCase();
      currentProfile = profile;
      lsSet(LS_SESS, currentUser);
      const users = lsGet(LS_USERS, {});
      users[currentUser] = { tutDone: !!profile.tutDone, role: profile.role };
      lsSet(LS_USERS, users);

      try{
        const cloudLayout = await loadGlobalLayoutCloud();
        if(cloudLayout && cloudLayout.layout && Array.isArray(cloudLayout.layout.elements) && cloudLayout.layout.elements.length){
          LAYOUT.elements = syncBuiltinElementMeta(cloudLayout.layout.elements);
          try { localStorage.setItem(LS_LAYOUT, JSON.stringify({ version:2, elements:LAYOUT.elements })); } catch(e){}
        }
        if(cloudLayout && cloudLayout.sprites && Array.isArray(cloudLayout.sprites.list) && cloudLayout.sprites.list.length){
          customSpritesList = cloudLayout.sprites.list;
          try { localStorage.setItem(LS_SPRITES, JSON.stringify(customSpritesList)); } catch(e){}
        }
      } catch(e){}

      let restored = false;
      try{
        const cloudSv = await loadCloudProgress(fbUser.uid);
        if(cloudSv) restored = applySaveObject(cloudSv);
      } catch(e){}
      if(!restored){
        restored = restoreSave(currentUser);
      }
      if(!restored){
        S = newState(); S.started = true;
        if(profile.tutDone) S.tutDone = true;
        else applyDeadStart();
      }
      sfx.ok();
      enterBunker(restored);
      saveProgress(true);
      if(profile.isNew){
        setTimeout(()=>{
          if(profile.role === 'admin'){
            toast('👑 <b>¡Primer usuario registrado!</b> Se te asignó el rol de <b>Administración completa</b>.', 'good');
          } else {
            toast('🛡 Cuenta creada con rol de <b>Usuario normal</b>.');
          }
        }, 650);
      }
    }
    if($('tab-login')) $('tab-login').addEventListener('click', ()=> setLoginMode('login'));
    if($('tab-register')) $('tab-register').addEventListener('click', ()=> setLoginMode('register'));
    $('btn-google-login').addEventListener('click', async ()=>{
      if(authBusy) return;
      audio();
      $('login-err').textContent = '';
      setAuthLoading(true, 'Abriendo Google…');
      try{
        await loginWithGooglePopup();
      } catch(err){
        setAuthLoading(false);
        loginError(translateAuthError(err));
      }
    });
    $('login-form').addEventListener('submit', async e=>{
      e.preventDefault();
      if(authBusy) return;
      audio();
      const email = $('li-email').value.trim().toLowerCase();
      const pass = $('li-pass').value;
      const pass2 = $('li-pass2') ? $('li-pass2').value : '';
      const nameVal = (loginMode === 'register' && $('li-name')) ? $('li-name').value.trim() : '';
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ loginError('Escribe un correo válido, por ejemplo tu@correo.com.'); return; }
      if(pass.length < 6){ loginError('La contraseña necesita al menos 6 caracteres.'); return; }
      if(loginMode === 'register' && pass !== pass2){ loginError('Las contraseñas no coinciden.'); return; }
      $('login-err').textContent = '';
      setAuthLoading(true, loginMode === 'register' ? 'Creando cuenta…' : 'Iniciando sesión…');
      try{
        if(loginMode === 'register'){
          pendingRegisterName = nameVal;
          await registerWithEmailPassword(email, pass, nameVal);
        } else {
          pendingRegisterName = '';
          await loginWithEmailPassword(email, pass);
        }
        $('li-pass').value = '';
        if($('li-pass2')) $('li-pass2').value = '';
      } catch(err){
        pendingRegisterName = '';
        setAuthLoading(false);
        loginError(translateAuthError(err));
      }
    });
    async function doLogout(){
      saveProgress(true);
      clearTimeout(cloudSaveTimer);
      if(editor.active) closeEditor();
      lsDel(LS_SESS);
      currentUser = null; currentUid = null; currentProfile = null;
      adminUsersList = [];
      S = newState();
      critFlags = {}; battAlarmT = 0; tapped = null;
      closeSheet();
      closeEquipModal();
      tutAbort();
      if($('ov-story')) $('ov-story').hidden = true;
      $('ov-dead').hidden = true;
      $('dockwrap').hidden = true;
      $('top-wx-btn').hidden = true;
      if($('top-mute-btn')) $('top-mute-btn').hidden = true;
      $('ov-login').hidden = false;
      updateAdminFab();
      setLoginMode('login');
      sfx.click();
      try { await logoutFirebase(); } catch(e){}
    }
    document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveProgress(true); });
    addEventListener('beforeunload', ()=>{ saveProgress(true); });

    /* reinicio tras morir: partida nueva para la misma cuenta */
    function startGame(){
      audio();
      clearSave();
      const keepTut = S.tutDone || userTutDone();
      S = newState(); S.started = true;
      if(keepTut) S.tutDone = true; else applyDeadStart();
      critFlags = {}; battAlarmT = 0; tapped = null;
      genDialPhys.init = false;
      AMB.prevGenRun = !!(S.genOn && !S.genStalled && !S.genFault && S.fuel > 0);
      closeSheet();
      closeEquipModal();
      if($('ov-story')) $('ov-story').hidden = true;
      $('ov-login').hidden = true; $('ov-dead').hidden = true;
      $('dockwrap').hidden = false;
      $('top-wx-btn').hidden = false;
      if($('top-mute-btn')) $('top-mute-btn').hidden = false;
      syncMuteUi();
      updateAdminFab();
      resize();
      if(keepTut) toast('Encuentras el refugio <b>BunkerDay</b> y sellas la escotilla. El generador ronronea… por ahora. Toca los equipos para usarlos.');
      updateDock();
      saveProgress(true);
      maybeStartTutorial();
    }
    $('btn-again').addEventListener('click', startGame);

    /* sesión Firebase activa al cargar o al iniciar sesión */
    onFirebaseAuth(async (fbUser)=>{
      if(!fbUser){
        setAuthLoading(false);
        if(S.started && currentUid){
          currentUser = null; currentUid = null; currentProfile = null;
          S = newState();
          closeSheet(); closeEquipModal(); tutAbort();
          if($('ov-story')) $('ov-story').hidden = true;
          $('dockwrap').hidden = true;
          $('top-wx-btn').hidden = true;
          if($('top-mute-btn')) $('top-mute-btn').hidden = true;
          $('ov-login').hidden = false;
          updateAdminFab();
        }
        return;
      }
      if(currentUid === fbUser.uid && S.started){
        setAuthLoading(false);
        return;
      }
      setAuthLoading(true, 'Cargando perfil…');
      try{
        const prof = await ensureUserProfile(fbUser, pendingRegisterName);
        pendingRegisterName = '';
        setAuthLoading(false);
        await enterWithFirebaseProfile(fbUser, prof);
      } catch(err){
        pendingRegisterName = '';
        setAuthLoading(false);
        loginError(translateAuthError(err));
      }
    });
    setLoginMode('login');
    resize();
    updateDock();
    updateAdminFab();

    window.UD_ENGINE = {
      W, H, cv, ctx, view, LAYOUT, PRESET_SPRITES, ACTION_LIST, SPRITE_LIB,
      getElement, saveLayout, resetLayout, importLayout, getSpriteImage,
      shapePath, elementHitTest, computeView, canvasPos, toast, sfx,
      openEditor, closeEditor, isAdmin, setAdmin, editor
    };
    window.dispatchEvent(new Event('ud-engine-ready'));
    </script>
    <script type="module" src="/src/admin-editor.js"></script>
